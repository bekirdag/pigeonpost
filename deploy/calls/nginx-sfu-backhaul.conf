# /etc/nginx/sites-enabled/livekit-backhaul on the media host. TLS in front of LiveKit's loopback
# port, for exactly one client: raijin's nginx (browsers' signaling) and the calls service (admin
# API). ufw admits 7443 only from raijin's address, and raijin trusts only this self-signed
# certificate, so no public certificate or DNS name is needed for this hop.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen MEDIA_HOST_IP:7443 ssl;
    server_name sfu-backhaul.pigeonpost.internal;
    ssl_certificate     /etc/livekit/backhaul.crt;
    ssl_certificate_key /etc/livekit/backhaul.key;
    ssl_protocols TLSv1.3;
    # The browsers' media-server tickets travel in the query string: never log requests here.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 64k;
    }
}
