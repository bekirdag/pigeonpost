# Inside the inbox.pigeonpost.dev server block. Same origin as the app, so the inbox's CSP
# (connect-src 'self') already allows it and no CORS is needed.
location /calls/ {
    proxy_pass http://127.0.0.1:8795;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The event stream must not be buffered; the service also sends X-Accel-Buffering: no so an
    # nginx in front of this one passes it through unbuffered too.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 256k;
}
