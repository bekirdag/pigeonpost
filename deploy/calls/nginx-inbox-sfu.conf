# Inside the inbox.pigeonpost.dev server block on raijin, next to `location /calls/`. Browsers reach
# the media server's signaling on the inbox's own origin (wss://inbox.pigeonpost.dev/sfu/…), so the
# inbox's CSP (connect-src 'self') needs no change. Media itself goes straight to the media host's
# UDP/TCP ports, not through here. Needs `map $http_upgrade $connection_upgrade` at http level.
location /sfu/ {
    # The admin API is for the calls service only, which reaches it directly.
    location /sfu/twirp/ { return 404; }
    proxy_pass https://MEDIA_HOST_IP:7443/;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx-raijin-webapps/sfu-backhaul.crt;
    proxy_ssl_name sfu-backhaul.pigeonpost.internal;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host sfu-backhaul.pigeonpost.internal;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 64k;
    # Media-server tickets travel in the query string: never log them.
    access_log off;
}
