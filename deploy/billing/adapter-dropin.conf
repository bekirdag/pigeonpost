[Service]
# Phase 2 billing bridge: durable intent state, private postbox link, iyzico mode.
StateDirectory=pigeonpost-store-adapter
StateDirectoryMode=0700
Environment=STORE_STATE_DIR=/var/lib/pigeonpost-store-adapter
Environment=POSTBOX_INTERNAL_URL=http://127.0.0.1:18991
Environment=IYZICO_MODE=live
Environment=MASAAS_TENANT_ID=pigeonpost
