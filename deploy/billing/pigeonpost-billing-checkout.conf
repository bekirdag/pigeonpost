# Pigeonpost hosted payment page (Phase 2). The iyzico form runs here and only here: its CSP
# admits iyzico hosts and one per-request nonce; /account keeps its strict policy.
location = /billing/checkout {
    try_files /billing/checkout.html =404;
    sub_filter '__CSP_NONCE__' $request_id;
    sub_filter_once on;
    sub_filter_types text/html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://*.iyzipay.com; style-src 'self' 'unsafe-inline' https://*.iyzipay.com; img-src 'self' data: https://*.iyzipay.com; font-src 'self' data: https://*.iyzipay.com; connect-src 'self' https://*.iyzipay.com; frame-src https://*.iyzipay.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://*.iyzipay.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
}
location = /billing/checkout.html { return 404; }
location = /billing/checkout.js { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
