# enterprise.pigeonpost.dev — the Pigeonpost for teams portal (site-enterprise/, SDS §5, §22.1).
#
# Two parts, following the inbox: raijin's own nginx serves the files and the billing bridge, and
# wodomini terminates TLS and proxies to it (Cloudflare → wodomini → raijin). Check the inbox's
# current server blocks on both hosts before installing and copy their listen/TLS lines exactly;
# the ones below are placeholders for that pattern.

# ---- raijin: /etc/nginx-raijin-webapps/nginx.conf (inside its http block) ------------------------
server {
    listen 48880;                       # same listener as inbox.pigeonpost.dev (wildcard DNS already reaches it)
    server_name enterprise.pigeonpost.dev;
    root /var/www/pigeonpost-enterprise;
    index index.html;
    charset utf-8;

    # Every page: same-origin scripts and styles only. The postbox and the realm are the only other
    # origins the pages talk to; the bridge is same-origin under /api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev https://auth.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The billing bridge (store-adapter, 127.0.0.1:8787): sign-in code exchange, catalog, the
    # enterprise checkout and Talk to sales. Same service pigeonpost.dev/api reaches.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # use the wodomini-forwarded address if real_ip is configured
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;   # the bridge sends Cache-Control: no-store itself
    }

    # Never use add_header inside the locations below (except /checkout, which restates them all):
    # nginx drops every server-level add_header in a location that has one of its own.

    # The invitation token is in the fragment and never reaches nginx; keep the page out of the
    # access log anyway, so not even the visit is recorded against an address.
    location = /invite { access_log off; expires -1; try_files /invite.html =404; }

    # The one sign-in return path Keycloak allowlists. Codes are single use; don't log them.
    location = /auth/callback { access_log off; expires -1; try_files /auth/callback.html =404; }

    # The admin app: every /app/<page> is the same document.
    location = /app { try_files /app.html =404; }
    location /app/ { try_files /app.html =404; }

    # The iyzico hosted payment form runs here and only here: its CSP admits iyzico hosts and one
    # per-request nonce (as pigeonpost.dev/billing/checkout does). Every other page keeps the strict
    # policy above. add_header in this block replaces the server-level headers, so repeat them.
    location = /checkout {
        try_files /checkout.html =404;
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once on;
        sub_filter_types text/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://*.iyzipay.com; style-src 'self' 'unsafe-inline' https://*.iyzipay.com; img-src 'self' data: https://*.iyzipay.com; font-src 'self' data: https://*.iyzipay.com; connect-src 'self' https://postbox.pigeonpost.dev https://*.iyzipay.com; frame-src https://*.iyzipay.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://*.iyzipay.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }
    location = /checkout.html { return 404; }
    location = /checkout.js { expires -1; }
    location = /checkout/return { expires -1; try_files /checkout/return.html =404; }

    # Clean URLs: /start -> start.html. Raw .html URLs are not linked anywhere.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Static assets: short cache (no build step, so no hashed names). `expires`, not add_header,
    # so the server-level security headers above still apply (an add_header here would drop them).
    location ~* \.(css|js|woff2|png|ico)$ {
        expires 5m;
    }
}

# ---- wodomini: /etc/nginx/sites-enabled/pigeonpost-enterprise.conf ------------------------------
# A copy of sites-enabled/pigeonpost-inbox.conf with the name changed: TLS on 443 for
# enterprise.pigeonpost.dev (certificate issued the same way as the inbox's), then
