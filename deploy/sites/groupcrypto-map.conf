# Include once in http {}, before the inbox server. Only a complete lowercase SHA-256 may
# select a bundle. Keep the legacy unversioned files for browsers already using that loader.
map $arg_v $pp_groupcrypto_root {
    "" /vendor/groupcrypto;
    default /__pp_unknown_crypto_version__;
    "~^[0-9a-f]{64}$" /vendor/groupcrypto/bundles/$arg_v;
}
