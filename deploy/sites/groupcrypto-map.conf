# Include once in http {}, before the inbox server. Only a complete lowercase SHA-256 may
# select a bundle (bundles/<sha>/, immutable). The unversioned names and the legacy
# 20261020-p3a alias serve the top-level files, which deploy-groupcrypto.sh keeps as a mirror of
# the CURRENT bundle: old cached loaders import them unversioned, so they must never hold an older
# WASM (audit 2026-11-03 P0-1). check-groupcrypto-served.py fails if they drift.
map $arg_v $pp_groupcrypto_root {
    "" /vendor/groupcrypto;
    "20261020-p3a" /vendor/groupcrypto;
    default /__pp_unknown_crypto_version__;
    "~^[0-9a-f]{64}$" /vendor/groupcrypto/bundles/$arg_v;
}
