# Include inside the pigeonpost.dev server; leaves the default script-free CSP unchanged.
location = /partners {
    try_files /partners.html =404;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://postbox.pigeonpost.dev; style-src 'self'; script-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-store always;
}

location = /partners.html {
    try_files /partners.html =404;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://postbox.pigeonpost.dev; style-src 'self'; script-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-store always;
}
