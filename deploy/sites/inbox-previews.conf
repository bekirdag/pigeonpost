# Include inside the inbox.pigeonpost.dev TLS server. Replaces its existing CSP header.
# Only passive attachment bytes become blob URLs. Documents are rasterized by the local worker.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev https://auth.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

# nginx installations predating ES modules do not map .mjs in their default mime.types.
location /pdfjs/ {
    types {
        application/javascript mjs;
        application/octet-stream bcmap pfb;
        font/ttf ttf;
    }
    try_files $uri =404;
}
