# developers.pigeonpost.dev — the static developer documentation (site-developers/, SDS §18.6).
#
# Served by raijin's own nginx (/etc/nginx-raijin-webapps/nginx.conf, inside its http block);
# wodomini terminates TLS and proxies to it (Cloudflare → wodomini → raijin), like the inbox.
# Phase 5 added /docs.js (copy buttons for command snippets), so scripts are now allowed from this
# origin only: no framework, no inline scripts or handlers, no other script origin.
server {
    listen 48880;
    server_name developers.pigeonpost.dev;

    root /var/www/pigeonpost-developers;
    index index.html;

    # Pages are generated as <slug>.html and linked as /<slug>.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /docs.css { expires 1d; }
    location = /docs.js { expires 1d; }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
