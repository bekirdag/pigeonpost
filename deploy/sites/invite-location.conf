# Include inside the pigeonpost.dev TLS server (SDS §14D, docs/contacts-and-phone.md §5).
# The SMS invitation landing page: its one script may call only the postbox's public opt-out route.
location ~ ^/invite(?:\.html|/)?$ {
    try_files /invite.html =404;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://postbox.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
}
