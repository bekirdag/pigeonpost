# Include in the inbox server before other regex locations. Install the complete immutable
# bundle before publishing its HTML entry. Unknown versions fail closed instead of using bytes
# from another bundle. Security headers, MIME types and caching inherit the existing vhost.
location ~ ^/vendor/groupcrypto/(?<pp_groupcrypto_file>loader\.js|integrity\.js|pigeonpost_groupcrypto\.js|pigeonpost_groupcrypto_bg\.wasm)$ {
    try_files $pp_groupcrypto_root/$pp_groupcrypto_file =404;
}
