# The signed-in platforms (plan docs/planning/2026-11-14-platform-separation-build-plan.md):
# account. (a person), partner. (publishers), management. (Pigeonpost staff). enterprise. keeps
# deploy/sites/enterprise.conf. Paste into /etc/nginx-raijin-webapps/nginx.conf on raijin next to
# the enterprise server; wildcard DNS through Cloudflare already reaches :48880.
#
# Layout of each root (deploy/sites/deploy-platforms.sh): the platform's own files plus the shared
# shell copied to /shared/. One HTML document per platform; routes are fragments (#/page/...).
#
# Never use add_header inside a location below except where the location restates every header:
# nginx drops the server-level add_header set in any location that has one of its own.

# ---- account.pigeonpost.dev -------------------------------------------------------------------
server {
    listen 48880;
    server_name account.pigeonpost.dev;
    root /var/www/pigeonpost-account;
    index index.html;
    charset utf-8;
    expires -1;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://postbox.pigeonpost.dev; font-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev wss://postbox.pigeonpost.dev https://auth.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex" always;

    # The billing bridge (store-adapter): sign-in code exchange, member API, checkouts.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # The iyzico hosted card form (nonce CSP), same snippet as pigeonpost.dev.
    include /etc/nginx-raijin-webapps/snippets/pigeonpost-billing-checkout.conf;

    # A payment provider may POST back to the app; answer with a GET of the same URL.
    location = / {
        if ($request_method = POST) { return 303 https://account.pigeonpost.dev$request_uri; }
        access_log off;   # sign-in codes arrive here as ?code=
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }
    location / { try_files $uri =404; }
    location ~* \.(css|js|woff2|png|svg|ico)$ { expires 5m; }
}

# ---- partner.pigeonpost.dev -------------------------------------------------------------------
server {
    listen 48880;
    server_name partner.pigeonpost.dev;
    root /var/www/pigeonpost-partner;
    index index.html;
    charset utf-8;
    expires -1;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://postbox.pigeonpost.dev; font-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev wss://postbox.pigeonpost.dev https://auth.pigeonpost.dev; frame-src https://app.shuftipro.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self \"https://app.shuftipro.com\"), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location = / {
        if ($request_method = POST) { return 303 https://partner.pigeonpost.dev$request_uri; }
        access_log off;
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }
    location / { try_files $uri =404; }
    location ~* \.(css|js|woff2|png|svg|ico)$ { expires 5m; }
}

# ---- management.pigeonpost.dev ----------------------------------------------------------------
# Staff only. The postbox enforces staff roles and a fresh two-step sign-in on every staff route;
# this host is never linked publicly and never indexed.
server {
    listen 48880;
    server_name management.pigeonpost.dev;
    root /var/www/pigeonpost-management;
    index index.html;
    charset utf-8;
    expires -1;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://postbox.pigeonpost.dev; font-src 'self'; connect-src 'self' https://postbox.pigeonpost.dev wss://postbox.pigeonpost.dev https://auth.pigeonpost.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = / {
        access_log off;
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }
    location / { try_files $uri =404; }
}

# ---- help.pigeonpost.dev ----------------------------------------------------------------------
server {
    listen 48880;
    server_name help.pigeonpost.dev;
    root /var/www/pigeonpost-help;
    index index.html;
    charset utf-8;
    expires 5m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}

# ---- status.pigeonpost.dev --------------------------------------------------------------------
# status.json is rewritten every minute by pp-status.timer (deploy/status/) as the deploy user.
server {
    listen 48880;
    server_name status.pigeonpost.dev;
    root /var/www/pigeonpost-status;
    index index.html;
    charset utf-8;
    expires 5m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /status.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /status.json =404;
    }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
