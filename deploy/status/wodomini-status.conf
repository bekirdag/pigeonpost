# /etc/nginx/sites-available/pigeonpost-status.conf on wodomini (interim, until Cloudflare's
# status.pigeonpost.dev record points straight at nests-1; see deploy/status/README.md).
# TLS here with the shared platforms certificate; the page and status.json come from nests-1.
# If nests-1 does not answer, raijin's last copy is served so the page still loads (stale banner).
server {
    listen 80;
    server_name status.pigeonpost.dev;
    location /.well-known/acme-challenge/ {
        proxy_pass http://193.164.5.238;
        proxy_set_header Host $host;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name status.pigeonpost.dev;
    ssl_certificate /etc/letsencrypt/live/pigeonpost-platforms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pigeonpost-platforms/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 4k;

    location / {
        proxy_pass https://193.164.5.238;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name status.pigeonpost.dev;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 4s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @raijin;
    }
    location @raijin {
        proxy_pass http://192.168.12.165:48880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
