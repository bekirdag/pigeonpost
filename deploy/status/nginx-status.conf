# /etc/nginx/sites-available/pigeonpost-status.conf on nests-1 (behind the Cloudflare proxy).
# Serves site-status/ (site-shared as /shared/) and the merged status.json. Nothing else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}
server {
    listen 80;
    listen [::]:80;
    server_name status.pigeonpost.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://status.pigeonpost.dev$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name status.pigeonpost.dev;
    ssl_certificate /etc/letsencrypt/live/status.pigeonpost.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.pigeonpost.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/pigeonpost-status;
    index index.html;
    charset utf-8;
    expires 5m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /status.json {
        alias /var/lib/pp-status/public/status.json;
        default_type application/json;
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
