# Podman containers.conf for nestbuild user.
# Installed at /home/nestbuild/.config/containers/containers.conf

[engine]
runtime = "runsc"
cgroup_manager = "systemd"
events_logger = "file"

[engine.runtimes]
# The reviewed gVisor profile (runsc-buildd), under the runtime name the build plane uses.
runsc = ["/usr/local/bin/runsc-buildd"]

[containers]
log_driver = "k8s-file"
default_capabilities = []
no_hosts = true
pids_limit = 512
# userns = "auto" is NOT used because rootless podman already maps containers to the user's subordinate IDs.
# Explicitly setting it can interfere with the default rootless behavior or require additional setup.

[network]
default_rootless_network_cmd = "pasta"
