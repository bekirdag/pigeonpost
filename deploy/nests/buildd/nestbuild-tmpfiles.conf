# /etc/tmpfiles.d/nestbuild.conf — the behaviour run's trace directory (runsc-behaviour; mounted as
# a 512 MiB tmpfs, see README), and the
# scanner database root (written by nestscan, read by nestbuild).
d /var/lib/pigeonpost-buildd/netlog 0700 nestbuild nestbuild 1d
d /var/lib/pigeonpost-scandb 0755 nestscan nestscan -
