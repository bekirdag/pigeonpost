# /etc/systemd/system/user-2350.slice.d/50-nestbuild-limits.conf  (2350 = uid of nestbuild; adjust)
#
# The hard cap for everything the build plane runs. The service (Slice=user-2350.slice) and every
# rootless podman container it starts (podman's systemd cgroup manager puts them under
# user@2350.service, inside this slice) share these limits, so a build cannot starve the host,
# which also serves models, payments and identity. Starting values; configuration, not code.
[Slice]
# Four cores at most, and a low share when the host is busy.
CPUQuota=400%
CPUWeight=50
MemoryHigh=6G
MemoryMax=8G
MemorySwapMax=0
TasksMax=4096
IOWeight=50
