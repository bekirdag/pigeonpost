# deploy/nests/buildd/scanners/freshclam.conf -> /etc/pigeonpost-buildd/freshclam.conf
# freshclam inside the pinned ClamAV image, run by nestscan-update as user nestscan. Its only
# network is the nestscan allowlist (database.clamav.net). The signatures land in the staging
# snapshot's clamav/ and are read-only to every scan.
DatabaseDirectory /db
DatabaseOwner root
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Bytecode yes
NotifyClamd no
Foreground yes
LogTime yes
ConnectTimeout 30
ReceiveTimeout 300
