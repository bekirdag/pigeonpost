# Prometheus on nests-1 (Nests Phase B6). Loopback only; 15 days of local data.
#   prometheus --config.file=/etc/nests/monitoring/prometheus.yml --storage.tsdb.path=/var/lib/nests/prometheus \
#              --storage.tsdb.retention.time=15d --web.listen-address=127.0.0.1:9090
global:
  scrape_interval: 60s
  evaluation_interval: 60s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
rule_files:
  - /etc/nests/monitoring/nests-rules.yml
scrape_configs:
  - job_name: nestd
    static_configs:
      - targets: ["127.0.0.1:9790"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
