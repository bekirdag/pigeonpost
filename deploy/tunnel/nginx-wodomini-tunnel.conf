# wodomini /etc/nginx/sites-enabled/pigeonpost-tunnel.conf — TLS here, broker on raijin.
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tunnel.pigeonpost.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.pigeonpost.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name tunnel.pigeonpost.dev;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / {
        proxy_pass http://192.168.12.165:48880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_read_timeout 9h;
        proxy_send_timeout 9h;
    }
}
server {
    listen 80;
    server_name tunnel.pigeonpost.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
