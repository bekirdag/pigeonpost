# raijin /etc/nginx-raijin-webapps/nginx.conf — tunnel.pigeonpost.dev (agent SSH broker).
# TLS ends at wodomini; this listener is the same private one inbox/enterprise use.
server {
    listen 48880;
    server_name tunnel.pigeonpost.dev;
    access_log off;                          # the broker logs session metadata itself
    location ~ "^/t/ssh_[a-z2-7]{26}$" {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Per-address admission limits only (never authorization): Cloudflare's client address.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_read_timeout 9h;
        proxy_send_timeout 9h;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8781; }
    location / { return 404; }
}
