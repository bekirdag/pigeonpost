<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure payment — Pigeonpost</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- The web server replaces this placeholder with the per-request CSP nonce. -->
<meta name="csp-nonce" content="__CSP_NONCE__">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/kit/pp-ui.min.css?v=1.0.0">
<link rel="stylesheet" href="/site.css?v=20261114-kit">
</head>
<body class="site">
<header class="pp-navbar site-navbar">
<div class="pp-navbar__inner">
<a class="pp-brand" href="/account" aria-label="Pigeonpost account"><picture><source srcset="/kit/brand/logo_only_symbol_white_trim.png" media="(prefers-color-scheme: dark)"><img src="/kit/brand/logo_only_symbol_trim.png" alt="" width="28" height="26"></picture><span class="pp-brand__name">Pigeonpost</span><span class="pp-brand__product">Payment</span></a>
<div class="pp-navbar__actions">

</div>
</div>
</header>
<main id="main" class="site-checkout">
  <div class="pp-card pp-card--l">
    <h1 id="pp-pay-title">Secure payment</h1>
    <p class="pp-muted" id="pp-pay-summary">Preparing the iyzico payment form…</p>
    <p class="site-note">Your card details go directly to iyzico. Pigeonpost never sees or stores them.</p>
    <p class="site-note">Seller: Piyote Bilişim (iyzico merchant 101064752). <a href="/app-terms.html">Terms</a></p>
    <div id="pp-pay-form"></div>
    <p><a class="pp-btn pp-btn--ghost" href="/account"><svg class="pp-icon" aria-hidden="true"><use href="/kit/icons.svg#i-arrow-left"/></svg>Back to your account</a></p>
  </div>
</main>
<script src="/account-config.js"></script>
<script src="/billing/checkout.js"></script>
