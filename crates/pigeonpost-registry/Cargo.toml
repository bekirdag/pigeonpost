[package]
name = "pigeonpost-registry"
description = "Pigeonpost registry: human-readable handles over an append-only transparency log."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["client", "server"]
client = ["dep:reqwest", "dep:tokio"]
test-utilities = ["server"]
server = [
    "dep:pigeonpost-compliance-seal",
    "dep:axum",
    "dep:tokio",
    "dep:rusqlite",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:tracing",
    "dep:async-trait",
    "dep:rand_core",
    "dep:tokio-stream",
    "dep:zeroize",
    "dep:rustix",
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:pigeonpost-unix-custody",
]

[dependencies]
pigeonpost-core = { path = "../pigeonpost-core", version = "0.5.7" }
pigeonpost-compliance-format.workspace = true
pigeonpost-compliance-seal = { path = "../pigeonpost-compliance-seal", version = "0.5.7", optional = true }
axum = { version = "0.8", optional = true }
http-body = { version = "1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
jsonwebtoken = { version = "9", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
serde-big-array.workspace = true
thiserror.workspace = true
url = "2"
tracing = { version = "0.1", optional = true }
async-trait = { version = "0.1", optional = true }
rand_core = { workspace = true, optional = true }
subtle.workspace = true
tokio-stream = { version = "0.1", optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
pigeonpost-unix-custody = { path = "../pigeonpost-unix-custody", optional = true }
rustix = { version = "1.1", features = ["fs", "process"], optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
