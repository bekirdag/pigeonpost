[workspace]
resolver = "2"
members = [".", "ffi", "wasm", "interop/rust-device"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bekirdag/pigeonpost"
authors = ["bekir dağ"]
rust-version = "1.91"

[package]
name = "pigeonpost-groupcrypto"
description = "Pigeonpost group end-to-end encryption: a small, misuse-resistant wrapper over OpenMLS (RFC 9420)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
# Enables the `js` randomness/time backends OpenMLS needs on wasm32-unknown-unknown.
js = ["openmls/js"]

[dependencies]
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_memory_storage = "=0.6.0"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Only to prove address derivation matches the canonical implementation (tests/address.rs).
pigeonpost-core = { path = "../pigeonpost-core" }
proptest = { version = "1.11", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
