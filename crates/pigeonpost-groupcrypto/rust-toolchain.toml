# OpenMLS 0.9.x (the only line with fixes for every published OpenMLS advisory) needs Rust 1.91.
# This crate is its own workspace (own lockfile, wasm and FFI builds); the root workspace is on the same toolchain since Phase 3a.
[toolchain]
channel = "1.91.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
