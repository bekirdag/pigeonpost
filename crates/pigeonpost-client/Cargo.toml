[package]
name = "pigeonpost-client"
description = "Pigeonpost client: agent identity, outbox, cursors, and inbox state."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pigeonpost-core = { path = "../pigeonpost-core", version = "0.4.0" }
pigeonpost-compliance-format = { path = "../pigeonpost-compliance-format", version = "0.4.0" }
pigeonpost-loft = { path = "../pigeonpost-loft", version = "0.4.0", default-features = false, features = ["client"] }
pigeonpost-directory = { path = "../pigeonpost-directory", version = "0.4.0", default-features = false, features = ["client"] }
pigeonpost-registry = { path = "../pigeonpost-registry", version = "0.4.0", default-features = false, features = ["client"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
ed25519-dalek.workspace = true
fs2 = "0.4"
futures-util = "0.3"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
pigeonpost-unix-custody = { path = "../pigeonpost-unix-custody" }
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
pigeonpost-windows-custody = { path = "../pigeonpost-windows-custody" }
tempfile = "3"
winapi-util = "0.1.11"
windows-permissions = "0.2.4"

[dev-dependencies]
pigeonpost-directory = { path = "../pigeonpost-directory", version = "0.4.0", features = ["server", "test-utilities"] }
pigeonpost-loft = { path = "../pigeonpost-loft", version = "0.4.0", features = ["server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
