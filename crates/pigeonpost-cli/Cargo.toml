[package]
name = "pigeonpost-cli"
description = "Pigeonpost command line: send and receive agent messages, and run a loft."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Explicit source-test surface. Release builds do not expose mock identity providers.
test-utilities = ["pigeonpost-registry/test-utilities"]

[[bin]]
name = "pigeonpost"
path = "src/main.rs"

[dependencies]
# A QR of the sign-in URL, so a phone can take it off a screen instead of somebody typing a code
# into a browser on another machine. Nayuki's encoder: no dependencies of its own, one algorithm,
# and the alternative was writing Reed-Solomon by hand.
qrcodegen = "1.8"
pigeonpost-core = { path = "../pigeonpost-core", version = "0.7.6" }
pigeonpost-client = { path = "../pigeonpost-client", version = "0.7.6" }
pigeonpost-loft = { path = "../pigeonpost-loft", version = "0.7.6" }
pigeonpost-registry = { path = "../pigeonpost-registry", version = "0.7.6" }
pigeonpost-mcp = { path = "../pigeonpost-mcp", version = "0.7.6" }
pigeonpost-directory = { path = "../pigeonpost-directory", version = "0.7.6" }
pigeonpost-compliance-format = { path = "../pigeonpost-compliance-format", version = "0.7.6" }
pigeonpost-compliance-seal = { path = "../pigeonpost-compliance-seal", version = "0.7.6" }
axum = "0.8"
ed25519-dalek.workspace = true
fs2 = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand_core.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Passphrase -> workspace key. A memory-hard KDF, because the alternative on a human-chosen
# secret is an offline guessing attack against whatever the server stores.
argon2.workspace = true
chacha20poly1305.workspace = true
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-permissions = "0.2.4"

[target.'cfg(unix)'.dependencies]
pigeonpost-unix-custody = { path = "../pigeonpost-unix-custody" }
rustix = { version = "1.1", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"
