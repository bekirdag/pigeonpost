[package]
name = "pigeonpost-postbox"
description = "Pigeonpost hosted plane: remote MCP + key custody + inbox hosting for mass adoption."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# Scaffold only. Stub HTTP surface (/health, /mcp, /v1) + healthcheck + reaper entrypoints.
# The real P0 logic (anon /k/ create with PoW, send/inbox/read, key vault, accounts) is not here yet;
# see docs/planning/hosted-postbox-architecture-2026-08-12.md. Kept dependency-light so it always
# builds; the pigeonpost-core/-loft/-mcp/-registry integrations are added as the build lands.
[dependencies]
axum = "0.8"
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# proof-of-work anti-abuse (§14.1): HMAC-signed challenges + hashcash verification
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand_core.workspace = true
thiserror.workspace = true
# identity minting + key custody
pigeonpost-core = { path = "../pigeonpost-core", version = "0.7.18" }
# Group E2EE (P-2): server-side checks on key packages, envelopes and Welcomes. Never decrypts.
pigeonpost-groupcrypto = { path = "../pigeonpost-groupcrypto" }
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
# persistence — bundled SQLite (embedded, no external DB), matching the registry crate. Postgres is
# the P2 swap; the plan starts on SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
# OIDC: validate pigeonpost-prod member JWTs (RS256) against the realm JWKS (fetched over HTTPS).
jsonwebtoken = "9"
qrcodegen = "1.8"
time = { version = "0.3", features = ["parsing"] }
# `http2` because APNs speaks nothing else. The other features are the realm JWKS fetch.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = { version = "0.3", default-features = false }
# Calendar (SDS §14B): RFC 5545 recurrence expanded in the event's IANA zone, and guest device
# proofs (ECDSA P-256, what every browser's WebCrypto can sign with).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rrule = "0.14"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Agent SSH (SDS §11): the SSH CA signs short-lived OpenSSH user certificates. Ed25519 only. The
# same release russh pins in the CLI (one ssh-key in the tree; 0.6 brings the RUSTSEC-2023-0071 rsa
# crate into the lockfile through a weak feature).
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std", "alloc"] }

# `statvfs`, for the free-space floor under the blob volume. Already in the tree through tokio and
# rusqlite; this only makes the use direct.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
