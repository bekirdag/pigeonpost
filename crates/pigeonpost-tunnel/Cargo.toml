[package]
name = "pigeonpost-tunnel"
description = "Pigeonpost tunnel broker: splices the two WebSocket legs of an end-to-end encrypted agent SSH session. Holds no keys and sees ciphertext only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pigeonpost-tunnel"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[lints.rust]
unsafe_code = "forbid"
