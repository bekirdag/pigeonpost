[package]
name = "pigeonpost-loft"
description = "Pigeonpost loft: a durable, privacy-preserving inbox for offline agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["client", "server"]
client = ["dep:reqwest", "dep:tokio"]
server = [
    "dep:pigeonpost-compliance-format",
    "dep:pigeonpost-compliance-seal",
    "dep:pigeonpost-registry",
    "dep:axum",
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ed25519-dalek",
    "dep:rand_core",
    "dep:reqwest",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:rusqlite",
    "dep:sha2",
    "dep:tracing",
    "dep:zeroize",
    "dep:pigeonpost-unix-custody",
    "dep:rustix",
    "dep:pigeonpost-windows-custody",
    "dep:winapi-util",
    "dep:windows-permissions",
]

[dependencies]
pigeonpost-core = { path = "../pigeonpost-core", version = "0.5.6" }
pigeonpost-compliance-format = { path = "../pigeonpost-compliance-format", version = "0.5.6", optional = true }
pigeonpost-compliance-seal = { path = "../pigeonpost-compliance-seal", version = "0.5.6", optional = true }
pigeonpost-registry = { path = "../pigeonpost-registry", version = "0.5.6", default-features = false, features = ["client"], optional = true }
axum = { version = "0.8", optional = true }
http-body = { version = "1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"], optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"], optional = true }
tower = { version = "0.5", features = ["limit", "util"], optional = true }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
pigeonpost-unix-custody = { path = "../pigeonpost-unix-custody", optional = true }
rustix = { version = "1.1", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
pigeonpost-windows-custody = { path = "../pigeonpost-windows-custody", optional = true }
winapi-util = { version = "0.1.11", optional = true }
windows-permissions = { version = "0.2.4", optional = true }

[lints.rust]
unsafe_code = "forbid"
