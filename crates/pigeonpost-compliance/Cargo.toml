[package]
name = "pigeonpost-compliance"
description = "Offline-only Pigeonpost attribution and trace custody workflows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
readme = "README.md"

[dependencies]
pigeonpost-compliance-format = { path = "../pigeonpost-compliance-format", version = "0.7.9" }
pigeonpost-compliance-seal = { path = "../pigeonpost-compliance-seal", version = "0.7.9" }
pigeonpost-core = { path = "../pigeonpost-core", version = "0.7.9" }
pigeonpost-registry = { path = "../pigeonpost-registry", version = "0.7.9", default-features = false }
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
fs2 = "0.4"
hmac.workspace = true
hkdf.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
pigeonpost-unix-custody = { path = "../pigeonpost-unix-custody" }
rustix = { version = "1.1", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ppcompliance"
path = "src/bin/ppcompliance.rs"
