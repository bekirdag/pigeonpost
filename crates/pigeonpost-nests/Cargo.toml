[package]
name = "pigeonpost-nests"
description = "Pigeonpost Nests Phase A: the Nest control service, the model broker and the in-sandbox runner. Hosted agents in gVisor sandboxes behind a pluggable runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pigeonpost-nestd"
path = "src/bin/nestd.rs"

[[bin]]
name = "pigeonpost-nest-parser"
path = "src/bin/parser.rs"

[[bin]]
name = "pigeonpost-nest-runner"
path = "src/bin/runner.rs"

# Marketplace M1: the build and analysis planes.
[[bin]]
name = "pigeonpost-nest-release"
path = "src/bin/release.rs"

# Hardening W1.3: the remote build and analysis plane (a separate host now; its own VM later).
[[bin]]
name = "pigeonpost-nest-buildd"
path = "src/bin/buildd.rs"

[dependencies]
# The shared Nest package rules (manifest and configuration schema), the same code the postbox and
# `pigeonpost nest validate` run. A workspace crate, no new third-party dependency.
pigeonpost-core = { path = "../pigeonpost-core", version = "0.7.19" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
subtle.workspace = true
rand_core.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
# B6: volume keys wrapped under the off-host KEK.
chacha20poly1305.workspace = true
tracing = "0.1"
# B4 file parsing (MIT/Apache-2.0): archives and deflate only; no other format libraries.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
# The starter templates are tested against the build plane's parser and the scan rules.
pigeonpost-nest-kit = { path = "../pigeonpost-nest-kit" }
