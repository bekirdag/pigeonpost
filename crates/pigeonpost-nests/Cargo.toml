[package]
name = "pigeonpost-nests"
description = "Pigeonpost Nests Phase A: the Nest control service, the model broker and the in-sandbox runner. Hosted agents in gVisor sandboxes behind a pluggable runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pigeonpost-nestd"
path = "src/bin/nestd.rs"

[[bin]]
name = "pigeonpost-nest-runner"
path = "src/bin/runner.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
subtle.workspace = true
rand_core.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
