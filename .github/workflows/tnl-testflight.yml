name: TNL iOS TestFlight

# The Neural Ledger lives in wodohq/tnl_mobile, which does not duplicate Wodo's signing
# credentials. This manual broker reuses the Wodo credentials already proven by Pigeonpost and
# Cubemeld, checking the app out through a repository-scoped, read-only deploy key.
#
# The archive runs on macos-26 for two reasons: Apple refuses uploads built with an SDK older than
# iOS 26, and the app's Liquid Glass surfaces are gated behind `#if compiler(>=6.2)`, so only that
# toolchain compiles them. On anything older it falls back to layered materials and still builds.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable 40-character commit SHA from wodohq/tnl_mobile."
        required: true
        default: "1c38e0d4d516948fa8acba6295df4d535ffb08b5"
        type: string
      build_number:
        description: "CFBundleVersion. Must be higher than every TNL build already uploaded."
        required: true
        default: "1"
        type: string
      upload:
        description: "Upload to App Store Connect. Off means archive and export only."
        required: true
        default: true
        type: boolean
      backend_url:
        description: "Mobile BFF base URL baked into the build. Testers can override it in Profile > Server."
        required: false
        default: ""
        type: string
      distribute:
        description: "Add the processed build to internal tester groups."
        required: true
        default: true
        type: boolean
      status_only:
        description: "Only inspect the app in App Store Connect; do not check out or build it."
        required: true
        default: false
        type: boolean
      reinvite_pending:
        description: "Resend invitations only for already-invited testers whose invitation is pending. Requires status_only."
        required: true
        default: false
        type: boolean
      runner:
        description: "Runner image. Needs Xcode 26 or later."
        required: false
        default: macos-26
        type: string

permissions:
  contents: read

concurrency:
  group: tnl-ios-testflight
  cancel-in-progress: false

jobs:
  status:
    name: App Store Connect preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate invitation mode
        env:
          REINVITE_PENDING: ${{ inputs.reinvite_pending }}
          STATUS_ONLY: ${{ inputs.status_only }}
        run: |
          if [ "$REINVITE_PENDING" = "true" ] && [ "$STATUS_ONLY" != "true" ]; then
            echo "::error::reinvite_pending requires status_only=true."
            exit 1
          fi

      - name: Inspect The Neural Ledger and its TestFlight groups
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.theneuralledger.mobile
          REINVITE_PENDING: ${{ inputs.reinvite_pending }}
        run: python3 .github/scripts/testflight_status.py

  archive:
    name: archive and upload
    needs: status
    if: ${{ !inputs.status_only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    environment: production-release
    steps:
      - name: Check out the release broker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out The Neural Ledger through its read-only deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wodohq/tnl_mobile
          ref: ${{ inputs.source_ref }}
          path: tnl
          ssh-key: ${{ secrets.TNL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Require an immutable source commit
        shell: bash
        working-directory: tnl
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$SOURCE_REF" ]; then
            echo "::error::Checked out $checked_out instead of the requested immutable source."
            exit 1
          fi

      - name: Configure read-only WodoSync package access
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WODOSYNC_DEPLOY_KEY: ${{ secrets.WODOSYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WODOSYNC_DEPLOY_KEY:-}" ]; then
            echo "::error::WODOSYNC_DEPLOY_KEY is not set."
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/wodosync-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$WODOSYNC_DEPLOY_KEY" > "$ssh_dir/deploy-key"
          chmod 600 "$ssh_dir/deploy-key"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/meta > "$ssh_dir/github-meta.json"
          python3 - "$ssh_dir/github-meta.json" "$ssh_dir/known_hosts" <<'PY'
          import json
          import pathlib
          import sys

          source, destination = map(pathlib.Path, sys.argv[1:])
          keys = json.loads(source.read_text(encoding="utf-8")).get("ssh_keys", [])
          allowed = ("ssh-ed25519 ", "ecdsa-sha2-nistp256 ", "ssh-rsa ")
          keys = [key for key in keys if isinstance(key, str) and key.startswith(allowed)]
          if not keys:
              raise SystemExit("GitHub metadata did not contain a supported SSH host key")
          destination.write_text("".join(f"github.com {key}\n" for key in keys), encoding="utf-8")
          PY
          chmod 600 "$ssh_dir/known_hosts"

          {
            echo "Host github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile $ssh_dir/deploy-key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "GIT_SSH_COMMAND=ssh -F $ssh_dir/config" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -F $ssh_dir/config" \
            git ls-remote git@github.com:wodo-platform/wodosync.git HEAD >/dev/null

      - name: Select an Xcode that can build for the store
        shell: bash
        run: |
          set -euo pipefail
          best=""
          best_version=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "$app/Contents/Info.plist" 2>/dev/null || echo "")
            [ -n "$version" ] || continue
            echo "found $app — $version"
            if [ -z "$best_version" ] ||
               [ "$(printf '%s\n%s\n' "$version" "$best_version" | sort -V | tail -1)" = "$version" ]; then
              best="$app"
              best_version="$version"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          echo "Using $best (Xcode $best_version)"
          sudo xcode-select -s "$best/Contents/Developer"
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          echo "iOS SDK: $sdk"
          if [ "${sdk:-0}" -lt 26 ]; then
            echo "::error::The newest iOS SDK is ${sdk:-none}; App Store Connect requires iOS 26 or newer."
            exit 1
          fi
          xcodebuild -version

      - name: Reconcile the simulator runtime with the SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_build=$(xcodebuild -version -sdk iphonesimulator ProductBuildVersion 2>/dev/null || true)
          runtime_build=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]; rs.sort(key=lambda r: [int(n) for n in r['version'].split('.') if n.isdigit()]); print(rs[-1]['buildversion'] if rs else '')")
          echo "simulator SDK build: ${sdk_build:-none}, newest iOS runtime: ${runtime_build:-none}"
          if [ -n "$sdk_build" ] && [ -n "$runtime_build" ]; then
            xcrun simctl runtime match set "$sdk_build" "$runtime_build" ||
              echo "::warning::Could not pin runtime $runtime_build to SDK $sdk_build; continuing."
            xcrun simctl runtime match list || true
          fi

      - name: Import and validate the Wodo signing assets
        shell: bash
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.TNL_APPLE_PROFILE }}
        run: |
          set -euo pipefail
          for name in P12 P12_PASSWORD PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is not set."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/tnl-signing.keychain-db"
          pass="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/tnl-dist.p12"
          security import "$RUNNER_TEMP/tnl-dist.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tnl-dist.p12"

          raw_profile="$RUNNER_TEMP/tnl.mobileprovision"
          profile_plist="$RUNNER_TEMP/tnl-profile.plist"
          printf '%s' "$PROFILE" | base64 --decode > "$raw_profile"
          echo "d7779771a6a26d8b705819867855c490fa4ad261fd593a00dd9ecf91d9e5e6b4  $raw_profile" |
            shasum -a 256 -c -
          security cms -D -i "$raw_profile" > "$profile_plist"

          team=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$profile_plist")
          app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$profile_plist")
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          [ "$team" = "AH277897AV" ] || { echo "::error::Unexpected profile team."; exit 1; }
          [ "$app_id" = "AH277897AV.com.theneuralledger.mobile" ] || { echo "::error::Unexpected profile app identifier: $app_id"; exit 1; }
          [ "$name" = "TNL Mobile App Store" ] || { echo "::error::Unexpected profile name: $name"; exit 1; }

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$raw_profile" "$profiles/$uuid.mobileprovision"
          security find-identity -v -p codesigning "$keychain" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Validate the release contract
        working-directory: tnl
        run: |
          set -euo pipefail
          plutil -lint ios/Info.plist
          plutil -lint ios/ExportOptions.plist
          # The app must never carry a TNL API key: that lives only in the BFF.
          if grep -rIn --exclude-dir=.git -e 'tnl_live_key' ios; then
            echo "::error::A TNL API key appears in the app sources. It belongs to the backend only."
            exit 1
          fi

      # The mapping rules that keep the app honest — verification bands, the refusal to read
      # contradictionCount as disagreement, modeled-versus-sourced path steps. They need only node.
      - name: Test the intelligence mapping rules
        working-directory: tnl/bff
        run: npm test

      - name: Write the App Store Connect key
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::APPLE_API_PRIVATE_KEY is not set."
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          head -1 "$RUNNER_TEMP/keys/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" ||
            { echo "::error::The API key is not a PEM private key."; exit 1; }

      - name: Archive The Neural Ledger
        working-directory: tnl/ios
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::build_number must be a whole number; got '$BUILD_NUMBER'." ; exit 1 ;;
          esac
          # The app reaches TNL only through its backend. Without a reachable one a tester signs in
          # and then sees empty screens, so say so rather than shipping something that looks broken.
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::No backend_url given. The build falls back to localhost and each tester must set Profile > Server."
          fi
          xcodebuild \
            -project TNL.xcodeproj \
            -scheme TNL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TNL.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            TNL_BACKEND_URL="$BACKEND_URL" \
            DEVELOPMENT_TEAM=AH277897AV \
            PRODUCT_BUNDLE_IDENTIFIER=com.theneuralledger.mobile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="TNL Mobile App Store" \
            archive

      - name: Verify the signed archive
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/TNL.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::Archive contains no application bundle."; exit 1; }
          plist="$app/Info.plist"
          for key in CFBundleDisplayName CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion DTSDKName ITSAppUsesNonExemptEncryption TNLBackendURL; do
            printf '%s = %s\n' "$key" "$(plutil -extract "$key" raw -o - "$plist" 2>/dev/null || echo '(absent)')"
          done
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "com.theneuralledger.mobile" ]
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$plist")" = "false" ]
          sdk=$(plutil -extract DTSDKName raw -o - "$plist")
          case "$sdk" in iphoneos2[6-9]*|iphoneos[3-9][0-9]*) ;; *)
            echo "::error::Built against $sdk. App Store Connect refuses anything older than the iOS 26 SDK." ; exit 1 ;;
          esac
          # iPhone only (TARGETED_DEVICE_FAMILY = 1), so there is no ~ipad icon dictionary.
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$plist")" = "AppIcon" ]
          icon="$app/AppIcon60x60@2x.png"
          [ -f "$icon" ] || { echo "::error::Archive is missing AppIcon60x60@2x.png."; exit 1; }
          [ "$(sips -g pixelWidth "$icon" | tail -1 | awk '{print $2}')" = "120" ]
          [ "$(sips -g pixelHeight "$icon" | tail -1 | awk '{print $2}')" = "120" ]
          # An alpha channel in the icon is rejected at upload, so catch it here.
          [ "$(sips -g hasAlpha "$icon" | tail -1 | awk '{print $2}')" = "no" ]
          codesign --verify --deep --strict "$app"

      - name: Export and optionally upload
        working-directory: tnl/ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$options"
          plutil -replace signingStyle -string manual "$options"
          plutil -replace signingCertificate -string "Apple Distribution" "$options"
          plutil -replace provisioningProfiles -json '{"com.theneuralledger.mobile":"TNL Mobile App Store"}' "$options"
          if [ "$UPLOAD" = "true" ]; then
            plutil -replace destination -string upload "$options"
          else
            plutil -replace destination -string export "$options"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TNL.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/TNLExport" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Put the build in front of internal testers
        if: inputs.upload
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.theneuralledger.mobile
          WAIT_FOR: ${{ inputs.build_number }}
          WAIT_MINUTES: "30"
          FIX: "true"
        run: python3 .github/scripts/testflight_status.py

      - name: Keep the IPA and symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tnl-ios-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/TNLExport/*.ipa
            ${{ runner.temp }}/TNL.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          rm -rf "$RUNNER_TEMP/wodosync-ssh"
          rm -f "$RUNNER_TEMP/tnl-dist.p12" "$RUNNER_TEMP/tnl.mobileprovision" "$RUNNER_TEMP/tnl-profile.plist"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          security delete-keychain "$RUNNER_TEMP/tnl-signing.keychain-db" 2>/dev/null || true
