name: Group crypto

# Release prerequisite P-2: the group end-to-end encryption crate, its bindings and the
# cross-client interop scenario (docs/group-e2ee.md). The crate is its own Cargo workspace on
# Rust 1.91.1 (crates/pigeonpost-groupcrypto/rust-toolchain.toml); rustup installs that
# toolchain, its components and the wasm32 target automatically inside the crate directory.

on:
  push:
    branches: [main]
    paths:
      - crates/pigeonpost-groupcrypto/**
      - crates/pigeonpost-core/**
      - site-inbox/vendor/groupcrypto/**
      - .github/workflows/group-crypto.yml
  pull_request:
    paths:
      - crates/pigeonpost-groupcrypto/**
      - crates/pigeonpost-core/**
      - site-inbox/vendor/groupcrypto/**
      - .github/workflows/group-crypto.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash
    working-directory: crates/pigeonpost-groupcrypto

jobs:
  rust:
    name: fmt, clippy, tests and fuzz
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p pigeonpost-groupcrypto-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked --release
      - name: Deeper property/fuzz run over message processing
        run: PROPTEST_CASES=3000 cargo test --locked --release --test fuzz

  audit:
    name: cargo audit (group crypto lockfile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the exact compatible cargo-audit release
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: The two lockfile-only advisories in .cargo/audit.toml must stay uncompiled
        run: |
          for crate in libcrux-kem hpke-rs-libcrux; do
            if cargo tree --locked --target all -e normal,build -i "$crate" 2>/dev/null | grep -q .; then
              echo "::error::$crate is now compiled; its advisories are no longer lockfile-only" >&2
              exit 1
            fi
          done
      - run: cargo audit

  generated:
    name: committed WASM bundle and bindings are reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - name: Install the pinned generators
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag v0.11.1+v0.31.0 --locked
      - name: Rebuild the vendored web bundle and compare byte for byte
        run: scripts/build-wasm.sh --check
      - name: Keep the mismatching rebuild for inspection
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groupcrypto-wasm-rebuild
          path: crates/pigeonpost-groupcrypto/target/wasm-check
          retention-days: 7
      - name: Check the vendored checksums
        working-directory: site-inbox/vendor/groupcrypto
        run: sha256sum -c SHA256SUMS
      - name: Regenerate Swift, Kotlin, Python and C# bindings and compare
        run: scripts/generate-bindings.sh --check

  interop-linux:
    name: interop (Linux — Rust, WASM/Node, Kotlin/JVM, Python, C#)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Run the cross-client scenario
        run: |
          eval "$(scripts/fetch-kotlin-tools.sh "$RUNNER_TEMP/kotlin")"
          GROUPCRYPTO_REQUIRE="kotlin csharp" scripts/interop.sh

  macos:
    name: interop (macOS — adds Swift) + XCFramework + SwiftPM tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Run the cross-client scenario with all six runtimes
        run: |
          eval "$(scripts/fetch-kotlin-tools.sh "$RUNNER_TEMP/kotlin")"
          GROUPCRYPTO_REQUIRE="swift kotlin csharp" scripts/interop.sh
      - name: Build the XCFramework (iOS, iOS simulator, macOS)
        run: scripts/build-apple.sh
      - name: Swift package tests on macOS
        working-directory: crates/pigeonpost-groupcrypto/apple
        run: swift test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groupcrypto-apple-xcframework
          path: crates/pigeonpost-groupcrypto/apple/PigeonpostGroupCryptoFFI.xcframework
          retention-days: 14

  android:
    name: Android AAR (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR with the runner's NDK
        run: |
          eval "$(scripts/fetch-kotlin-tools.sh "$RUNNER_TEMP/kotlin")"
          ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" scripts/build-android.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groupcrypto-android-aar
          path: crates/pigeonpost-groupcrypto/target/android/pigeonpost-groupcrypto.aar
          retention-days: 14

  windows:
    name: Windows (x64 tests + C# interop, arm64 build)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: cargo test --workspace --locked --release
      - name: Build win-x64 and win-arm64 libraries
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Run the cross-client scenario (Rust, WASM/Node, Python, C#)
        run: PYTHON=python GROUPCRYPTO_REQUIRE="csharp" scripts/interop.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groupcrypto-windows
          path: crates/pigeonpost-groupcrypto/target/windows
          retention-days: 14
