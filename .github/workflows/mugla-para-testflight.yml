name: Muğla Para iPhone TestFlight
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit from wodohq/mugla-para
        required: true
        type: string
      build_number:
        description: Unique CFBundleVersion
        required: true
        default: '1'
        type: string
permissions:
  contents: read
concurrency:
  group: mugla-para-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Check out release broker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out immutable app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wodohq/mugla-para
          ref: ${{ inputs.source_ref }}
          path: mugla-para
          ssh-key: ${{ secrets.MUGLA_PARA_DEPLOY_KEY }}
          persist-credentials: false
      - name: Validate release inputs and select Xcode 26+
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [ "$(git -C mugla-para rev-parse HEAD)" = "$SOURCE_REF" ]
          best=''
          version='0'
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            candidate=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            if [ "$(printf '%s\n%s\n' "$candidate" "$version" | sort -V | tail -1)" = "$candidate" ]; then best="$app"; version="$candidate"; fi
          done
          [ -n "$best" ]
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          sdk=$(xcodebuild -version -sdk iphoneos SDKVersion | cut -d. -f1)
          [ "$sdk" -ge 26 ]
          plutil -lint mugla-para/ios/MuglaPara/Resources/Info.plist
          plutil -lint mugla-para/ios/MuglaPara/Resources/PrivacyInfo.xcprivacy
      - name: Run native unit tests
        working-directory: mugla-para
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project ios/MuglaPara.xcodeproj -scheme MuglaPara \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -only-testing:MuglaParaTests -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/mugla-tests" \
            -resultBundlePath "$RUNNER_TEMP/mugla-tests.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Import protected Wodo signing assets
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.MUGLA_PARA_APPLE_PROFILE }}
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in P12 P12_PASSWORD PROFILE KEY; do [ -n "${!name:-}" ]; done
          keychain="$RUNNER_TEMP/mugla-signing.keychain-db"
          pass="$(python3 -c 'import secrets;print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/mugla-dist.p12"
          security import "$RUNNER_TEMP/mugla-dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/mugla-dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/mugla.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/mugla.mobileprovision" > "$RUNNER_TEMP/mugla-profile.plist"
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/mugla-profile.plist")
          app=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/mugla-profile.plist")
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/mugla-profile.plist")
          [ "$team" = 'AH277897AV' ]
          [ "$app" = 'AH277897AV.com.wodo.muglapara' ]
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/mugla.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          install -m 700 -d "$RUNNER_TEMP/mugla-keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/mugla-keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/mugla-keys/AuthKey.p8"
      - name: Archive and verify signed iPhone app
        working-directory: mugla-para/ios
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild -project MuglaPara.xcodeproj -scheme MuglaPara -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MuglaPara.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION=1.0 archive
          app="$RUNNER_TEMP/MuglaPara.xcarchive/Products/Applications/MuglaPara.app"
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = 'com.wodo.muglapara' ]
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$app/Info.plist")" = 'false' ]
          [ "$(plutil -extract UIDeviceFamily.0 raw -o - "$app/Info.plist")" = '1' ]
          codesign --verify --deep --strict "$app"
      - name: Upload to TestFlight
        working-directory: mugla-para/ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cp ExportOptions.plist "$RUNNER_TEMP/mugla-export.plist"
          plutil -replace destination -string upload "$RUNNER_TEMP/mugla-export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MuglaPara.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/mugla-export.plist" -exportPath "$RUNNER_TEMP/MuglaParaExport" \
            -authenticationKeyPath "$RUNNER_TEMP/mugla-keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Verify processing, compliance and internal group availability
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.wodo.muglapara
          WAIT_FOR: ${{ inputs.build_number }}
          WAIT_MINUTES: '25'
          FIX: 'true'
        run: python3 .github/scripts/testflight_status.py
      - name: Retain validation and symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mugla-para-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/mugla-tests.xcresult
            ${{ runner.temp }}/MuglaPara.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 14
      - name: Clean signing files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mugla-keys"
          rm -f "$RUNNER_TEMP/mugla-dist.p12" "$RUNNER_TEMP/mugla.mobileprovision" "$RUNNER_TEMP/mugla-profile.plist"
          security delete-keychain "$RUNNER_TEMP/mugla-signing.keychain-db" 2>/dev/null || true
