name: iOS native UX regressions

on:
  workflow_dispatch:
    inputs:
      calendar_files_only:
        description: 'Diagnose the calendar file import and system file-picker cases on the current iOS runtime'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/ios/Pigeonpost/**'
      - 'apps/ios/Shared/**'
      - 'apps/ios/Tests/**'
      - 'apps/ios/UITests/**'
      - 'apps/ios/scripts/**'
      - 'apps/ios/Pigeonpost.xcodeproj/**'
      - 'crates/pigeonpost-groupcrypto/**'
      - '.github/workflows/ios-ux-tests.yml'

permissions:
  contents: read

env:
  CALENDAR_FILES_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.calendar_files_only }}

concurrency:
  group: ios-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ios:
    # Stable aggregate check: a timeout/failure in any shard still fails the iPhone gate.
    runs-on: ubuntu-24.04
    needs: native-ios-shards
    if: always()
    steps:
      - name: Require every iPhone suite
        env:
          RESULT: ${{ needs.native-ios-shards.result }}
        run: test "$RESULT" = success

  native-ios-shards:
    name: native-ios (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [messaging, calendar, account]
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - name: Select Xcode and an available iPhone
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)
              match = re.search(r'Xcode ([\d.]+)', version)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), developer))
          selected = max(candidates)[1]
          subprocess.run(['sudo', 'xcode-select', '-s', selected], check=True)
          PY
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtimes = sorted([r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']],
                            key=lambda r: tuple(map(int, r['version'].split('.'))), reverse=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          phones = [d for r in runtimes for d in devices.get(r['identifier'], []) if 'iPhone' in d['name']]
          assert phones, 'No available iPhone simulator'
          device = phones[0]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('IOS_SIM=' + device['udid'] + '\n')
          print(device['name'], device['udid'])
          PY
      - name: Swift model regressions
        if: matrix.suite == 'messaging'
        run: ./Tests/run.sh
      - name: Build and install the fixture app
        run: |
          xcrun simctl boot "$IOS_SIM" || true
          xcrun simctl bootstatus "$IOS_SIM" -b
          xcodebuild -project Pigeonpost.xcodeproj -scheme Pigeonpost -configuration Debug \
            -destination "id=$IOS_SIM" -derivedDataPath "$RUNNER_TEMP/ios-app" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$IOS_SIM" "$RUNNER_TEMP/ios-app/Build/Products/Debug-iphonesimulator/Pigeonpost.app"
      - name: Native history, mailbox, purchase and composer regressions
        run: |
          case "${{ matrix.suite }}" in
            messaging) selected_tests=(-only-testing:PPUITests/IOSUXTests -only-testing:PPUITests/ComposerTests -only-testing:PPUITests/GroupTests) ;;
            calendar) selected_tests=(-only-testing:PPUITests/CalendarUITests -only-testing:PPUITests/OrganizationRoomUITests) ;;
            account) selected_tests=(-only-testing:PPUITests/HandlePurchaseTests -only-testing:PPUITests/Phase1bTests -only-testing:PPUITests/DeviceApprovalUITests -only-testing:PPUITests/PeopleUITests) ;;
            *) exit 1 ;;
          esac
          if [[ "$CALENDAR_FILES_ONLY" == true ]]; then
            [[ "${{ matrix.suite }}" == calendar ]] || exit 0
            selected_tests=(-only-testing:PPUITests/CalendarUITests/testLocalCalendarFileCanBeSelectedAndPreviewed
              -only-testing:PPUITests/CalendarUITests/testCalendarFilePickerOpensAndCancels
              -only-testing:PPUITests/CalendarUITests/testEventExportChooserCanBeCancelled)
          fi
          xcodebuild test -project UITests/PPUITests.xcodeproj -scheme PPUITests \
            -destination "id=$IOS_SIM" -derivedDataPath "$RUNNER_TEMP/ios-tests" \
            -resultBundlePath "$RUNNER_TEMP/ios-ux.xcresult" \
            "${selected_tests[@]}"
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-ux-${{ matrix.suite }}-results
          path: ${{ runner.temp }}/ios-ux.xcresult
          retention-days: 14

  native-ipad:
    # The iPad layout audit (SDS 19.2): every screen in portrait and landscape, failing on controls
    # drawn over one another or bar titles cut short.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - name: Select Xcode and an available iPad
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)
              match = re.search(r'Xcode ([\d.]+)', version)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), developer))
          selected = max(candidates)[1]
          subprocess.run(['sudo', 'xcode-select', '-s', selected], check=True)
          PY
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtimes = sorted([r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier']],
                            key=lambda r: tuple(map(int, r['version'].split('.'))), reverse=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          pads = [d for r in runtimes for d in devices.get(r['identifier'], []) if 'iPad' in d['name']]
          assert pads, 'No available iPad simulator'
          # The smallest iPad is where the columns are tightest.
          pads.sort(key=lambda d: (0 if 'mini' in d['name'] else 1))
          device = pads[0]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('IPAD_SIM=' + device['udid'] + '\n')
          print(device['name'], device['udid'])
          PY
      - name: Build and install the fixture app
        run: |
          xcrun simctl boot "$IPAD_SIM" || true
          xcrun simctl bootstatus "$IPAD_SIM" -b
          xcodebuild -project Pigeonpost.xcodeproj -scheme Pigeonpost -configuration Debug \
            -destination "id=$IPAD_SIM" -derivedDataPath "$RUNNER_TEMP/ipad-app" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$IPAD_SIM" "$RUNNER_TEMP/ipad-app/Build/Products/Debug-iphonesimulator/Pigeonpost.app"
      - name: iPad layout and calendar regressions
        run: |
          selected_tests=(-only-testing:PPUITests/IPadLayoutTests -only-testing:PPUITests/CalendarUITests -only-testing:PPUITests/DeviceApprovalUITests
            -only-testing:PPUITests/OrganizationRoomUITests -only-testing:PPUITests/PeopleUITests)
          if [[ "$CALENDAR_FILES_ONLY" == true ]]; then
            selected_tests=(-only-testing:PPUITests/CalendarUITests/testLocalCalendarFileCanBeSelectedAndPreviewed
              -only-testing:PPUITests/CalendarUITests/testCalendarFilePickerOpensAndCancels
              -only-testing:PPUITests/CalendarUITests/testEventExportChooserCanBeCancelled)
          fi
          xcodebuild test -project UITests/PPUITests.xcodeproj -scheme PPUITests \
            -destination "id=$IPAD_SIM" -derivedDataPath "$RUNNER_TEMP/ipad-tests" \
            -resultBundlePath "$RUNNER_TEMP/ipad-layout.xcresult" \
            "${selected_tests[@]}"
      - name: Preserve iPad layout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-layout-results
          path: ${{ runner.temp }}/ipad-layout.xcresult
          retention-days: 14

  native-storekit:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.calendar_files_only }}
    # iOS 26.5's CLI StoreKit session cannot save its configuration (FB22237318).
    # Keep the current-runtime UI suite above, and verify real StoreKit transactions
    # on iOS 18 until the hosted image includes a fixed runtime.
    # https://developer.apple.com/forums/thread/826971
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - name: Select the StoreKit-compatible simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          phones = [d for runtime, entries in devices.items()
                    if runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-18-')
                    for d in entries if 'iPhone' in d['name']]
          assert phones, 'No iOS 18 iPhone simulator available for StoreKit testing'
          device = phones[0]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('IOS_STOREKIT_SIM=' + device['udid'] + '\n')
          print(device['name'], device['udid'])
          PY
      - name: Native StoreKit capacity, upgrade, downgrade, restore and expiry
        run: |
          xcrun simctl boot "$IOS_STOREKIT_SIM" || true
          xcrun simctl bootstatus "$IOS_STOREKIT_SIM" -b
          xcodebuild test -project Pigeonpost.xcodeproj -scheme HandleStoreKitTests \
            CODE_SIGNING_ALLOWED=NO -destination "id=$IOS_STOREKIT_SIM" -derivedDataPath "$RUNNER_TEMP/storekit-tests" \
            -resultBundlePath "$RUNNER_TEMP/storekit.xcresult" \
            -only-testing:HandleStoreKitTests/NativeHandleStoreKitTests
      - name: Preserve StoreKit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-storekit-results
          path: ${{ runner.temp }}/storekit.xcresult
          retention-days: 14
