name: CosmosMap iPad TestFlight

# CosmosMap (bekirdag/space_simulation, public) is a WebGPU web app wrapped in a native
# iPad shell. This manual broker reuses Wodo's signing credentials already proven by
# Pigeonpost, builds the web bundle, archives the iPad app and uploads it to TestFlight.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Full 40-character commit SHA from bekirdag/space_simulation."
        required: true
        type: string
      build_number:
        description: "CFBundleVersion. Must be higher than every CosmosMap build already uploaded."
        required: true
        default: "1"
        type: string
      marketing_version:
        description: "CFBundleShortVersionString."
        required: true
        default: "1.0"
        type: string
      upload:
        description: "Upload to App Store Connect. Off means archive and export only."
        required: true
        default: true
        type: boolean
      status_only:
        description: "Only inspect CosmosMap in App Store Connect; do not build it."
        required: true
        default: false
        type: boolean
      runner:
        description: "Runner image. Needs Xcode 26 or later."
        required: false
        default: macos-26
        type: string

permissions:
  contents: read

concurrency:
  group: cosmosmap-ipad-testflight
  cancel-in-progress: false

jobs:
  status:
    name: App Store Connect preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect CosmosMap and its TestFlight groups
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.wodo.cosmosmap
        run: python3 .github/scripts/testflight_status.py

  archive:
    name: build, archive and upload
    needs: status
    if: ${{ !inputs.status_only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the release broker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out CosmosMap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bekirdag/space_simulation
          ref: ${{ inputs.source_ref }}
          path: cosmosmap
          persist-credentials: false

      - name: Require an immutable CosmosMap source commit
        shell: bash
        working-directory: cosmosmap
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          [ "$(git rev-parse HEAD)" = "$SOURCE_REF" ] ||
            { echo "::error::Checked out the wrong commit."; exit 1; }

      - name: Build the web bundle and copy it into the iPad app
        shell: bash
        working-directory: cosmosmap
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm run build
          bash ios/scripts/sync-web.sh
          test -f ios/CosmosMap/Web/index.html
          du -sh ios/CosmosMap/Web

      - name: Select an Xcode that can build for the store
        shell: bash
        run: |
          set -euo pipefail
          best=""
          best_version=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "$app/Contents/Info.plist" 2>/dev/null || echo "")
            [ -n "$version" ] || continue
            echo "found $app — $version"
            if [ -z "$best_version" ] ||
               [ "$(printf '%s\n%s\n' "$version" "$best_version" | sort -V | tail -1)" = "$version" ]; then
              best="$app"
              best_version="$version"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          echo "Using $best (Xcode $best_version)"
          sudo xcode-select -s "$best/Contents/Developer"
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          echo "iOS SDK: $sdk"
          if [ "${sdk:-0}" -lt 26 ]; then
            echo "::error::The newest iOS SDK is ${sdk:-none}; App Store Connect requires iOS 26 or newer."
            exit 1
          fi
          xcodebuild -version

      - name: Reconcile the simulator runtime with the SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_build=$(xcodebuild -version -sdk iphonesimulator ProductBuildVersion 2>/dev/null || true)
          runtime_build=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]; rs.sort(key=lambda r: [int(n) for n in r['version'].split('.') if n.isdigit()]); print(rs[-1]['buildversion'] if rs else '')")
          echo "simulator SDK build: ${sdk_build:-none}, newest iOS runtime: ${runtime_build:-none}"
          if [ -n "$sdk_build" ] && [ -n "$runtime_build" ]; then
            xcrun simctl runtime match set "$sdk_build" "$runtime_build" ||
              echo "::warning::Could not pin runtime $runtime_build to SDK $sdk_build; continuing."
            xcrun simctl runtime match list || true
          fi

      - name: Import and validate the Wodo signing assets
        shell: bash
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.COSMOSMAP_APPLE_PROFILE }}
        run: |
          set -euo pipefail
          for name in P12 P12_PASSWORD PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is not set."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/cosmosmap-signing.keychain-db"
          pass="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cosmosmap-dist.p12"
          security import "$RUNNER_TEMP/cosmosmap-dist.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cosmosmap-dist.p12"

          raw_profile="$RUNNER_TEMP/cosmosmap.mobileprovision"
          profile_plist="$RUNNER_TEMP/cosmosmap-profile.plist"
          printf '%s' "$PROFILE" | base64 --decode > "$raw_profile"
          echo "0af903ac4f425b94787defefbfa7f937a669d0850ccab865e7ae2678f414e9f0  $raw_profile" |
            shasum -a 256 -c -
          security cms -D -i "$raw_profile" > "$profile_plist"

          team=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$profile_plist")
          app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$profile_plist")
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          [ "$team" = "AH277897AV" ] || { echo "::error::Unexpected profile team."; exit 1; }
          [ "$app_id" = "AH277897AV.com.wodo.cosmosmap" ] || { echo "::error::Unexpected profile app identifier."; exit 1; }
          [ "$name" = "CosmosMap App Store" ] || { echo "::error::Unexpected profile name."; exit 1; }

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$raw_profile" "$profiles/$uuid.mobileprovision"
          security find-identity -v -p codesigning "$keychain" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Validate CosmosMap's release contract
        working-directory: cosmosmap/ios
        run: |
          set -euo pipefail
          ruby -c scripts/generate_xcode_project.rb
          plutil -lint CosmosMap/Resources/Info.plist
          plutil -lint CosmosMap/Resources/PrivacyInfo.xcprivacy
          plutil -lint ExportOptions.plist

      - name: Prove WebGPU renders in an iPadOS 26 simulator
        working-directory: cosmosmap
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              version = [int(n) for n in runtime.rsplit('iOS-', 1)[-1].split('-') if n.isdigit()]
              for d in devices:
                  if d.get('isAvailable') and d.get('name', '').startswith('iPad Pro 13-inch'):
                      if best is None or version > best[0]:
                          best = (version, d['udid'])
          print(best[1] if best else '')
          ")
          [ -n "$device_id" ] || { echo "::error::No iPad Pro 13-inch simulator is available."; exit 1; }
          xcrun simctl list devices | grep "$device_id"
          xcodebuild build \
            -project ios/CosmosMap.xcodeproj \
            -scheme CosmosMap \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" \
            CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/sim-dd/Build/Products/Debug-iphonesimulator/CosmosMap.app"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app"
          log="$RUNNER_TEMP/selftest.log"
          ( timeout 240 xcrun simctl launch --console-pty --terminate-running-process "$device_id" com.wodo.cosmosmap > "$log" 2>&1 || true ) &
          launcher=$!
          for _ in $(seq 1 240); do
            grep -q "SELFTEST" "$log" 2>/dev/null && break
            sleep 1
          done
          sleep 5
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/screens/ipad13-launch.png" || true
          kill "$launcher" 2>/dev/null || true
          grep "\[CosmosMap\]" "$log" || true
          result=$(grep -m1 -o 'SELFTEST .*' "$log" | cut -d' ' -f2- || true)
          echo "self-test: ${result:-none}"
          python3 - "$result" <<'PY'
          import json, sys
          raw = sys.argv[1]
          if not raw:
              raise SystemExit("::error::The app never reported a WebGPU self-test result.")
          r = json.loads(raw)
          ok = r.get("secure") and r.get("gpu") and r.get("adapter") and r.get("device") and r.get("loaded") and not r.get("errorOverlay")
          if not ok:
              raise SystemExit(f"::error::WebGPU self-test failed on the iPadOS simulator: {r}")
          print("WebGPU works in the iPad app:", r)
          PY

      - name: Keep the simulator screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmosmap-ipad-simulator-${{ inputs.build_number }}
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 30

      - name: Write the App Store Connect key
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::APPLE_API_PRIVATE_KEY is not set."
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          head -1 "$RUNNER_TEMP/keys/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" ||
            { echo "::error::The API key is not a PEM private key."; exit 1; }

      - name: Archive CosmosMap
        working-directory: cosmosmap/ios
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::build_number must be a whole number; got '$BUILD_NUMBER'." ; exit 1 ;;
          esac
          xcodebuild \
            -project CosmosMap.xcodeproj \
            -scheme CosmosMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CosmosMap.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            DEVELOPMENT_TEAM=AH277897AV \
            PRODUCT_BUNDLE_IDENTIFIER=com.wodo.cosmosmap \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="CosmosMap App Store" \
            archive

      - name: Verify the signed archive
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/CosmosMap.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::Archive contains no application bundle."; exit 1; }
          plist="$app/Info.plist"
          for key in CFBundleDisplayName CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion DTSDKName ITSAppUsesNonExemptEncryption; do
            printf '%s = %s\n' "$key" "$(plutil -extract "$key" raw -o - "$plist")"
          done
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "com.wodo.cosmosmap" ]
          [ "$(plutil -extract CFBundleDisplayName raw -o - "$plist")" = "CosmosMap" ]
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$plist")" = "false" ]
          [ "$(plutil -extract UIDeviceFamily.0 raw -o - "$plist")" = "2" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName' "$plist")" = "AppIcon" ]
          for icon_spec in "AppIcon76x76@2x~ipad.png:152:152"; do
            IFS=: read -r filename width height <<< "$icon_spec"
            icon="$app/$filename"
            [ -f "$icon" ] || { echo "::error::Archive is missing $filename."; exit 1; }
            [ "$(sips -g pixelWidth "$icon" | tail -1 | awk '{print $2}')" = "$width" ]
            [ "$(sips -g pixelHeight "$icon" | tail -1 | awk '{print $2}')" = "$height" ]
            [ "$(sips -g hasAlpha "$icon" | tail -1 | awk '{print $2}')" = "no" ]
          done
          test -f "$app/Web/index.html" || { echo "::error::Web bundle missing from the app."; exit 1; }
          du -sh "$app" "$app/Web"
          codesign --verify --deep --strict "$app"

      - name: Export and optionally upload
        working-directory: cosmosmap/ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions-CosmosMap.plist"
          cp ExportOptions.plist "$options"
          plutil -replace signingStyle -string manual "$options"
          plutil -replace signingCertificate -string "Apple Distribution" "$options"
          plutil -replace provisioningProfiles -json '{"com.wodo.cosmosmap":"CosmosMap App Store"}' "$options"
          if [ "$UPLOAD" = "true" ]; then
            plutil -replace destination -string upload "$options"
          else
            plutil -replace destination -string export "$options"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CosmosMap.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/CosmosMapExport" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Put the build in front of internal testers
        if: inputs.upload
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.wodo.cosmosmap
          WAIT_FOR: ${{ inputs.build_number }}
          WAIT_MINUTES: "30"
          FIX: "true"
        run: python3 .github/scripts/testflight_status.py

      - name: Keep the IPA and symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmosmap-ipad-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/CosmosMapExport/*.ipa
            ${{ runner.temp }}/CosmosMap.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          rm -f "$RUNNER_TEMP/cosmosmap-dist.p12" "$RUNNER_TEMP/cosmosmap.mobileprovision" "$RUNNER_TEMP/cosmosmap-profile.plist"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          security delete-keychain "$RUNNER_TEMP/cosmosmap-signing.keychain-db" 2>/dev/null || true
