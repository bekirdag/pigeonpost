name: CosmosMap App Store Preparation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact CosmosMap source commit
        required: true
        type: string
      operation:
        description: Scoped App Store operation
        required: true
        default: inspect
        type: choice
        options: [inspect, prepare_media, prepare_review]
permissions:
  contents: read
concurrency:
  group: cosmosmap-appstore-preparation
  cancel-in-progress: false
# Linux jobs use GitHub-hosted runners unless the repository variable PIGEONPOST_SELF_HOSTED_CI is
# 'true' (docs/ci-runners.md: the wodo-ci pool is opt-in until it can carry this load). Fork PRs
# never select the self-hosted pool, whatever the variable says.
jobs:
  prepare:
    runs-on: ${{ vars.PIGEONPOST_SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","wodo-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Validate immutable source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wodohq/cosmosmap
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.COSMOSMAP_DEPLOY_KEY }}
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            ios/scripts
            ios/release-media/1.11
      - name: Prepare CosmosMap release
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          OPERATION: ${{ inputs.operation }}
        run: python3 ios/scripts/appstore_release.py > appstore-report.json
      - name: Keep sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cosmosmap-appstore-report
          path: appstore-report.json
          retention-days: 7
