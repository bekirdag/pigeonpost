name: iOS TestFlight status

# Why this exists: an upload that "succeeded" tells you only that Apple accepted the package.
# Whether a tester's phone can see it is a different set of facts, all of them server-side —
# processing state, the export-compliance answer, whether the build was ever added to a beta
# group, and whether that group has any testers. When a build is "pushed but not visible", the
# answer is always one of those, and guessing which is how an afternoon disappears.
#
# Runs on Linux: this only talks to the App Store Connect API, so there is no reason to pay for a
# macOS runner or wait for one.

on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Also act: answer export compliance and add the newest build to every internal group."
        required: false
        default: false
        type: boolean
      build_number:
        description: "Optional exact build to wait for and distribute; also installs its prepared release notes when fix is on."
        required: false
        default: ""
        type: string
      handle_catalog:
        description: "Inspect or provision the approved iOS handle subscription catalog."
        required: false
        default: none
        type: choice
        options: [none, audit, apply]

permissions:
  contents: read

concurrency:
  # Read-only reports can inspect a long catalog setup; all writes stay serialized.
  group: ios-testflight-status${{ !inputs.fix && inputs.handle_catalog != 'apply' && '-read' || '' }}
  cancel-in-progress: false

jobs:
  status:
    name: ask App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        if: inputs.handle_catalog == 'none' || inputs.handle_catalog == ''
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          FIX: ${{ inputs.fix }}
          BUNDLE_ID: dev.pigeonpost.inbox
          WAIT_FOR: ${{ inputs.build_number }}
          RELEASE_NOTES_FILE: ${{ inputs.build_number != '' && 'apps/ios/Store/TESTFLIGHT-NOTES.txt' || '' }}
        run: python3 .github/scripts/testflight_status.py

      - name: Handle subscription catalog
        if: inputs.handle_catalog == 'audit' || inputs.handle_catalog == 'apply'
        env:
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLY: ${{ inputs.handle_catalog == 'apply' }}
        run: python3 .github/scripts/ios_handle_catalog.py
