name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'crates/pigeonpost-groupcrypto/**'
      - '.github/workflows/windows-desktop.yml'
      # The call test runs the web call client and the call service from this repository.
      - 'site-inbox/native-call.*'
      - 'site-inbox/calls.js'
      - 'site-inbox/names.js'
      - 'calls-service/**'
      # The live stream test runs the web stream client and its stand-in postbox.
      - 'site-inbox/live.js'
      - 'site-inbox/calls-e2ee*.js'
      - 'tests/e2e-streams/**'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

# Linux jobs use GitHub-hosted runners unless the repository variable PIGEONPOST_SELF_HOSTED_CI is
# 'true' (docs/ci-runners.md: the wodo-ci pool is opt-in until it can carry this load). Fork PRs
# never select the self-hosted pool, whatever the variable says.
jobs:
  core:
    name: Core behavior
    runs-on: ${{ vars.PIGEONPOST_SELF_HOSTED_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","wodo-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          # The self-hosted runner's user cannot write /usr/share/dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
      - name: Build the group crypto library (MLS round trips in the core tests)
        working-directory: crates/pigeonpost-groupcrypto
        run: cargo build --locked --release -p pigeonpost-groupcrypto-ffi
      - name: Run domain, API, state and group encryption tests
        working-directory: apps/windows
        run: dotnet run --project Pigeonpost.Core.Tests/Pigeonpost.Core.Tests.csproj -c Release

  desktop:
    name: Windows ${{ matrix.architecture }}
    needs: core
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pigeonpost-groupcrypto
          key: ${{ matrix.architecture }}
      - name: Compile native app and validate unsigned MSIX
        shell: pwsh
        run: ./apps/windows/build.ps1 -Architecture '${{ matrix.architecture }}' -Package
      - name: Exercise fresh verification and loopback browser return on Windows
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path apps/windows/artifacts/screenshots -Force | Out-Null
          $signInEvidence = 'apps/windows/artifacts/screenshots/strong-signin.log'
          dotnet run --project apps/windows/Pigeonpost.Core.Tests/Pigeonpost.Core.Tests.csproj -c Release -- --strong-signin *> $signInEvidence
          $signInResult = $LASTEXITCODE
          Get-Content $signInEvidence
          if ($signInResult -ne 0) { throw 'Windows verification/session/socket tests failed.' }
      - name: Upload Store packages and test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pigeonpost-windows-${{ matrix.architecture }}
          path: |
            apps/windows/artifacts/**/*.zip
            apps/windows/artifacts/**/*.msix
          if-no-files-found: error
          retention-days: 14
      - name: Launch the native release app
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) { Set-DisplayResolution -Width 1920 -Height 1080 -Force }
          $exe = Get-ChildItem apps/windows/artifacts -Filter Pigeonpost.exe -Recurse | Select-Object -First 1
          ./apps/windows/smoke-test.ps1 -Executable $exe.FullName -OutputDirectory apps/windows/artifacts/screenshots
      - name: Compile and exercise a separate UI-test binary
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          dotnet publish apps/windows/Pigeonpost.Desktop/Pigeonpost.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:DefineConstants=UI_TESTS --self-contained true -o apps/windows/artifacts/ui-tests
          if ($LASTEXITCODE -ne 0) { throw 'UI-test build failed.' }
          ./apps/windows/run-ui-as-user.ps1 -Executable "$PWD/apps/windows/artifacts/ui-tests/Pigeonpost.exe" -OutputDirectory apps/windows/artifacts/screenshots
      - name: Start at sign-in stays in the notification area (taskbar owner's session)
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./apps/windows/test-startup-tray.ps1 -Executable "$PWD/apps/windows/artifacts/ui-tests/Pigeonpost.exe" -OutputDirectory apps/windows/artifacts/screenshots
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.architecture == 'x64'
        with:
          node-version: '24.19.0'
      - name: Voice and video calls with a browser peer (local call service, fake media devices)
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: ./apps/windows/test-calls.ps1 -Executable "$PWD/apps/windows/artifacts/ui-tests/Pigeonpost.exe" -OutputDirectory apps/windows/artifacts/screenshots/calls
      - name: Live streams in WebView2 with a browser streamer and viewer (local LiveKit, synthetic media)
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'livekit.zip'
          Invoke-WebRequest -Uri 'https://github.com/livekit/livekit/releases/download/v1.13.10/livekit_1.13.10_windows_amd64.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fd4b7c2c3c1e4c71adaa4f6a046ad1c0abaaaf1e09fae904b35bf231ffae11d2') { throw "LiveKit archive hash mismatch: $hash" }
          $folder = Join-Path $env:RUNNER_TEMP 'livekit'
          Expand-Archive $zip -DestinationPath $folder -Force
          $server = Get-ChildItem $folder -Filter 'livekit-server.exe' -Recurse | Select-Object -First 1
          ./apps/windows/test-streams.ps1 -Executable "$PWD/apps/windows/artifacts/ui-tests/Pigeonpost.exe" -OutputDirectory apps/windows/artifacts/screenshots/streams -LiveKit $server.FullName
      - name: Install and activate the MSIX on the disposable runner
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $package = Get-ChildItem apps/windows/artifacts -Filter '*.msix' -Recurse | Select-Object -First 1
          ./apps/windows/test-install.ps1 -Package $package.FullName -OutputDirectory apps/windows/artifacts/screenshots/installed
      - name: Upload native UI evidence
        if: always() && matrix.architecture == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pigeonpost-windows-native-ui
          path: |
            apps/windows/artifacts/screenshots/*.png
            apps/windows/artifacts/screenshots/*.log
            apps/windows/artifacts/screenshots/*.json
            apps/windows/artifacts/screenshots/installed/*.png
            apps/windows/artifacts/screenshots/installed/*.log
            apps/windows/artifacts/screenshots/calls/*.png
            apps/windows/artifacts/screenshots/calls/*.json
            apps/windows/artifacts/screenshots/streams/*.png
            apps/windows/artifacts/screenshots/streams/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check public account and privacy pages
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          foreach ($url in @('https://pigeonpost.dev/privacy', 'https://inbox.pigeonpost.dev/', 'https://auth.pigeonpost.dev/realms/pigeonpost-prod/.well-known/openid-configuration')) {
            $response = Invoke-WebRequest -Uri $url -TimeoutSec 30 -MaximumRetryCount 1 -RetryIntervalSec 2
            if ($response.StatusCode -ne 200) { throw "Public URL failed: $url" }
            Write-Host "Public URL passed: $url"
          }
