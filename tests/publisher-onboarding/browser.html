<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publisher onboarding synthetic UI checks</title><link rel="stylesheet" href="../../site/style.css"><link rel="stylesheet" href="../../site/account.css"><link rel="stylesheet" href="../../site/publisher-onboarding.css"><script src="../../site/marketplace-core.js"></script><script src="../../site/publisher-onboarding.js"></script></head><body><main class="wrap"><h1>Developer application</h1><p>Synthetic UI fixture. No network requests, credentials or real applicant records.</p><div id="wizard"></div><div id="review"></div></main><script>
const app={id:'pub_synthetic',state:'draft',revision:0,kind:'company',country:'TR',kyc_status:'not_started',details:{kind:'company',country:'TR',public_name:'Example Studio'},documents:[],history:[]};window.calls=[];
const deps={pb:async(path,opts)=>{calls.push({path,method:opts?.method||'GET'});const b=opts?.body?JSON.parse(opts.body):{};if(path.includes('/staff/publisher-dossiers?'))return {data:[{id:app.id,display_name:'Example Studio',state:app.state,kind:'company',country:'TR',updated_at:new Date().toISOString()}],total:1,next_offset:null};if(path.endsWith('/review')){app.state=b.decision;app.revision++;app.history.unshift({event:b.decision,note:b.reason,revision:app.revision,created_at:new Date().toISOString()});}else if(path.endsWith('/submit')){app.state='submitted';app.revision++;}else if(opts?.method==='PUT'){app.details=b.details;app.revision++;}return {data:structuredClone(app)};}};
PPMarketplace.onboarding(document.getElementById('wizard'),deps,{id:app.id,status:'applied',display_name:'Example Studio'});PPMarketplace.applicationReview(document.getElementById('review'),deps);
</script></body></html>
