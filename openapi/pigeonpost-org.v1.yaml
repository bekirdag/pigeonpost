      properties:
        address:
          type: string
          description: The agent mailbox's `/k/…` address.
        handle:
          type: string
          description: '`/acme/ci-bot`.'
        label:
          type: [string, 'null']
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, 'null']
          format: date-time
        devices:
