      x-required-scope: org:read
      x-error-codes: [unauthorized, ip_not_allowed, insufficient_scope, forbidden, feature_disabled, org_inactive,
        rate_limited, store_error]
      responses:
        '200':
          description: Success.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Org'
                additionalProperties: false
              example:
                data:
                  id: org_qivthlmhyfekbiqklot42xv4vj
                  name: Acme Inc.
                  namespace: acme
                  status: active
                  seats: 25
                  seats_used: 18
                  agent_limit: 250
                  agents_used: 7
                  storage_bytes: 734003200
                  plan_code: enterprise_monthly
                  period_end: '2026-11-20T00:00:00Z'
