          description: '`room_encrypted`, `org_inactive`, `org_read_only`, `idempotency_conflict`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: room_encrypted
                  message: '`POST /messages` targeted a room or group.'
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#room_encrypted
        '413':
          description: '`payload_too_large`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: payload_too_large
                  message: The message body is over 64 KB.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#payload_too_large
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
webhooks:
  orgEvent:
    post:
      tags: [Webhooks]
      operationId: receiveOrgEvent
      summary: Event delivery (to your endpoint)
      description: |
        Pigeonpost `POST`s each event to every webhook subscribed to it. Verify `Pigeonpost-Signature` before trusting the body: `t=<unix seconds>,v1=<hex>`, where each `v1` is HMAC-SHA256 with the webhook secret over the exact bytes `t + "." + raw body`. During the 24 hours after a rotation there are two `v1=` entries (new secret first); accept either. Compare in constant time, reject timestamps more than 5 minutes from your clock, and deduplicate on `Pigeonpost-Event-Id`: delivery is at least once.

        A 2xx within 10 seconds is success. Anything else, including any 3xx (redirects are never followed), is retried after 30 s, 2 min, 10 min, 30 min, 1 h, then every 2 h until 24 h after the event, then marked failed.

        Events: `member.invited`, `member.joined`, `member.suspended`, `member.removed` (`member_id`, `handle`); `agent.created` (`agent`, `handle`); `agent.connected`, `agent.disconnected` (`agent`, `device_id`); `room.created`, `room.deleted` (`room_id`); `billing.status_changed` (`status`, `previous_status`). `meeting.brief_ready` and `security.ssh_session` are reserved and not emitted yet.
      parameters:
        - name: Pigeonpost-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex HMAC-SHA256>` (two `v1=` entries during a rotation).'
          schema:
            type: string
          example: t=1793095200,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
        - name: Pigeonpost-Event-Id
          in: header
          required: true
          description: Same as the body's `id`; stable across retries.
          schema:
            type: string
          example: evt_noldzqoc27j2j364fkwevy4kr3
        - name: Pigeonpost-Event-Type
          in: header
          required: true
          schema:
            type: string
            enum: [member.invited, member.joined, member.suspended, member.removed, agent.created, agent.connected,
              agent.disconnected, room.created, room.deleted, billing.status_changed, meeting.brief_ready,
              security.ssh_session]
          example: member.joined
        - name: Pigeonpost-Delivery-Id
          in: header
          required: true
          description: Unique per attempt.
          schema:
            type: string
          example: whd_y7hgnuh3ctr4fvgzeciyzrwmpz
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            const: Pigeonpost-Webhooks/1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            examples:
              member.joined:
                value:
                  id: evt_k2c4ifaznyrl2ckbfktcqdumrn
                  type: member.joined
                  created_at: '2026-10-27T10:15:00Z'
                  org_id: org_qivthlmhyfekbiqklot42xv4vj
                  data:
                    member_id: mem_qh4pnxpiqns7heuhs3whvjj7ok
                    handle: /acme/jane
              agent.connected:
                value:
                  id: evt_7xj6hjwuoynw2zqtyj4mroelnu
                  type: agent.connected
                  created_at: '2026-10-27T10:15:00Z'
                  org_id: org_qivthlmhyfekbiqklot42xv4vj
                  data:
                    agent: /k/m2mjdlhsxotv7yjgljwwt7dtip
                    device_id: dev_kj5kt5brkoo2rykr2vbu2hk6me
              room.created:
                value:
                  id: evt_tqbk5f5fbgm7odavxiyjcdlpuc
                  type: room.created
                  created_at: '2026-10-27T10:15:00Z'
                  org_id: org_qivthlmhyfekbiqklot42xv4vj
                  data:
                    room_id: grp_qrmudhkm7zvrvswbjgkbbkwp7l
              billing.status_changed:
                value:
                  id: evt_2wrkwlzsldkveq6e56ikj2hpou
                  type: billing.status_changed
                  created_at: '2026-10-27T10:15:00Z'
                  org_id: org_qivthlmhyfekbiqklot42xv4vj
                  data:
                    status: past_due
                    previous_status: active
      responses:
        2XX:
          description: Received. Answer within 10 seconds; do the work afterwards.
        default:
          description: Anything else is retried.
components:
  securitySchemes:
    orgKey:
      type: http
      scheme: bearer
      bearerFormat: pk_org_<32>
      description: Org API key (`pk_org_…`), shown once at creation and stored only as SHA-256.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1..200 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from the previous page. Pass back exactly.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '1-255 printable ASCII characters. Scoped to the key and route; a replay within 24
        h returns the recorded response with `Idempotent-Replayed: true`. Reusing it for a different request
        is `409 idempotency_conflict`.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: onboard-jane-2026-10-27
    Member:
      name: member
      in: path
      required: true
      description: Member id (`mem_…`) or the member's name inside the org (`john` for `/acme/john`).
      schema:
        type: string
      example: john
    Agent:
      name: agent
      in: path
      required: true
      description: The agent's name (`ci-bot`) or its mailbox address.
      schema:
        type: string
      example: ci-bot
    Enrollment:
      name: enrollment
      in: path
      required: true
      description: Enrollment id (from `GET /agents/{agent}/enrollments`).
      schema:
        type: string
      example: enr_ahv2rqphyz4bqgckiljwwiltn7
    Rule:
      name: rule
      in: path
      required: true
      description: Rule id.
      schema:
        type: string
      example: rule_unpvkpyglae5zpxsyrifunjcqi
    Room:
      name: room
      in: path
      required: true
      description: Room id (`grp_…`).
      schema:
        type: string
      example: grp_qrmudhkm7zvrvswbjgkbbkwp7l
    Webhook:
      name: webhook
      in: path
      required: true
      description: Webhook id (`wh_…`).
      schema:
        type: string
      example: wh_l2v6a376dfbkghh3usy7oy7hm5
  headers:
    RateLimitLimit:
      description: Requests allowed per minute in the bucket that applied (600, or 60 for writes).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplayed:
      description: '`true` when this is the recorded response to an earlier request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ['true']
    CacheControlNoStore:
      description: '`no-store`: the body carries a one-time link or secret.'
      schema:
        type: string
        enum: [no-store]
  schemas:
    Error:
      type: object
      description: Every refusal. `code` is stable; see the error reference.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, doc_url]
          properties:
            code:
              type: string
              description: Stable, machine-readable code. Branch on this.
              enum:
                - bad_request
                - invalid_handle
                - invalid_contact
                - invalid_rule
                - invalid_cursor
                - invalid_webhook_url
                - unauthorized
                - ip_not_allowed
                - insufficient_scope
                - forbidden
                - human_required
                - recipient_not_in_org
                - not_admitted
                - not_found
                - feature_disabled
                - seat_limit
                - agent_limit
                - handle_taken
                - already_invited
                - domain_not_verified
                - org_read_only
                - org_inactive
                - idempotency_conflict
                - room_encrypted
                - invite_used
                - webhook_limit
                - too_many_rules
                - payload_too_large
                - rate_limited
                - store_error
                - not_org_mailbox
                - unknown_recipient
                - never_auto_verb
                - invalid_recipient
                - recipient_unresolved
                - invite_pending
                - send_as_unavailable
                - recipient_inbox_full
                - stranger_rate_limited
            message:
              type: string
              description: Human-readable text. May change; do not parse it.
            doc_url:
              type: string
              format: uri
              description: '`https://developers.pigeonpost.dev/org-api-errors#<code>`.'
            details:
              type: object
              description: Extra machine-readable facts some errors carry (for example a `billing` link on `agent_limit`).
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    ListEnvelope:
      type: object
      description: Every list response. Items are the operation's own schema.
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
          description: Pass back as `cursor` to get the next page; `null` on the last page.
      additionalProperties: false
    Deleted:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
          description: The id of what was deleted.
        deleted:
          type: boolean
          const: true
      additionalProperties: false
    Key:
      type: object
      description: The calling key. Never includes the secret.
      required: [id, name, org_id, scopes, last4, send_as, ip_allowlist, created_at, expires_at]
      properties:
        id:
          type: string
          description: '`okey_…`.'
        name:
          type: string
        org_id:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ['org:read', 'members:write', 'agents:write', 'rules:write', 'rooms:write', 'messages:send',
              'audit:read', 'webhooks:write']
        last4:
          type: string
          description: Last four characters of the secret, for recognition.
        send_as:
          type: [string, 'null']
          description: The org agent mailbox `POST /messages` sends as (with `messages:send`).
        ip_allowlist:
          type: array
          items:
            type: string
          description: CIDR ranges; empty means any address.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
      additionalProperties: false
    OrgSettings:
      type: object
      required: [require_mfa, invite_domains_only, rooms_creation]
      properties:
        require_mfa:
          type: boolean
        invite_domains_only:
          type: boolean
        rooms_creation:
          type: string
          enum: [everyone, admins]
      additionalProperties: false
    Org:
      type: object
      required: [id, name, namespace, status, seats, seats_used, agent_limit, agents_used, storage_bytes,
        plan_code, period_end, settings, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
          description: Bare namespace, e.g. `acme` for `/acme/…`.
        status:
          type: string
          enum: [pending, paid_unprovisioned, active, past_due, read_only, suspended]
        seats:
          type: integer
        seats_used:
          type: integer
        agent_limit:
          type: integer
        agents_used:
          type: integer
        storage_bytes:
          type: integer
        plan_code:
          type: [string, 'null']
        period_end:
          type: [string, 'null']
          format: date-time
        settings:
          $ref: '#/components/schemas/OrgSettings'
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Member:
      type: object
      required: [id, handle, address, first_name, last_name, status, roles, contact_masked, invited_at,
        joined_at, last_active_at]
      properties:
        id:
          type: string
          description: '`mem_…`.'
        handle:
          type: string
          description: '`/acme/john`.'
        address:
          type: [string, 'null']
          description: The mailbox's `/k/…` address; `null` until the invitation is accepted.
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
          enum: [invited, active, suspended]
        roles:
          type: array
          items:
            type: string
            enum: [owner, admin, people_admin, agent_admin, billing_admin]
        contact_masked:
          type: [string, 'null']
          description: The invitation contact address, masked.
        invited_at:
          type: [string, 'null']
          format: date-time
        joined_at:
          type: [string, 'null']
          format: date-time
        last_active_at:
          type: [string, 'null']
          format: date-time
      additionalProperties: false
    Invitation:
      type: object
      required: [id, link, expires_at, delivery]
      properties:
        id:
          type: string
          description: '`inv_…`.'
        link:
          type: string
          format: uri
          description: Single-use acceptance link. Returned once; store it nowhere.
        expires_at:
          type: string
          format: date-time
        delivery:
          type: string
          enum: [queued, copy_link]
          description: '`queued`: Pigeonpost sends the invitation. `copy_link`: deliver the link yourself.'
      additionalProperties: false
    MemberInvite:
      type: object
      required: [first_name, last_name, contact, handle]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        contact:
          type: string
          description: The contact address the invitation goes to. Matched case-insensitively after trimming.
        handle:
          type: string
          description: '`/acme/john` or `john`.'
      additionalProperties: false
    MemberPatch:
      type: object
      required: []
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
    MemberWithInvitation:
      type: object
      required: [member, invitation]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        invitation:
