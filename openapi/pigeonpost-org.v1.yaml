  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: |
        Every member of the org, invited, active and suspended. Filter with `status`.

        Scope: `org:read`.

        Errors: `invalid_cursor` (400), `unauthorized` (401), `ip_not_allowed` (403), `insufficient_scope` (403), `forbidden` (403), `feature_disabled` (404), `org_inactive` (409), `rate_limited` (429), `store_error` (500).
      x-required-scope: org:read
      x-error-codes: [invalid_cursor, unauthorized, ip_not_allowed, insufficient_scope, forbidden, feature_disabled,
        org_inactive, rate_limited, store_error]
      parameters:
        - name: status
          in: query
          required: false
          description: Only members in this state.
          schema:
            type: string
            enum: [invited, active, suspended]
          example: active
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Member'
              example:
                data:
                  - id: mem_s3mwglzwgvsmymbskikattzcvb
                    handle: /acme/john
                    address: /k/h5ozgvkb6jlu72ipqqbhnjm5ry
                    first_name: John
                    last_name: Smith
                    status: active
                    roles: []
                    contact_masked: j***@example.com
                    invited_at: '2026-10-21T08:30:00Z'
                    joined_at: '2026-10-21T09:02:11Z'
                    last_active_at: '2026-10-27T10:15:00Z'
                  - id: mem_qh4pnxpiqns7heuhs3whvjj7ok
                    handle: /acme/jane
                    address: null
                    first_name: Jane
                    last_name: Doe
                    status: invited
                    roles: []
                    contact_masked: j***@example.com
                    invited_at: '2026-10-27T10:15:00Z'
                    joined_at: null
                    last_active_at: null
                next_cursor: eyJhZnRlciI6IjIwMjYtMTAtMjcifQ
        '400':
          description: '`invalid_cursor`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_cursor
                  message: The `cursor` was not produced by this list, or was altered.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#invalid_cursor
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`ip_not_allowed`, `insufficient_scope`, `forbidden`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ip_not_allowed
                  message: The request came from an address outside the key's IP allowlist.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#ip_not_allowed
        '404':
          description: '`feature_disabled`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: feature_disabled
                  message: The Enterprise API is not enabled for this org (`org_api` feature flag).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#feature_disabled
        '409':
          description: '`org_inactive`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
