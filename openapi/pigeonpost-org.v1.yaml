        org_inactive, rate_limited, store_error]
      parameters:
        - name: since
          in: query
          required: false
          description: Only entries at or after this time.
          schema:
            type: string
            format: date-time
          example: '2026-10-27T00:00:00Z'
        - name: action
          in: query
          required: false
