        autonomy:
          type: [string, 'null']
          enum: [review, auto, null]
        verbs:
          type: [array, 'null']
          items:
            type: string
        known:
          type: boolean
        locked:
          type: boolean
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        description:
          type: [string, 'null']
        created_by:
          type: [string, 'null']
          description: Member handle, or the key id (`okey_…`) for rules an API key created.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    RuleCreate:
