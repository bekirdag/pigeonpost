        member_count:
          type: integer
        created_by:
          type: string
      additionalProperties: false
    RoomCreate:
      type: object
      required: [name, owner]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        owner:
          type: string
          description: An active org member or agent mailbox; its device activates the room's encryption.
        description:
          type: string
          maxLength: 500
        join_policy:
          type: string
          enum: [private, public]
          default: private
        post_policy:
          type: string
          enum: [everyone, admins]
          default: everyone
        listed:
          type: boolean
          default: false
        auto_join:
          type: boolean
          default: false
      additionalProperties: false
    RoomPatch:
      type: object
      required: []
      properties:
        listed:
          type: boolean
        auto_join:
          type: boolean
      additionalProperties: false
    RoomInvite:
      type: object
      required: [handle]
      properties:
        handle:
          type: string
          description: 'A live org mailbox: `/acme/john` or `john`.'
      additionalProperties: false
    RoomInvitation:
      type: object
      required: [room_id, handle, address, state]
      properties:
        room_id:
          type: string
        handle:
          type: [string, 'null']
        address:
          type: string
          description: The invited mailbox.
        state:
          type: string
          enum: [invited, already_member, banned, group_full]
          description: '`invited` (the person accepts in their app; a member''s device then adds them to the
            encryption group), or why no invitation was made.'
      additionalProperties: false
    AuditEntry:
      type: object
      required: [id, at, actor_kind, actor, action, target, details]
      properties:
        id:
          type: integer
          description: Increasing; follow `next_cursor` rather than computing on it.
        at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [human, agent, api_key, system]
        actor:
          type: [string, 'null']
          description: Member handle, key id or service name.
        action:
          type: string
          description: Dotted action name, e.g. `member.invite`, `api_key.use`.
        target:
          type: [string, 'null']
        details:
          type: object
          additionalProperties: true
          description: 'Action-specific, sanitized: never tokens, contact addresses or message content.'
      additionalProperties: false
    Usage:
      type: object
      required: [seats, seats_used, agent_limit, agents_used, rooms, storage, calls]
      properties:
        seats:
          type: integer
        seats_used:
          type: integer
        agent_limit:
          type: integer
        agents_used:
          type: integer
        rooms:
          type: integer
        storage:
          type: object
          required: [quota_bytes, used_bytes]
          properties:
            quota_bytes:
              type: [integer, 'null']
            used_bytes:
              type: integer
          additionalProperties: false
        calls:
          type: object
          required: [minutes_30d]
          properties:
            minutes_30d:
              type: integer
          additionalProperties: false
      additionalProperties: false
    Billing:
      type: object
      required: [plan_code, status, seats, seats_used, agent_limit, agents_used, period_end, paid_through,
        storage_bytes]
      properties:
        plan_code:
          type: [string, 'null']
        status:
          type: string
          enum: [pending, paid_unprovisioned, active, past_due, read_only, suspended]
        seats:
          type: integer
        seats_used:
          type: integer
        agent_limit:
          type: integer
        agents_used:
          type: integer
        period_end:
          type: [string, 'null']
          format: date-time
        paid_through:
          type: [string, 'null']
          format: date-time
        storage_bytes:
          type: integer
      additionalProperties: false
    LastDelivery:
      type: object
      required: [at, status, response_status]
      properties:
        at:
          type: string
          format: date-time
        status:
          type: string
          enum: [delivered, failed, retrying, blocked]
        response_status:
          type: [integer, 'null']
      additionalProperties: false
    Webhook:
      type: object
      required: [id, url, events, description, status, created_at, created_by, rotated_at, previous_secret_expires_at,
        last_delivery]
      properties:
        id:
          type: string
          description: '`wh_…`.'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - member.invited
              - member.joined
              - member.suspended
              - member.removed
              - agent.created
              - agent.connected
              - agent.disconnected
              - room.created
              - room.deleted
              - billing.status_changed
              - meeting.brief_ready
              - security.ssh_session
              - '*'
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        created_by:
          type: [string, 'null']
        rotated_at:
          type: [string, 'null']
          format: date-time
        previous_secret_expires_at:
          type: [string, 'null']
          format: date-time
        last_delivery:
          oneOf:
            - $ref: '#/components/schemas/LastDelivery'
            - type: 'null'
      additionalProperties: false
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - member.invited
              - member.joined
              - member.suspended
              - member.removed
              - agent.created
              - agent.connected
              - agent.disconnected
              - room.created
              - room.deleted
              - billing.status_changed
              - meeting.brief_ready
              - security.ssh_session
              - '*'
        description:
          type: string
          maxLength: 200
      additionalProperties: false
    WebhookWithSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: '#/components/schemas/Webhook'
        secret:
          type: string
          description: '`whsec_…` signing secret. Shown once.'
      additionalProperties: false
    WebhookRotated:
      type: object
      required: [webhook, secret, previous_secret_expires_at]
      properties:
        webhook:
          $ref: '#/components/schemas/Webhook'
        secret:
          type: string
          description: The new `whsec_…` secret. Shown once.
        previous_secret_expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Delivery:
      type: object
      required: [id, event_id, event_type, attempt, status, response_status, error, duration_ms, at]
      properties:
        id:
          type: string
          description: '`whd_…`, one per attempt.'
        event_id:
          type: string
        event_type:
          type: string
          enum: [member.invited, member.joined, member.suspended, member.removed, agent.created, agent.connected,
            agent.disconnected, room.created, room.deleted, billing.status_changed, meeting.brief_ready,
            security.ssh_session]
        attempt:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [delivered, failed, retrying, blocked]
        response_status:
          type: [integer, 'null']
        error:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
        at:
          type: string
          format: date-time
      additionalProperties: false
    MessageSend:
      type: object
      required: [to, body]
      properties:
        to:
          type: string
          description: 'A member or agent mailbox of this org: `/acme/john`, `john` or its `/k/…` address.'
        body:
          type: string
          description: Plain text, at most 64 KB.
        thread_title:
          type: string
          maxLength: 200
      additionalProperties: false
    MessageSent:
      type: object
      required: [message_id, msg_ref, to, from, sent_at]
      properties:
        message_id:
          type: string
        msg_ref:
          type: string
          description: The message's shared reference (`mref_…`), the same on the sender's and recipient's copies.
        to:
          type: string
        from:
          type: string
          description: The key's `send_as` mailbox.
        sent_at:
          type: string
          format: date-time
      additionalProperties: false
    WebhookEvent:
      type: object
      required: [id, type, created_at, org_id, data]
      properties:
        id:
          type: string
          description: '`evt_…`. Stable across retries: deduplicate on it.'
        type:
          type: string
          enum: [member.invited, member.joined, member.suspended, member.removed, agent.created, agent.connected,
            agent.disconnected, room.created, room.deleted, billing.status_changed, meeting.brief_ready,
            security.ssh_session]
        created_at:
          type: string
          format: date-time
        org_id:
          type: string
        data:
          type: object
          description: Ids and handles only, never content. Which fields appear depends on `type`.
          required: []
          properties:
            member_id:
              type: string
            handle:
              type: string
            agent:
              type: string
              description: Agent mailbox address.
            device_id:
              type: string
            room_id:
              type: string
            status:
              type: string
            previous_status:
              type: string
          additionalProperties: false
      additionalProperties: false
  responses:
    Unauthorized:
      description: '`unauthorized` — Missing, unknown, revoked or expired key.'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: No key, an unknown key, a revoked key or an expired key.
              doc_url: https://developers.pigeonpost.dev/org-api-errors#unauthorized
    RateLimited:
      description: '`rate_limited` — Rate limit exceeded. Try again in 12 seconds.'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Over the key's rate limit (600 requests a minute, of which 60 writes).
              doc_url: https://developers.pigeonpost.dev/org-api-errors#rate_limited
    ServerError:
      description: '`store_error` — The server could not complete the request.'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: store_error
              message: The server could not complete the request.
              doc_url: https://developers.pigeonpost.dev/org-api-errors#store_error
x-error-codes:
  not_org_mailbox:
    status: 400
    description: The handle or address given is not an active member or agent mailbox of this organization.
  unknown_recipient:
    status: 400
    description: No mailbox is hosted at the address given to the rule dry run.
  never_auto_verb:
    status: 400
    description: 'The rule names an action that always needs a person to approve it (`git_push`, `deploy`,
      `read_credentials`, `spend`, `delete_files`, `run_shell`).'
  invalid_recipient:
    status: 400
    description: '`to` is not a Pigeonpost address or handle.'
  recipient_unresolved:
    status: 404
    description: No mailbox answers at `to`.
  invite_pending:
    status: 409
    description: The member has not accepted their invitation yet; remove the member to withdraw it.
  send_as_unavailable:
    status: 409
    description: The agent this key sends as is not an active agent of the organization.
  recipient_inbox_full:
    status: 409
    description: The recipient's mailbox is over its storage quota.
  stranger_rate_limited:
    status: 429
    description: The recipient is receiving too many messages from senders it does not know; retry later.
  bad_request:
    status: 400
    description: 'The body or a parameter is malformed: not JSON, a wrong type, an unknown enum value,
      or a field out of range. The message names the field.'
  invalid_handle:
    status: 400
    description: 'A handle is not valid for this org: wrong namespace, bad characters, reserved, or too
      long. Org handles look like `/acme/john`; on input the bare name `john` is accepted too.'
  invalid_contact:
    status: 400
    description: The invitation contact address is not a valid address.
  invalid_rule:
    status: 400
    description: 'A rule pattern or field is malformed: `owners` outside the org namespace, a pattern
      with more than one wildcard, a priority outside 1..1000, and so on.'
  invalid_cursor:
    status: 400
    description: The `cursor` was not produced by this list, or was altered. Pass back `next_cursor` exactly
      as received.
  invalid_webhook_url:
    status: 400
    description: 'The webhook URL is refused: it must be `https://` on port 443 or 8443, without credentials
      or fragment, at most 2,048 characters, and every address its host resolves to must be public.'
  unauthorized:
    status: 401
    description: No key, an unknown key, a revoked key or an expired key. One answer for all four, so
      a caller cannot probe which.
  ip_not_allowed:
    status: 403
    description: The request came from an address outside the key's IP allowlist.
  insufficient_scope:
    status: 403
    description: The key does not hold the scope this route needs. The route's scope is listed in the
      reference.
  forbidden:
    status: 403
    description: 'The person who created the key no longer has the authority for this action (demoted
      or removed), or the target is out of a key''s reach: the owner, or a member holding an admin role.'
  human_required:
    status: 403
    description: 'Only a person can do this: granting roles, raising trust with a rule, issuing enrollment
      codes or device credentials, deleting a person''s restriction, and every step-up action.'
  recipient_not_in_org:
    status: 403
    description: '`POST /messages`: the recipient is not a live mailbox of this org. API messages only
      go to the org''s own members and agents.'
  not_admitted:
    status: 403
    description: '`POST /messages`: the recipient''s blocks, org rules or inbox policy do not admit messages
      from the key''s `send_as` mailbox.'
  not_found:
    status: 404
    description: No such member, agent, rule, room, webhook or enrollment in this org.
  feature_disabled:
    status: 404
    description: The Enterprise API is not enabled for this org (`org_api` feature flag).
  seat_limit:
    status: 409
    description: Every seat is in use (owner, active, suspended and invited members all count). Buy seats
      or remove someone first.
  agent_limit:
    status: 409
    description: The org has as many agents as it may (10 per seat).
  handle_taken:
    status: 409
    description: The handle already belongs to a member, an agent, or is held for a successor.
  already_invited:
    status: 409
    description: This contact address already has a live invitation or membership in the org.
  domain_not_verified:
    status: 409
    description: The org only invites addresses on its verified domains (`invite_domains_only`), and this
      one is not.
  org_read_only:
    status: 409
    description: 'The org is read-only after a lapsed payment: reads work, writes do not.'
  org_inactive:
    status: 409
    description: The org is not live (pending, unprovisioned or suspended).
  idempotency_conflict:
    status: 409
    description: This `Idempotency-Key` was already used on this route with a different request (method,
      path or body).
  room_encrypted:
    status: 409
    description: '`POST /messages` targeted a room or group. Rooms are end-to-end encrypted; post with
      an enrolled agent instead.'
  invite_used:
    status: 409
    description: The invitation or enrollment code was already accepted, redeemed or revoked, so it cannot
      be resent or revoked again.
  webhook_limit:
    status: 409
    description: The org already has 10 webhooks.
  too_many_rules:
    status: 409
    description: The org already has as many rules as it may.
  payload_too_large:
    status: 413
    description: The message body is over 64 KB.
  rate_limited:
    status: 429
    description: Over the key's rate limit (600 requests a minute, of which 60 writes). Wait for `Retry-After`
      seconds.
  store_error:
    status: 500
    description: The server could not complete the request. Safe to retry with the same `Idempotency-Key`.
