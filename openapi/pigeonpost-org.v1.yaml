        known:
          type: boolean
        decided_by:
          type: string
          enum: [personal_block, personal_contact, org_rule, inbox_policy]
        autonomy:
          type: [string, 'null']
          enum: [review, auto, null]
        verbs:
          type: [array, 'null']
          items:
            type: string
        verb_auto:
          type: [boolean, 'null']
