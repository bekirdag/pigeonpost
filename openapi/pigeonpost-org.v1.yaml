    post:
      tags: [Members]
      operationId: inviteMember
      summary: Invite a member
      description: |
        Invites one **ordinary** member (no roles; role grants stay on the dashboard). The invitation link in the response is single-use and returned only here (`Cache-Control: no-store`); with `delivery: copy_link` deliver it yourself. Seats, verified domains and handle rules apply as in the dashboard.

        Scope: `members:write`.

        Errors: `invalid_handle` (400), `invalid_contact` (400), `bad_request` (400), `unauthorized` (401), `ip_not_allowed` (403), `insufficient_scope` (403), `forbidden` (403), `feature_disabled` (404), `seat_limit` (409), `handle_taken` (409), `already_invited` (409), `domain_not_verified` (409), `org_inactive` (409), `org_read_only` (409), `idempotency_conflict` (409), `rate_limited` (429), `store_error` (500).
      x-required-scope: members:write
      x-error-codes:
        - invalid_handle
        - invalid_contact
        - bad_request
        - unauthorized
        - ip_not_allowed
        - insufficient_scope
        - forbidden
        - feature_disabled
        - seat_limit
        - handle_taken
        - already_invited
        - domain_not_verified
        - org_inactive
        - org_read_only
        - idempotency_conflict
        - rate_limited
        - store_error
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
            example:
              first_name: Jane
              last_name: Doe
              contact: jane.doe@example.com
              handle: jane
      responses:
        '201':
          description: Created.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MemberWithInvitation'
                additionalProperties: false
              example:
                data:
                  member:
                    id: mem_qh4pnxpiqns7heuhs3whvjj7ok
                    handle: /acme/jane
                    address: null
                    first_name: Jane
                    last_name: Doe
                    status: invited
                    roles: []
                    contact_masked: j***@example.com
                    invited_at: '2026-10-27T10:15:00Z'
                    joined_at: null
                    last_active_at: null
                  invitation:
                    id: inv_s3mwglzwgvsmymbskikattzcvb
                    link: https://enterprise.pigeonpost.dev/invite#EXAMPLE-invitation-token
                    expires_at: '2026-11-03T10:15:00Z'
                    delivery: queued
        '400':
          description: '`invalid_handle`, `invalid_contact`, `bad_request`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_handle
                  message: 'A handle is not valid for this org: wrong namespace, bad characters, reserved,
                    or too long.'
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#invalid_handle
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`ip_not_allowed`, `insufficient_scope`, `forbidden`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ip_not_allowed
                  message: The request came from an address outside the key's IP allowlist.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#ip_not_allowed
        '404':
          description: '`feature_disabled`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: feature_disabled
                  message: The Enterprise API is not enabled for this org (`org_api` feature flag).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#feature_disabled
        '409':
          description: '`seat_limit`, `handle_taken`, `already_invited`, `domain_not_verified`, `org_inactive`,
            `org_read_only`, `idempotency_conflict`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: seat_limit
                  message: Every seat is in use (owner, active, suspended and invited members all count).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#seat_limit
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /members/{member}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Get a member
      description: |
        One member.

        Scope: `org:read`.

