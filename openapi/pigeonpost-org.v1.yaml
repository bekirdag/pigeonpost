# Pigeonpost Enterprise API (/org/v1). Source of truth for the org API; contract and rationale in
# docs/org-api.md. After editing, regenerate the JSON mirror:
#   python .github/scripts/openapi/export_json.py
openapi: 3.1.0
info:
  title: Pigeonpost Enterprise API
  version: 1.0.0
  summary: Organization administration and integration API (`/org/v1`).
  description: |
    Automation API for one Pigeonpost organization: members, agents, rules, rooms, audit, usage,
    billing status, webhooks and direct messages from one org agent mailbox. It never reads message
    content, ciphertext, attachments or key material.

    Authenticate with an org API key: `Authorization: Bearer pk_org_…`. Keys are created by an owner
    or admin (with step-up) on the dashboard. Each route needs one **scope** (`x-required-scope`), and
    the key works only while its creator still holds the matching authority in the org.

    Conventions:

    * JSON, `application/json; charset=utf-8`, snake_case; timestamps are ISO 8601 UTC.
    * Success is `{"data": …}`; lists are `{"data": […], "next_cursor": "…" | null}` with `limit`
      (1..200, default 50) and an opaque `cursor`.
    * Errors are `{"error": {"code", "message", "doc_url"}}` with stable codes
      (https://developers.pigeonpost.dev/org-api-errors).
    * `Idempotency-Key` on any `POST`, `PATCH` or `DELETE`; replays within 24 h return the recorded
      response with `Idempotent-Replayed: true`.
    * 600 requests a minute per key, of which 60 writes. Every response carries `RateLimit-Limit`,
      `RateLimit-Remaining` and `RateLimit-Reset`; `429 rate_limited` adds `Retry-After`.
    * Breaking changes go to `/org/v2`; v1 stays 12 months after a deprecation notice.

    Contract and rationale: `docs/org-api.md`.
  contact:
    name: Pigeonpost
    url: https://developers.pigeonpost.dev/org-api
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://postbox.pigeonpost.dev/org/v1
security:
  - orgKey: []
tags:
  - name: Key
    description: The calling key itself.
  - name: Organization
    description: 'The org: plan, limits, settings.'
  - name: Members
    description: Invite, rename, suspend, reactivate and remove ordinary members.
  - name: Roles
    description: Role definitions and holders (read only).
  - name: Agents
    description: Org agent mailboxes, their delegations and enrollment codes.
  - name: Rules
    description: Org trust rules. Keys may only add restrictions.
  - name: Rooms
    description: End-to-end-encrypted org rooms (metadata and invitations only).
  - name: Audit
    description: The org audit log, for SIEM streaming.
  - name: Usage and billing
    description: Seats, agents, storage, calls and plan status.
  - name: Webhooks
    description: Signed event deliveries to your HTTPS endpoint.
  - name: Messages
    description: Direct messages from the key's agent mailbox to org mailboxes.
paths:
  /key:
    get:
      tags: [Key]
      operationId: getKey
      summary: Describe this key
      description: |
        The calling key: id, name, org, scopes, expiry, IP allowlist and `send_as`. Useful as a credential check.

        Scope: none (any live key).

        Errors: `unauthorized` (401), `ip_not_allowed` (403), `feature_disabled` (404), `org_inactive` (409), `rate_limited` (429), `store_error` (500).
      x-error-codes: [unauthorized, ip_not_allowed, feature_disabled, org_inactive, rate_limited, store_error]
      responses:
        '200':
          description: Success.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Key'
                additionalProperties: false
              example:
                data:
                  id: okey_eglu7kwqtraqqt7h5a3mbd7dtu
                  name: HR onboarding
                  org_id: org_qivthlmhyfekbiqklot42xv4vj
                  scopes: ['org:read', 'members:write', 'messages:send']
                  last4: q7xk
                  send_as: /acme/ci-bot
                  ip_allowlist: [203.0.113.0/24]
                  created_at: '2026-10-20T09:00:00Z'
                  expires_at: '2027-10-20T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`ip_not_allowed`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ip_not_allowed
                  message: The request came from an address outside the key's IP allowlist.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#ip_not_allowed
        '404':
          description: '`feature_disabled`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: feature_disabled
                  message: The Enterprise API is not enabled for this org (`org_api` feature flag).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#feature_disabled
        '409':
          description: '`org_inactive`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: org_inactive
                  message: The org is not live (pending, unprovisioned or suspended).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#org_inactive
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Key]
      operationId: revokeKey
      summary: Revoke this key
      description: |
        Revokes the calling key at once. Later requests with it get `401 unauthorized`. Use it when a key may have leaked.

        Scope: none (any live key).

        Errors: `unauthorized` (401), `ip_not_allowed` (403), `feature_disabled` (404), `org_inactive` (409), `idempotency_conflict` (409), `rate_limited` (429), `store_error` (500).
      x-error-codes: [unauthorized, ip_not_allowed, feature_disabled, org_inactive, idempotency_conflict,
        rate_limited, store_error]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Revoked'
                additionalProperties: false
              example:
                data:
                  id: okey_eglu7kwqtraqqt7h5a3mbd7dtu
                  revoked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`ip_not_allowed`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ip_not_allowed
                  message: The request came from an address outside the key's IP allowlist.
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#ip_not_allowed
        '404':
          description: '`feature_disabled`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: feature_disabled
                  message: The Enterprise API is not enabled for this org (`org_api` feature flag).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#feature_disabled
        '409':
          description: '`org_inactive`, `idempotency_conflict`'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: org_inactive
                  message: The org is not live (pending, unprovisioned or suspended).
                  doc_url: https://developers.pigeonpost.dev/org-api-errors#org_inactive
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /org:
