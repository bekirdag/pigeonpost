        handle:
          type: string
          description: '`/acme/ci-bot` or `ci-bot`.'
        label:
          type: string
          maxLength: 100
      additionalProperties: false
    Delegation:
      type: object
      required: [id, member_id, member_handle, capabilities, expires_at, granted_at]
      properties:
        id:
          type: string
          description: '`dlg_…`.'
        member_id:
          type: string
        member_handle:
          type: [string, 'null']
        capabilities:
          type: array
          items:
            type: string
            enum: [enroll, bind_handle, configure_rules, read_inbox, ssh]
        expires_at:
          type: [string, 'null']
          format: date-time
        granted_at:
          type: string
          format: date-time
      additionalProperties: false
    Enrollment:
      type: object
      required: [id, created_at, expires_at, redeemed_at, revoked_at, created_by]
      properties:
        id:
          type: string
          description: The enrollment's id. Never the code itself.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        redeemed_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: [string, 'null']
          description: Handle of the person who issued it.
      additionalProperties: false
    Revoked:
      type: object
      required: [id, revoked]
      properties:
        id:
          type: string
          description: The id of what was revoked.
