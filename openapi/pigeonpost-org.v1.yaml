      properties:
        id:
          type: string
          description: '`grp_…`.'
        name:
          type: string
        description:
          type: [string, 'null']
        join_policy:
          type: string
          enum: [private, public]
        post_policy:
          type: string
          enum: [everyone, admins]
        listed:
          type: boolean
          description: Shown in the org directory.
        auto_join:
          type: boolean
          description: New members are added automatically.
        activation_state:
          type: string
          enum: [provisioning, active]
