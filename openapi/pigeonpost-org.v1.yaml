      properties:
        owners:
          type: string
        peers:
          type: string
        admission:
          type: [string, 'null']
          enum: [block, null]
          description: Only `block` or null through the API.
        autonomy:
          type: [string, 'null']
          enum: [review, null]
          description: Only `review` or null through the API.
        verbs:
          type: 'null'
          description: Must be absent or null through the API.
        known:
          type: boolean
          const: false
        locked:
          type: boolean
          const: false
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description:
          type: string
          maxLength: 200
      additionalProperties: false
    RulePatch:
      type: object
      description: Partial update of a rule an API key created; the result must stay restrictive.
      required: []
      properties:
        owners:
          type: string
        peers:
          type: string
        admission:
          type: [string, 'null']
          enum: [block, null]
        autonomy:
          type: [string, 'null']
          enum: [review, null]
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        description:
          type: [string, 'null']
          maxLength: 200
      additionalProperties: false
    EvaluateRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Sender handle or address.
        to:
          type: string
          description: Recipient org handle or address.
        verb:
          type: string
          description: Optional request verb, e.g. `git_push`.
