  /internal/v1/call-admission:
    post:
      tags: [internal]
      x-internal: true
      operationId: internalCallAdmission
      summary: Ring decision for one call (calls service)
      description: |
        Blocks, the callee's filtering settings, caller reputation and a per-pair attempt limit,
        combined `block > silence > ring`. `reason` is for the calls service's logs only; the caller
        always experiences an ordinary unanswered call.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, kind]
              properties:
                from:
                  type: object
                  required: [mailbox]
                  properties:
                    mailbox:
                      type: string
                    handle:
                      type: string
                to:
                  type: string
                kind:
                  type: string
                  enum: [audio, video]
                group_id:
                  type: string
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                required: [decision, targets, reason]
                properties:
                  decision:
                    type: string
                    enum: [ring, silence, block]
                  targets:
                    type: array
                    items:
                      type: string
                  reason:
                    type: string
        '400':
          description: '`bad_request`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/InvalidServiceToken'
        '403':
          $ref: '#/components/responses/EndpointNotAllowed'
  /internal/v1/call-ring:
    post:
      tags: [internal]
      x-internal: true
      operationId: internalCallRing
      summary: Push an incoming call to the callee's devices (Phase 1c, docs/call-alerting.md)
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, kind, ring_token, from, to, expires_at]
              properties:
                room_id:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{10,64}$'
                code:
                  type: string
                  pattern: '^[A-Za-z0-9]{6}$'
                kind:
                  type: string
                  enum: [audio, video]
                ring_token:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
                from:
                  type: object
                  required: [address]
                  properties:
                    address:
                      type: string
                    display:
                      type: string
                      description: Cut to 60 characters; the handle is looked up by the postbox.
                to:
                  type: string
                  description: The handle or address that was called.
                expires_at:
                  type: integer
                  description: Unix seconds when the ring ends (capped at now + 120).
      responses:
        '200':
          description: What was decided and how many devices are being woken.
          content:
            application/json:
              schema:
                type: object
                required: [decision, devices]
                properties:
                  decision:
                    type: string
                    enum: [ring, silence, block, disabled, unknown, expired]
                  devices:
                    type: integer
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/InvalidServiceToken'
        '403':
          $ref: '#/components/responses/EndpointNotAllowed'
