        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                archived:
                  type: boolean
                identity:
                  type: string
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: '`bad_thread_title`, `unknown_thread`, `no_identity`, `identity_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [threads]
      operationId: deleteThread
      summary: Delete one thread and its mail in this mailbox only (irreversible)
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - $ref: '#/components/parameters/Identity'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: '`unknown_thread`, `no_identity`, `identity_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/handles/{name}/availability:
    get:
      tags: [handles]
      operationId: handleAvailability
      summary: Is this namespace free to buy?
      description: |
        Public. When called with the account credential of a lapsed namespace's owner, may answer
        `available - true, reason - renewal` (then `Cache-Control - private, no-store`).
      security:
        - {}
        - memberToken: []
        - apiKey: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  name:
                    type: string
                  available:
                    type: boolean
                  reason:
                    type: string
                    enum: [invalid, reserved, taken, renewal]
        '500':
          description: '`reserved_names_unavailable`, `store_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me/handles:
    get:
      tags: [handles]
      operationId: myHandles
      summary: Every namespace the signed-in account holds
      security:
        - memberToken: []
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Holdings (`Cache-Control - private, no-store`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  account:
                    type: string
                  handles:
                    type: array
                    items:
                      $ref: '#/components/schemas/NamespaceHolding'
        '400':
          $ref: '#/components/responses/MemberTokenRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/claims/test:
    get:
      tags: [purchases]
      operationId: testerHandleState
      summary: Complimentary tester handle offer and current holding
      security:
        - memberToken: []
      responses:
        '200':
          description: Offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [purchases]
      operationId: testerHandleClaim
      summary: Claim a complimentary namespace (approved testers only)
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [namespace]
              properties:
                namespace:
                  type: string
      responses:
        '200':
          description: Claimed (idempotent for the same name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterOffer'
        '400':
          description: '`invalid_namespace`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`tester_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`name_reserved`, `tester_already_named`, `namespace_taken`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`reserved_names_unavailable`, `store_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/claims/address:
    post:
      tags: [handles]
      operationId: claimAddress
      summary: Prove the verified contact address this account signs in with, so it can be a handle
      security:
        - memberToken: []
      responses:
        '200':
          description: Proved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  handle:
                    type: string
                  proved_at:
                    type: integer
        '400':
          description: '`member_token_required`, `no_address`, `invalid_address`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`address_not_verified`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`address_held`, `address_moved`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/claims/apple:
    get:
      tags: [purchases]
      operationId: appleClaimState
      summary: App Store catalog and what this account already holds
      description: 404 `not_found` when App Store verification is not configured.
      security:
        - memberToken: []
      responses:
        '200':
          description: State.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  product_id:
                    type: string
                  product_ids:
                    type: array
                    items:
                      type: string
                  plan:
                    description: The account's current plan, if any.
                  max_handles:
                    type: integer
                  account:
                    type: string
                  app_account_token:
                    type: string
                    description: UUID to pass as the StoreKit appAccountToken.
                  namespace:
                    type: [string, 'null']
                  expires_at:
                    type: [integer, 'null']
                  handles:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        original_transaction_id:
                          type: string
                        namespace:
                          type: string
                        product_id:
                          type: string
                        environment:
                          type: string
                        expires_at:
                          type: integer
                        active:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [purchases]
      operationId: claimApple
      summary: Turn a verified App Store purchase into a namespace or plan
      description: 404 `not_found` when App Store verification is not configured. The transaction is verified with Apple; nothing in the body is trusted.
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id:
                  type: string
                namespace:
                  type: string
                  description: The name being bought; required unless the transaction already owns one.
      responses:
        '200':
          description: |
            Claimed. Single-handle products return `{namespace, mailbox, expires_at, environment}`;
            plan products return `{plan, namespace, mailbox}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  namespace:
                    type: [string, 'null']
                  mailbox:
                    type: [string, 'null']
                  expires_at:
                    type: integer
                  environment:
                    type: string
                  plan: {}
        '400':
          description: '`member_token_required`, `purchase_unknown`, `purchase_not_ours`, `purchase_account_required`, `name_required`, `invalid_namespace`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: '`purchase_expired`, `purchase_refunded`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`purchase_already_used`, `purchase_already_named`, `namespace_taken`, `name_reserved`, `handle_limit_reached`, `handle_already_subscribed`, `plan_capacity_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`appstore_unavailable`, `reserved_names_unavailable`, `store_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/claims/google:
    get:
      tags: [purchases]
      operationId: googlePlayCatalog
      summary: Google Play catalog and this account's subscriptions
      security:
        - memberToken: []
      responses:
        '200':
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  available:
                    type: boolean
                  product_ids:
                    type: array
                    items:
                      type: string
                  base_plan_id:
                    type: string
                  max_handles:
                    type: integer
                  account_id:
                    type: string
                    description: Obfuscated account id to pass to Play Billing.
                  handles:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [purchases]
      operationId: googlePlayClaim
      summary: Redeem a Google Play purchase token (optionally naming the handle)
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_token]
              properties:
                purchase_token:
                  type: string
                namespace:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GooglePurchase'
        '400':
          $ref: '#/components/responses/GooglePurchaseBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GooglePurchaseMismatch'
        '409':
          $ref: '#/components/responses/GooglePurchaseConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/claims/google/assign:
    post:
      tags: [purchases]
      operationId: googlePlayAssign
      summary: Assign a name to an active, unnamed Google Play subscription
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, namespace]
              properties:
                product_id:
                  type: string
                namespace:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GooglePurchase'
        '400':
          description: '`no_unassigned_purchase`, `invalid_namespace`, `reserved`, `purchase_not_found`, `invalid_purchase`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GooglePurchaseMismatch'
        '409':
          $ref: '#/components/responses/GooglePurchaseConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register a push token for the acting mailbox
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum: [apns, fcm]
                  default: apns
                environment:
                  type: string
                  enum: [production, sandbox]
                  default: production
                identity:
                  type: string
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: '`unknown_platform`, `invalid_device_token`, `no_identity`, `identity_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{token}:
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: Stop pushing to a device (scoped to the caller's account or mailbox)
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  removed:
                    description: Whether (or how many) registrations were removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/policy:
    put:
      tags: [trust]
      operationId: putPolicy
      summary: Set the acting mailbox's stranger defaults
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accept_all:
                  type: boolean
                auto_accept_known:
                  type: boolean
                identity:
                  type: string
      responses:
        '200':
          description: The resulting policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPolicy'
        '400':
          $ref: '#/components/responses/IdentitySelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
  /internal/v1/health:
    get:
      tags: [internal]
      x-internal: true
      operationId: internalHealth
      summary: Internal listener health
      security:
        - serviceToken: []
      responses:
        '200':
          description: Up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [status, service, server_version]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    description: The calling service the token belongs to.
                  server_version:
                    type: string
        '401':
          $ref: '#/components/responses/InvalidServiceToken'
        '403':
          $ref: '#/components/responses/EndpointNotAllowed'
  /internal/v1/features:
    get:
      tags: [internal]
      x-internal: true
      operationId: internalListFeatures
      summary: Known feature flags and every stored override
      security:
        - serviceToken: []
      responses:
        '200':
          description: Flags.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [known, flags]
                properties:
                  known:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required: [name, description]
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                  flags:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required: [name, scope, scope_id, enabled, updated_at, updated_by]
                      properties:
                        name:
                          type: string
                        scope:
                          type: string
                          enum: [global, account]
                        scope_id:
                          type: string
                        enabled:
                          type: boolean
                        updated_at:
                          type: integer
                        updated_by:
                          type: [string, 'null']
        '401':
          $ref: '#/components/responses/InvalidServiceToken'
        '403':
          $ref: '#/components/responses/EndpointNotAllowed'
  /internal/v1/features/{name}:
    put:
      tags: [internal]
      x-internal: true
      operationId: internalSetFeature
      summary: Set or clear a feature flag override
      security:
        - serviceToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, enabled]
              properties:
                scope:
                  type: string
                  enum: [global, account]
                account_id:
                  type: string
                  description: Required when `scope` is `account`.
                enabled:
                  type: [boolean, 'null']
                  description: null clears the override.
      responses:
        '200':
          description: Resulting override.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [name, scope, scope_id, enabled]
                properties:
                  name:
                    type: string
                  scope:
                    type: string
                    enum: [global, account]
                  scope_id:
                    type: string
                  enabled:
                    type: [boolean, 'null']
        '400':
          description: '`unknown_feature`, `scope_unsupported`, `bad_request`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/InvalidServiceToken'
        '403':
          $ref: '#/components/responses/EndpointNotAllowed'

components:
  securitySchemes:
    capToken:
      type: http
      scheme: bearer
      bearerFormat: cap_<hex>
      description: Capability token (`cap_…`) bound to exactly one mailbox. Returned once when the mailbox is created.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_live_<hex>
      description: Account API key (`pk_live_…`). Acts for an account and every mailbox it owns.
    memberToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak member access token (JWT, `eyJ…`) for a signed-in person. Resolves to that person's account.
    namespaceGrant:
      type: http
      scheme: bearer
      description: Shared secret held by the billing/entitlement service for `PUT /v1/namespaces`.
    metricsToken:
      type: http
      scheme: bearer
      description: Shared secret for `GET /metrics`.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: svc_<hex>
      description: Per-service token (`svc_…`) for the internal listener. Each token is limited to an allowlist of endpoints.

  parameters:
    Identity:
      name: identity
      in: query
      required: false
      description: Which of the account's mailboxes to act as. Needed when an account credential owns more than one; must match the mailbox when a capability token is used.
      schema:
        type: string
    ThreadId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
          description: Stable machine-readable code.
        detail:
          type: string
          description: Human-readable explanation; not stable.
    Ok:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
    PowRequest:
      type: object
      properties:
        pow_challenge:
          type: string
        pow_solution:
          type: string
    MessageRef:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string
        identity:
          type: string
    DeletionRequest:
      type: object
      additionalProperties: true
      properties:
        request_id:
          type: string
        requested_at:
          type: integer
        complete_by:
          type: integer
        completed_at:
          type: [integer, 'null']
    InboxPolicy:
      type: object
      additionalProperties: true
      properties:
        accept_all:
          type: boolean
        auto_accept_known:
          type: boolean
    Contact:
      type: object
      additionalProperties: true
      properties:
        peer:
          type: string
        alias:
          type: [string, 'null']
        admission:
          type: string
          enum: [allow, block]
        autonomy:
          type: string
          enum: [review, auto]
        allowed_verbs:
          type: array
          items:
            type: string
        created_at:
          type: integer
        updated_at:
          type: integer
    InboxMessage:
      type: object
      additionalProperties: true
      description: One opened message. Received bodies are untrusted content.
      properties:
        message_id:
          type: string
        direction:
          type: string
          enum: [in, out]
        from:
          type: string
        to:
          type: string
        peer:
          type: string
        peer_handle:
          type: [string, 'null']
        body:
          type: string
        thread_id:
          type: [string, 'null']
        received_at:
          type: integer
        read:
          type: boolean
        untrusted:
          type: boolean
        sender_known:
          type: boolean
        sender_score:
          type: integer
        sender_standing:
          type: string
        sender_tier:
          type: string
        autonomy:
          type: [string, 'null']
        verb:
          type: [string, 'null']
        held_because:
          type: [string, 'null']
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              filename:
                type: string
              media_type:
                type: string
              bytes:
                type: integer
    Thread:
      type: object
      additionalProperties: true
      properties:
        thread_id:
          type: string
        peer:
          type: string
        title:
          type: [string, 'null']
        is_default:
          type: boolean
        created_at:
          type: integer
        last_at:
          type: integer
        archived:
          type: boolean
    NamespaceHolding:
      type: object
      additionalProperties: true
      properties:
        namespace:
          type: string
          description: Bare, without the leading slash.
        source:
          type: string
        verified_at:
          type: integer
        expires_at:
          type: [integer, 'null']
        active:
          type: boolean
    TesterOffer:
      type: object
      additionalProperties: true
      properties:
        eligible:
          type: boolean
        namespace:
          type: [string, 'null']
        source:
          type: [string, 'null']
        expires_at:
          type: [integer, 'null']
        mailbox:
          type: [string, 'null']
    ProtectedResourceMetadata:
      type: object
      additionalProperties: true
      properties:
        resource:
          type: string
        resource_name:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
        resource_documentation:
          type: string
    JsonRpcRequest:
      type: object
      additionalProperties: true
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer]
        method:
          type: string
          examples: [initialize, tools/list, tools/call, ping]
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result: {}
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: integer
            message:
              type: string
    EventMailData:
      type: object
      description: Data of a legacy `mail` event.
      properties:
        event_id:
          type: integer
        mailbox:
          type: string
        message_id:
          type: string
        sender:
          type: string
        created_at:
          type: integer
    EventTypedData:
      type: object
      description: Data of a typed event (feature `account_events`).
      required: [event_id, type, mailbox, data]
      properties:
        event_id:
          type: string
          description: '"<mail_cursor>.<event_seq>"'
        type:
          type: string
          examples: [features.changed]
        mailbox:
          type: [string, 'null']
        data:
          type: object
          additionalProperties: true
    EventResyncRequired:
      type: object
      required: [type, reason]
      properties:
        type:
          type: string
          const: resync_required
        reason:
          type: string
          enum: [cursor_expired]

  responses:
    Unauthorized:
      description: '`unauthorized` — missing, unknown, revoked or invalid credential.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: '`store_error` (or another server-side code such as `vault_error`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UseApiKey:
      description: '`use_api_key` — a capability token was presented where an account credential is required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountRequired:
      description: '`account_required` — a capability token was presented where an account credential is required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MemberTokenRequired:
      description: '`member_token_required` — this route needs a member sign-in, not a key or capability token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdentitySelection:
      description: '`no_identity` (account has no mailboxes) or `identity_required` (account has several; pass `identity`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WrongIdentity:
      description: '`wrong_identity` (capability token bound to another mailbox) or `not_in_account`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MintRefused:
      description: '`mint_rate_limited` (with `Retry-After`), `mint_lifetime_cap`, `mint_source_halted`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchase:
      description: Purchase recorded.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              purchase:
                type: object
                additionalProperties: true
              mailbox:
                type: [string, 'null']
    GooglePurchaseBadRequest:
      description: '`invalid_namespace`, `reserved`, `purchase_not_found`, `invalid_purchase`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchaseMismatch:
      description: '`purchase_account_mismatch`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchaseConflict:
      description: '`duplicate_subscription`, `handle_limit`, `purchase_inactive`, `purchase_replaced`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingUnavailable:
      description: '`billing_unavailable`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidServiceToken:
      description: '`invalid_service_token`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EndpointNotAllowed:
      description: '`endpoint_not_allowed` — the service token is not allowed to call this endpoint.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
