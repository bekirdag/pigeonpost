        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [trust]
      operationId: deleteContact
