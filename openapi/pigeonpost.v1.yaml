components:
  securitySchemes:
    capToken:
      type: http
      scheme: bearer
      bearerFormat: cap_<hex>
      description: Capability token (`cap_…`) bound to exactly one mailbox. Returned once when the mailbox is created.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_live_<hex>
      description: Account API key (`pk_live_…`). Acts for an account and every mailbox it owns.
    memberToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak member access token (JWT, `eyJ…`) for a signed-in person. Resolves to that person's account.
    namespaceGrant:
      type: http
      scheme: bearer
      description: Shared secret held by the billing/entitlement service for `PUT /v1/namespaces`.
    metricsToken:
      type: http
      scheme: bearer
      description: Shared secret for `GET /metrics`.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: svc_<hex>
      description: Per-service token (`svc_…`) for the internal listener. Each token is limited to an allowlist of endpoints.

  parameters:
    Identity:
      name: identity
      in: query
      required: false
      description: Which of the account's mailboxes to act as. Needed when an account credential owns more than one; must match the mailbox when a capability token is used.
      schema:
        type: string
    MlsDevice:
      name: x-pigeonpost-device
      in: header
      required: true
      description: A registered, unrevoked MLS device of the acting mailbox.
      schema:
        type: string
    ThreadId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Entitlement:
      type: object
      description: One provider-bound entitlement (SDS §8.8). `active` means a live status and an unexpired `paid_through` (null only for perpetual grants).
      properties:
        id: {type: string}
        subject_kind: {type: string, enum: [account, org]}
        subject_id: {type: string}
        source: {type: string, enum: [apple, google, iyzico, grant, test]}
        plan_code: {type: string}
        plan_version: {type: string}
        names: {type: [integer, 'null']}
        seats: {type: [integer, 'null']}
        agent_limit: {type: [integer, 'null']}
        storage_bytes: {type: [integer, 'null']}
        status: {type: string, enum: [active, past_due, grace, expired, canceled]}
        period_end: {type: [integer, 'null']}
        paid_through: {type: [integer, 'null']}
        provider_ref: {type: string}
        provider_environment: {type: string}
        cancel_requested_at: {type: [integer, 'null']}
        pending_plan_code: {type: [string, 'null']}
        pending_effective_at: {type: [integer, 'null']}
        updated_at: {type: integer}
        reconciliation_version: {type: integer}
        active: {type: boolean}
    EntitlementResult:
      type: object
      required: [applied, entitlement]
      properties:
        applied: {type: boolean}
        reason: {type: string, enum: [stale, duplicate]}
        entitlement:
          $ref: '#/components/schemas/Entitlement'
        capacity:
          type: [object, 'null']
          properties:
            names: {type: integer}
            used: {type: integer}
    EntitlementWrite:
      type: object
      additionalProperties: false
      required: [subject, plan_code, plan_version, status, reconciliation_version]
      properties:
        subject:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind: {type: string, enum: [account, org]}
            id: {type: string}
        subject_check:
          type: object
          additionalProperties: false
          properties:
            oidc_sub: {type: string}
        plan_code: {type: string, pattern: '^[a-z0-9][a-z0-9.-]{0,63}$'}
        plan_version: {type: string, pattern: '^[A-Za-z0-9._-]{1,32}$'}
        names: {type: [integer, 'null'], minimum: 1, maximum: 10}
        seats: {type: [integer, 'null'], minimum: 1}
        agent_limit: {type: [integer, 'null']}
        storage_bytes: {type: [integer, 'null'], minimum: 0}
        status: {type: string, enum: [active, past_due, grace, expired, canceled]}
        period_end: {type: [integer, 'null']}
        paid_through: {type: [integer, 'null']}
        cancel_requested_at: {type: [integer, 'null']}
        pending_plan_code: {type: [string, 'null']}
        pending_effective_at: {type: [integer, 'null']}
        reconciliation_version: {type: integer, minimum: 1}
        operation_id: {type: string}
    CloudPlanWrite:
      type: object
      additionalProperties: false
      required: [names, reconciliation_version]
      properties:
        names: {type: integer, minimum: 0, maximum: 10}
        paid_through: {type: [integer, 'null'], description: null = no expiry}
        reconciliation_version: {type: integer, minimum: 1}
        note: {type: string, maxLength: 200}
    OrgEntitlementWrite:
      type: object
      additionalProperties: false
      required: [provider, environment, reference, plan_code, plan_version, seats, status, reconciliation_version]
      properties:
        provider: {type: string, enum: [iyzico, grant, test]}
        environment: {type: string, enum: [live, test, sandbox]}
        reference: {type: string}
        plan_code: {type: string}
        plan_version: {type: string}
        seats: {type: integer, minimum: 1}
        agent_limit: {type: [integer, 'null']}
        storage_bytes: {type: [integer, 'null']}
        status: {type: string, enum: [active, past_due, grace, expired, canceled]}
        period_end: {type: [integer, 'null']}
        paid_through: {type: [integer, 'null']}
        cancel_requested_at: {type: [integer, 'null']}
        pending_plan_code: {type: [string, 'null']}
        pending_effective_at: {type: [integer, 'null']}
        reconciliation_version: {type: integer, minimum: 1}
    OrgActivateWrite:
      type: object
      additionalProperties: false
      required: [operation_id, entitlement]
      properties:
        operation_id: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
        entitlement:
          $ref: '#/components/schemas/OrgEntitlementWrite'
    OrgDraftWrite:
      type: object
      additionalProperties: false
      required: [operation_id, owner_account, name, namespace, plan_code, seats]
      properties:
        operation_id: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
        owner_account: {type: string}
        name: {type: string, maxLength: 120}
        namespace: {type: string}
        plan_code: {type: string, pattern: '^ent-[1-9][0-9]*-(monthly|yearly)-(usd|try|eur)$'}
        seats: {type: integer, minimum: 1}
    Org:
      type: object
      properties:
        id: {type: string}
        namespace: {type: string}
        name: {type: string}
        owner_account: {type: string}
        status: {type: string, enum: [pending, active, past_due, read_only, suspended, deleted, paid_unprovisioned]}
        seats: {type: integer}
        agent_limit: {type: integer}
        storage_bytes: {type: integer}
        plan_code: {type: [string, 'null']}
        billing_ref: {type: [string, 'null']}
        period_end: {type: [integer, 'null']}
        created_at: {type: integer}
    OrgApiKey:
      type: object
      description: An org API key as the dashboard shows it (docs/org-api.md §1). Never the secret. Timestamps are Unix seconds.
      properties:
        id: {type: string, description: '`okey_…`'}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        last4: {type: string}
        send_as: {type: [string, 'null']}
        ip_allowlist: {type: array, items: {type: string}}
        created_at: {type: integer}
        created_by: {type: [string, 'null'], description: Member handle of the creator.}
        expires_at: {type: [integer, 'null']}
        last_used_at: {type: [integer, 'null']}
        revoked_at: {type: [integer, 'null']}
    OrgWebhook:
      type: object
      description: An org webhook (docs/org-api.md §3). Timestamps are Unix seconds.
      properties:
        id: {type: string, description: '`wh_…`'}
        url: {type: string}
        events: {type: array, items: {type: string}}
        description: {type: [string, 'null']}
        status: {type: string, enum: [active]}
        created_at: {type: integer}
        created_by: {type: [string, 'null']}
        rotated_at: {type: [integer, 'null']}
        previous_secret_expires_at: {type: [integer, 'null']}
        last_delivery:
          oneOf:
            - type: object
              properties:
                at: {type: integer}
                status: {type: string, enum: [delivered, failed, retrying, blocked]}
                response_status: {type: [integer, 'null']}
            - type: 'null'
    OrgWebhookDelivery:
      type: object
      description: One webhook delivery attempt. `at` is Unix seconds.
      properties:
        id: {type: string, description: '`whd_…`'}
        event_id: {type: string}
        event_type: {type: string}
        attempt: {type: integer}
        status: {type: string, enum: [delivered, failed, retrying, blocked]}
        response_status: {type: [integer, 'null']}
        error: {type: [string, 'null']}
        duration_ms: {type: [integer, 'null']}
        at: {type: integer}
    Error:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
          description: Stable machine-readable code.
        detail:
          type: string
          description: Human-readable explanation; not stable.
    Ok:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
    PowRequest:
      type: object
      properties:
        pow_challenge:
          type: string
        pow_solution:
          type: string
    MessageRef:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string
        identity:
          type: string
        with_edits:
          type: boolean
          description: '`/v1/ack` only: also acknowledge the edits of this original.'
    DeletionRequest:
      type: object
      additionalProperties: true
      properties:
        request_id:
          type: string
        requested_at:
          type: integer
        complete_by:
          type: integer
        completed_at:
          type: [integer, 'null']
    InboxPolicy:
      type: object
      additionalProperties: true
      properties:
        read_receipts:
          type: boolean
          description: Send (and see) read receipts. Default true.
        accept_all:
          type: boolean
        auto_accept_known:
          type: boolean
        unknown_calls:
          type: string
          enum: [ring, silence, block]
          description: Calls from people you don't know. Default ring.
        unnamed_calls:
          type: string
          enum: [ring, silence, block]
          description: Calls from addresses without a name. Default silence.
        unnamed_messages:
          type: string
          enum: [show, filter, block]
          description: Messages from addresses without a name. Default show.
        unknown_messages:
          type: string
          enum: [show, filter, block]
          description: Messages from people you don't know. Default show.
        low_reputation:
          type: string
          enum: [filter, allow]
          description: Senders and callers with a negative score. Default filter.
        group_members_known:
          type: boolean
        call_history_days:
          type: integer
          enum: [0, 30, 180, 365]
          description: Keep call history; 0 is off. Default 180.
    CallLogEntry:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        owner:
          type: string
        room_id:
          type: string
        direction:
          type: string
          enum: [outgoing, incoming]
        outcome:
          type: [string, 'null']
          enum: [answered, missed, declined, cancelled, busy, filtered, failed, null]
          description: null while the call is in progress.
        kind:
          type: string
          enum: [audio, video]
        peer:
          type: [string, 'null']
        peer_handle:
          type: [string, 'null']
        participants:
          type: array
          items:
            type: string
        group_id:
          type: [string, 'null']
        started_at:
          type: integer
        answered_at:
          type: [integer, 'null']
        ended_at:
          type: [integer, 'null']
        duration:
          type: [integer, 'null']
        seen:
          type: boolean
    AvatarUrls:
      type: object
      properties:
        '64':
          type: string
        '128':
          type: string
        '256':
          type: string
        '512':
          type: string
        jpeg:
          type: string
    PublicAvatar:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        version:
          type: integer
        hash:
          type: string
        urls:
          $ref: '#/components/schemas/AvatarUrls'
    OwnAvatar:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        version:
          type: integer
        visibility:
          type: string
          enum: [everyone, known, nobody]
        hash:
          type: string
        urls:
          $ref: '#/components/schemas/AvatarUrls'
        created_at:
          type: integer
    Contact:
      type: object
      additionalProperties: true
      properties:
        peer:
          type: string
        alias:
          type: [string, 'null']
        admission:
          type: string
          enum: [allow, block]
        autonomy:
          type: string
          enum: [review, auto]
        allowed_verbs:
          type: array
          items:
            type: string
        created_at:
          type: integer
        updated_at:
          type: integer
    InboxMessage:
      type: object
      additionalProperties: true
      description: One opened message. Received bodies are untrusted content.
      properties:
        msg_ref:
          type: string
          description: Reference shared by both copies (docs/message-actions.md).
        reply_to:
          type: [object, 'null']
          description: '`{msg_ref, message_id, from, direction, excerpt, quote, verb, args}`'
        edit_of:
          type: [string, 'null']
          description: The `msg_ref` this row edits.
        edit_of_message_id:
          type: [string, 'null']
        edited_at:
          type: integer
        edit_count:
          type: integer
        receipt:
          type: object
          description: 'Sent copies, feature `receipts`: `{state: sent|delivered|seen, delivered_at, seen_at}`'
        agent_status:
          type: [object, 'null']
          description: 'Sent copies, feature `agent_status`: `{state: working|done|failed, at}`'
        filtered:
          type: boolean
          description: Filed in Filtered by the recipient's settings.
        message_id:
          type: string
        direction:
          type: string
          enum: [in, out]
        from:
          type: string
        to:
          type: string
        peer:
          type: string
        peer_handle:
          type: [string, 'null']
        body:
          type: string
        thread_id:
          type: [string, 'null']
        received_at:
          type: integer
        read:
          type: boolean
        untrusted:
          type: boolean
        sender_known:
          type: boolean
        sender_score:
          type: integer
        sender_standing:
          type: string
        sender_tier:
          type: string
        autonomy:
          type: [string, 'null']
        verb:
          type: [string, 'null']
        held_because:
          type: [string, 'null']
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              filename:
                type: string
              media_type:
                type: string
              bytes:
                type: integer
    Thread:
      type: object
      additionalProperties: true
      properties:
        thread_id:
          type: string
        peer:
          type: string
        title:
          type: [string, 'null']
        is_default:
          type: boolean
        created_at:
          type: integer
        last_at:
          type: integer
        archived:
          type: boolean
    NamespaceHolding:
      type: object
      additionalProperties: true
      properties:
        namespace:
          type: string
          description: Bare, without the leading slash.
        source:
          type: string
        verified_at:
          type: integer
        expires_at:
          type: [integer, 'null']
        active:
          type: boolean
    TesterOffer:
      type: object
      additionalProperties: true
      properties:
        eligible:
          type: boolean
        namespace:
          type: [string, 'null']
        source:
          type: [string, 'null']
        expires_at:
          type: [integer, 'null']
        mailbox:
          type: [string, 'null']
    ProtectedResourceMetadata:
      type: object
      additionalProperties: true
      properties:
        resource:
          type: string
        resource_name:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
        resource_documentation:
          type: string
    JsonRpcRequest:
      type: object
      additionalProperties: true
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer]
        method:
          type: string
          examples: [initialize, tools/list, tools/call, ping]
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result: {}
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: integer
            message:
              type: string
    EventMailData:
      type: object
      description: Data of a legacy `mail` event.
      properties:
        event_id:
          type: integer
        mailbox:
          type: string
        message_id:
          type: string
        sender:
          type: string
        created_at:
          type: integer
    EventTypedData:
      type: object
      description: Data of a typed event (feature `account_events`).
      required: [event_id, type, mailbox, data]
      properties:
        event_id:
          type: string
          description: '"<mail_cursor>.<event_seq>"'
        type:
          type: string
          examples: [features.changed, call.log, profile.avatar]
        mailbox:
          type: [string, 'null']
        data:
          type: object
          additionalProperties: true
    EventResyncRequired:
      type: object
      required: [type, reason]
      properties:
        type:
          type: string
          const: resync_required
        reason:
          type: string
          enum: [cursor_expired]

  responses:
    CalendarError:
      description: 'A calendar refusal: `{error, message, …}` with codes from docs/calendar.md §0 (`feature_disabled`, `not_found`, `forbidden`, `human_required`, `revision_conflict`, `time_invalid`, `recurrence_invalid`, `expansion_limit`, `attendee_limit`, `invite_limit`, `meeting_capacity`, `guest_token_invalid`, `window_closed`, …).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GroupError:
      description: 'A group refusal: `{error, detail, message}` with codes from docs/groups.md (`not_member`, `not_admin`, `owner_only`, `posting_restricted`, `banned`, `group_full`, `invalid_link`, `invite_required`, `already_member`, `human_required`, `group_deleted`, `revision_conflict`, `epoch_conflict`, `key_activation_pending`, `idempotency_conflict`, `feature_disabled`, …).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized` — missing, unknown, revoked or invalid credential.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: '`store_error` (or another server-side code such as `vault_error`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UseApiKey:
      description: '`use_api_key` — a capability token was presented where an account credential is required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountRequired:
      description: '`account_required` — a capability token was presented where an account credential is required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MemberTokenRequired:
      description: '`member_token_required` — this route needs a member sign-in, not a key or capability token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdentitySelection:
      description: '`no_identity` (account has no mailboxes) or `identity_required` (account has several; pass `identity`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WrongIdentity:
      description: '`wrong_identity` (capability token bound to another mailbox) or `not_in_account`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MintRefused:
      description: '`mint_rate_limited` (with `Retry-After`), `mint_lifetime_cap`, `mint_source_halted`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchase:
      description: Purchase recorded.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              purchase:
                type: object
                additionalProperties: true
              mailbox:
                type: [string, 'null']
    GooglePurchaseBadRequest:
      description: '`invalid_namespace`, `reserved`, `purchase_not_found`, `invalid_purchase`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchaseMismatch:
      description: '`purchase_account_mismatch`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GooglePurchaseConflict:
      description: '`duplicate_subscription`, `handle_limit`, `purchase_inactive`, `purchase_replaced`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingUnavailable:
      description: '`billing_unavailable`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidServiceToken:
      description: '`invalid_service_token`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EndpointNotAllowed:
      description: '`endpoint_not_allowed` — the service token is not allowed to call this endpoint.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
