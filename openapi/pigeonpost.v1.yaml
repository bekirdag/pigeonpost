        '403':
          $ref: '#/components/responses/WrongIdentity'
        '404':
          description: '`feature_disabled` (flag off for this account), `not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [profile]
      operationId: removeAvatar
      summary: Remove the picture (back to initials)
