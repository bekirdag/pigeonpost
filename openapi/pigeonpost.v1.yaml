        '200':
          description: Contacts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  policy:
                    $ref: '#/components/schemas/InboxPolicy'
                  vocabulary:
                    type: object
                    additionalProperties: true
                    properties:
                      grantable:
