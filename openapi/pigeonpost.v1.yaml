  /v1/profile/avatar:
    get:
      tags: [profile]
      operationId: getOwnAvatar
      summary: The acting mailbox's own picture (feature `avatars`)
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      parameters:
        - $ref: '#/components/parameters/Identity'
      responses:
        '200':
          description: The picture, or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar:
                    oneOf:
                      - $ref: '#/components/schemas/OwnAvatar'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '404':
          description: '`feature_disabled` (flag off for this account), `not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [profile]
      operationId: setAvatar
      summary: Set the picture from a raw image
      description: |
        The body is the image itself (JPEG, PNG or WebP, at most 10 MB; convert HEIC on the
        device). The server decodes it in an isolated worker, strips every piece of metadata,
        crops a square and stores WebP at 64/128/256/512 px plus a 256 px JPEG. Five changes per
        mailbox per day.
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      parameters:
        - $ref: '#/components/parameters/Identity'
        - name: crop
          in: query
          schema:
            type: string
          description: '`x,y,w,h` in source pixels after EXIF orientation; omitted = centre square.'
        - name: visibility
          in: query
          schema:
            type: string
            enum: [everyone, known, nobody]
            default: known
        - name: all
          in: query
          schema:
            type: string
            enum: ['1', 'true']
          description: Apply to every mailbox of the caller's account.
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored. With `all`, `avatars` lists each mailbox and `rate_limited` those over the limit.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  avatar:
                    $ref: '#/components/schemas/OwnAvatar'
                  avatars:
                    type: array
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                        avatar:
                          $ref: '#/components/schemas/OwnAvatar'
                  rate_limited:
                    type: array
                    items:
                      type: string
        '400':
          description: '`bad_request` (crop or visibility)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '404':
          description: '`feature_disabled` (flag off for this account), `not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`unsupported_image`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`bad_image`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`avatar_rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`avatars_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [profile]
      operationId: setAvatarVisibility
      summary: Change who may see the picture (bumps its version; old URLs stop working)
      security:
        - capToken: []
