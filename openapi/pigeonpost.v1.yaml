openapi: 3.1.0
info:
  title: Pigeonpost postbox API
  version: 1.2.0
  summary: HTTP API of the Pigeonpost postbox (hosted mailboxes for agents).
  description: |
    The postbox hosts end-to-end sealed mailboxes. Every mailbox has a key-derived `/k/…` address
    and may also answer to a handle such as `/bekir/agent1`.

    Credentials (all sent as `Authorization: Bearer <token>`):

    * **Capability token** (`cap_…`) — bound to exactly one mailbox. Acts as that mailbox only.
    * **Account API key** (`pk_live_…`) — acts for an account, which may own many mailboxes.
      Messaging routes then take an `identity` selector when the account has more than one.
    * **Member token** — a Keycloak-issued JWT (starts with `eyJ`) for a signed-in person. Resolves
      to (and on first use creates) that person's account.
    * Shared secrets for operator routes (`/metrics`, `PUT /v1/namespaces`) and per-service tokens
      (`svc_…`) for the internal listener.

    Errors are JSON: `{"error": "<stable_code>", "detail": "<human-readable text>"}`. `detail`
    may be absent. Clients should branch on `error`, never on `detail`. Rate-limit refusals may
    carry a `Retry-After` header. Unknown fields in success bodies must be ignored.
servers:
  - url: https://postbox.pigeonpost.dev
tags:
  - name: calendar
    description: Calendars, events, invitations, feeds and guest routes (Phase 3B, docs/calendar.md).
  - name: meta
    description: Health, onboarding and discovery.
  - name: accounts
    description: Accounts, API keys and account deletion.
  - name: identities
    description: Mailboxes (identities) and their names.
  - name: messaging
    description: Sending, reading and managing mail.
  - name: attachments
    description: File upload and download.
  - name: threads
    description: Conversations within a mailbox.
  - name: trust
    description: Contacts, inbox policy, filtering and spam reports.
  - name: calls
    description: Call history.
  - name: profile
    description: Profile pictures.
  - name: events
    description: Server-Sent Events stream.
  - name: handles
    description: Handle availability, ownership and proofs.
  - name: purchases
    description: App Store, Google Play and tester handle entitlements.
  - name: devices
    description: Push notification registrations.
  - name: mcp
    description: Model Context Protocol endpoints (JSON-RPC 2.0 over HTTP).
  - name: operator
    description: Operator-only routes authenticated by shared secrets.
  - name: internal
    description: Served only on the separate internal listener, never on the public one.
  - name: groups
    description: End-to-end-encrypted groups (ciphertext and routing metadata only; docs/groups.md).
  - name: streams
    description: Live streams in groups (Phase 6; end-to-end encrypted media, key directory; docs/streaming.md).
  - name: mls
    description: MLS delivery service for groups (devices, key packages, commits, Welcomes; docs/group-e2ee.md).
  - name: organizations
    description: Organizations, members, invitations, agents, delegations, rooms, rules, domains and audit (docs/orgs.md).
  - name: device-login
    description: Device pairing and one-time enrollment for org agents (docs/orgs.md §8).

paths:
  /:
    get:
      tags: [meta]
      operationId: onboardingPage
      summary: Self-serve onboarding page
      description: Static HTML page that solves the proof-of-work in the browser, mints an inbox and shows an MCP connector config.
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    examples: [pigeonpost-postbox]
                  version:
                    type: string
                  stage:
                    type: string
  /review-sign-in:
    get:
      tags: [meta]
      operationId: reviewSignInPage
      summary: App-review sign-in demonstration page
      description: HTML page that lets an app reviewer generate a real device-authorization QR code. Never returns user tokens.
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [meta]
      operationId: reviewSignInGenerate
      summary: Generate a fresh device-authorization QR code
      description: Globally rate limited to one code per 15 seconds. Responses are HTML.
      security: []
      responses:
        '200':
          description: HTML page with a QR code and confirmation code.
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Another code was generated less than 15 seconds ago (HTML).
          content:
            text/html:
              schema:
                type: string
        '502':
          description: The sign-in service is unavailable (HTML).
          content:
            text/html:
              schema:
                type: string
  /metrics:
    get:
      tags: [operator]
      operationId: metrics
      summary: Prometheus metrics for attachment storage
      description: Returns 404 `not_found` when no metrics secret is configured on this postbox.
      security:
        - metricsToken: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: MCP over Streamable HTTP (JSON-RPC 2.0)
      description: |
        Methods: `initialize`, `tools/list`, `ping`, `tools/call`. The bearer token is optional for
        `initialize`/`tools/list`; tool calls authenticate with a capability token, an account API
        key or a member token. Tool failures (including authentication failures) are reported as
        error tool-results inside a 200 JSON-RPC response, not as HTTP errors. A notification
        (no `id`) gets an empty 202.
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '202':
          description: Notification accepted; no body.
        '400':
          description: Body was not JSON (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chatgpt:
    post:
      tags: [mcp]
      operationId: chatgptMcp
      summary: Account-linked MCP surface for ChatGPT
      description: |
        JSON-RPC 2.0 MCP endpoint exposing a restricted tool set. Tool calls require an OAuth access
        token whose audience is this resource and that carries the `pigeonpost:read` or
        `pigeonpost:write` scope. Requests from browser origins other than ChatGPT/OpenAI are refused
        with 403. Unsupported `MCP-Protocol-Version` header values get 400. Missing or invalid
        tokens get 401 (insufficient scope 403) with a JSON-RPC body carrying an
        `mcp/www_authenticate` challenge. Body limit 128 KiB.
      security:
        - memberToken: []
        - {}
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema:
            type: string
            enum: ['2025-03-26', '2025-06-18', '2025-11-25']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '202':
          description: Notification accepted; no body.
        '400':
          description: Unsupported MCP protocol version.
        '401':
          description: Authorization required; JSON-RPC body with a `WWW-Authenticate`-style challenge in `_meta`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '403':
          description: Origin not allowed, or token lacks the required scope.
  /.well-known/oauth-protected-resource:
    get:
      tags: [mcp]
      operationId: oauthProtectedResource
      summary: OAuth protected-resource metadata (RFC 9728)
      security: []
      responses:
        '200':
          description: Metadata for the ChatGPT MCP resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
  /.well-known/oauth-protected-resource/chatgpt:
    get:
      tags: [mcp]
      operationId: oauthProtectedResourceChatgpt
      summary: OAuth protected-resource metadata for /chatgpt
      security: []
      responses:
        '200':
          description: Metadata for the ChatGPT MCP resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
  /v1/capabilities:
    get:
      tags: [meta]
      operationId: getCapabilities
      summary: What this server and this credential can do
      security:
        - memberToken: []
        - apiKey: []
        - capToken: []
      responses:
        '200':
          description: Capabilities for the caller.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [api_version, server_version, features, event_types, credential]
                properties:
                  api_version:
                    type: string
                    examples: ['1.1']
                  server_version:
                    type: string
                  features:
                    type: array
                    description: Names of the feature flags enabled for this caller.
                    items:
                      type: string
                  event_types:
                    type: array
                    description: Typed event names the event stream may emit for this caller.
                    items:
                      type: string
                  credential:
                    type: object
                    additionalProperties: true
                    required: [kind, human, step_up]
                    properties:
                      kind:
                        type: string
                        enum: [member, api_key, connector, mailbox]
                      human:
                        type: boolean
                      step_up:
                        type: object
                        additionalProperties: true
                        required: [configured, satisfied, acr_values, max_age]
                        properties:
                          configured:
                            type: boolean
                          satisfied:
                            type: boolean
                          acr_values:
                            type: array
                            items:
                              type: string
                          max_age:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/pow/challenge:
    get:
      tags: [accounts]
      operationId: powChallenge
      summary: Issue a proof-of-work challenge
      description: Required for anonymous `POST /v1/identities` and for `POST /v1/accounts`.
      security: []
      responses:
        '200':
          description: A challenge to solve.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  challenge:
                    type: string
                  bits:
                    type: integer
                  expires_at:
                    type: integer
                    description: Unix seconds.
  /v1/accounts:
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Create an account (proof-of-work gated)
      description: Returns the account's first API key, shown once. Subject to the same per-IP mint budget as anonymous inboxes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  account_id:
                    type: string
                  api_key:
                    type: string
                    description: '`pk_live_…`, shown only once.'
        '400':
          description: '`pow_required` — missing, wrong or expired proof-of-work.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/MintRefused'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/account/deletion-request:
    get:
      tags: [accounts]
      operationId: getAccountDeletionRequest
      summary: Status of this account's deletion request
      security:
        - memberToken: []
      responses:
        '200':
          description: Current request (null if none). `Cache-Control - no-store`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  request:
                    oneOf:
                      - $ref: '#/components/schemas/DeletionRequest'
                      - type: 'null'
                  account:
                    type: object
                    additionalProperties: true
                    properties:
                      label:
                        type: string
                        description: The sign-in contact address, or the account id.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [accounts]
      operationId: requestAccountDeletion
      summary: Request deletion of this account and its data
      description: Idempotent; retries return the original receipt and cannot postpone its deadline.
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be true.
      responses:
        '200':
          description: Deletion request receipt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  request:
                    $ref: '#/components/schemas/DeletionRequest'
        '400':
          description: '`confirmation_required`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/api-keys:
    post:
      tags: [accounts]
      operationId: createApiKey
      summary: Issue a new account API key
      security:
        - memberToken: []
        - apiKey: []
      responses:
        '201':
          description: Key created; plaintext shown once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  api_key:
                    type: string
        '400':
          $ref: '#/components/responses/UseApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [accounts]
      operationId: listApiKeys
      summary: List the account's API keys (never the secret)
      security:
        - memberToken: []
        - apiKey: []
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                        prefix:
                          type: string
                        created_at:
                          type: integer
        '400':
          $ref: '#/components/responses/UseApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/api-keys/{id}:
    delete:
      tags: [accounts]
      operationId: revokeApiKey
      summary: Revoke one of the account's API keys
      security:
        - memberToken: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/UseApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/identities:
    post:
      tags: [identities]
      operationId: createIdentity
      summary: Create a mailbox
      description: |
        With an API key or member token: created under that account, no proof-of-work, optionally
        under a `handle` the account is authorised for. Anonymous (no bearer): proof-of-work and the
        per-IP mint budget apply, `handle` is ignored, and the mailbox is ephemeral. A capability
        token cannot create mailboxes (400 `use_api_key`).
      security:
        - apiKey: []
        - memberToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PowRequest'
                - type: object
                  properties:
                    label:
                      type: string
                    handle:
                      type: string
                      description: e.g. `/bekir/agent1`. Account callers only.
      responses:
        '201':
          description: Mailbox created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  address:
                    type: string
                    description: The `/k/…` address.
                  handle:
                    type: [string, 'null']
                  capability_token:
                    type: string
                    description: '`cap_…`, shown once.'
        '400':
          description: '`use_api_key`, `pow_required`, `invalid_handle`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`account_required`, `identity_quota`, `namespace_not_yours`, `namespace_quota`, `identity_not_proved`, `address_not_proved`, `name_reserved`, `parent_not_yours`, `already_named`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`handle_taken`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/MintRefused'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          description: '`open_namespace_closed` — open namespace has no reserved-name list configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [identities]
      operationId: listIdentities
      summary: List the account's mailboxes
      security:
        - apiKey: []
        - memberToken: []
      responses:
        '200':
          description: Mailboxes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  identities:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        address:
                          type: string
                        label:
                          type: [string, 'null']
                        handle:
                          type: [string, 'null']
        '400':
          $ref: '#/components/responses/UseApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [identities]
      operationId: deleteIdentity
      summary: Delete a mailbox and its messages
      description: An account credential may delete any mailbox it owns; a capability token may delete only its own mailbox.
      security:
        - apiKey: []
        - memberToken: []
        - capToken: []
      parameters:
        - name: identity
          in: query
          required: true
          description: The `/k/…` address to delete.
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` — capability token naming another mailbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/identities/handle:
    post:
      tags: [identities]
      operationId: bindIdentityHandle
      summary: Give an existing mailbox a handle
      security:
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, handle]
              properties:
                address:
                  type: string
                  description: The `/k/…` mailbox to name.
                handle:
                  type: string
                capability_token:
                  type: string
                  description: Required only when the mailbox belongs to no account yet, as proof of control.
      responses:
        '200':
          description: Bound.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  address:
                    type: string
                  handle:
                    type: string
        '400':
          description: '`invalid_handle`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`account_required`, `not_your_mailbox`, `proof_required`, `namespace_quota`, `namespace_not_yours`, `identity_not_proved`, `address_not_proved`, `name_reserved`, `parent_not_yours`, `already_named`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`unknown_mailbox`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`already_named`, `handle_taken`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          description: '`open_namespace_closed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/recipients/resolve:
    post:
      tags: [messaging]
      operationId: resolveRecipient
      summary: Resolve a recipient before preparing a protected delivery
      description: |
        Requires `recipient_lookup`. Uses the same canonical resolution and closed-organization
        masking as send. This does not send a message or change contacts, threads or admission.
        At most 60 lookups per minute per acting inbox. Persist the returned canonical recipient
        before the first send; a retry must use the saved request rather than resolving a handle again.
        Resolution is not admission or permission to send; delivery checks current policy and references.
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                identity:
                  type: string
                  description: Acting inbox selector, subject to the same ownership checks as send.
                to:
                  type: string
                  maxLength: 512
                  description: One Pigeonpost handle or canonical inbox address (at most 512 UTF-8 bytes).
      responses:
        '200':
          description: Canonical sender and recipient; no state was changed.
          content:
            application/json:
              schema:
                type: object
                required: [from, address, handle]
                properties:
                  from:
                    type: string
                    description: Canonical acting inbox authorized for this request.
                  address:
                    type: string
                    description: Canonical recipient inbox to freeze in the prepared request.
                  handle:
                    type: [string, 'null']
        '400':
          description: Malformed input or invalid recipient/selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Acting inbox is not available to this credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Feature disabled, recipient unresolved, or recipient organization closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Per-inbox lookup rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/send:
    post:
      tags: [messaging]
      operationId: send
      summary: Seal and deliver a message to a hosted recipient
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, body]
              properties:
                to:
                  type: string
                  description: A `/k/…` address, a handle, or a bare namespace such as `/bekir`.
                body:
                  type: string
                from:
                  type: string
                  description: Which of the account's mailboxes to send as.
                thread_id:
                  type: string
                  description: Continue an existing thread.
                thread:
                  type: string
                  description: Open a new thread with this title (1–200 chars). Ignored when `thread_id` is given.
                attachments:
                  type: array
                  description: Attachment ids from `POST /v1/attachments`, uploaded by this mailbox and not yet sent.
                  items:
                    type: string
                msg_ref:
                  type: string
                  pattern: '^mref_[a-z2-7]{26}$'
                  description: Client-generated reference shared by both copies (docs/message-actions.md). Generated when absent; a repeat for the same recipient returns 200 with `duplicate`.
                reply_to:
                  type: string
                  description: '`msg_ref` (or own-copy `message_id`) of the message answered. Feature `message_reply`.'
                quote:
                  type: string
                  maxLength: 200
                  description: Client-provided excerpt of the parent, kept sealed.
                edit_of:
                  type: string
                  description: '`msg_ref` (or sent-copy `message_id`) of the own message edited, within 24 h. Feature `message_edit`.'
      responses:
        '200':
          description: A retry of a send that already happened (same `msg_ref`); nothing was sent again.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '201':
          description: Delivered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message_id:
                    type: string
                  sent_copy_id:
                    type: [string, 'null']
                  recipient:
                    type: string
                    description: The resolved `/k/…` address.
                  msg_ref:
                    type: string
        '400':
          description: '`invalid_recipient`, `unknown_thread`, `wrong_thread_peer`, `bad_thread_title`, `no_identity`, `identity_required`, `invalid_msg_ref`, `edit_has_attachments`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`not_admitted`, `wrong_identity`, `not_in_account`, `feature_disabled`, `edit_window_closed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`recipient_unresolved`, `reference_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`recipient_inbox_full`, `msg_ref_in_use`'
