                        items:
                          type: string
                      never_auto:
                        type: array
                        items:
                          type: string
                      needs_machine_opt_in:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/IdentitySelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WrongIdentity'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [trust]
      operationId: putContact
      summary: Add or amend a contact (human path; may raise trust)
      security:
        - capToken: []
        - apiKey: []
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer]
              properties:
                peer:
                  type: string
                  description: A `/k/…` address, a handle, or a namespace like `/bekir/*`.
                alias:
                  type: string
                admission:
                  type: string
                  enum: [allow, block]
                autonomy:
                  type: string
                  enum: [review, auto]
