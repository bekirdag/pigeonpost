            plan products return `{plan, namespace, mailbox}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  namespace:
                    type: [string, 'null']
                  mailbox:
                    type: [string, 'null']
                  expires_at:
                    type: integer
                  environment:
                    type: string
