          $ref: '#/components/responses/ServerError'
    post:
      tags: [purchases]
      operationId: claimApple
      summary: Turn a verified App Store purchase into a namespace or plan
      description: 404 `not_found` when App Store verification is not configured. The transaction is verified with Apple; nothing in the body is trusted.
      security:
        - memberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id:
                  type: string
                namespace:
                  type: string
                  description: The name being bought; required unless the transaction already owns one.
      responses:
        '200':
          description: |
