  /v1/events:
    get:
      tags: [events]
      operationId: events
      summary: Server-Sent Events stream for an account
      description: |
        One stream per account covering all of its mailboxes. Only metadata crosses the stream,
        never message bodies. Keep-alive comments are sent every 15 seconds. Without a resume
        cursor the stream starts at "now".

        **Event types**

        * `mail` — legacy format, unchanged. The `id:` line is the message cursor (a decimal
          integer). Data: `{event_id: integer, mailbox, message_id, sender, created_at}`.
        * Typed events — sent only when the `account_events` feature flag is enabled for the
          account. The `id:` line is `"<mail_cursor>.<event_seq>"`. Data:
          `{event_id: string, type: string, mailbox: string|null, data: object}`. Initial type:
          `features.changed` with data `{feature, enabled}`.
        * `resync_required` — no `id:` line. Data
          `{type: "resync_required", reason: "cursor_expired"}`. Sent when the resume cursor is older
          than the retained window (7 days / 10,000 events per account). The client must reload
          authoritative state (inbox, threads, capabilities) and then continue from the new ids.

        Clients must ignore event types they do not recognise.
      security:
        - memberToken: []
        - apiKey: []
      parameters:
        - name: last_event_id
          in: query
          description: Resume cursor, for clients that cannot set headers. Either a mail cursor (`"123"`) or a typed cursor (`"123.4"`).
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          description: Standard SSE resume cursor; same format as `last_event_id`.
          schema:
            type: string
      responses:
        '200':
          description: An open `text/event-stream`.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose `data:` is one of the event payload schemas.
              examples:
                mail:
                  value: "id: 1042\nevent: mail\ndata: {\"event_id\":1042,\"mailbox\":\"/k/abc\",\"message_id\":\"m1\",\"sender\":\"/k/def\",\"created_at\":1760000000}\n\n"
                typed:
                  value: "id: 1042.7\nevent: features.changed\ndata: {\"event_id\":\"1042.7\",\"type\":\"features.changed\",\"mailbox\":null,\"data\":{\"feature\":\"account_events\",\"enabled\":true}}\n\n"
                resync:
                  value: "event: resync_required\ndata: {\"type\":\"resync_required\",\"reason\":\"cursor_expired\"}\n\n"
        '400':
          $ref: '#/components/responses/UseApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: '`too_many_streams` — the account already holds too many open streams.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
