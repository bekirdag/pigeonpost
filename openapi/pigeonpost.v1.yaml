    get:
      tags: [organizations]
      operationId: org_apiKeys
      summary: List org API keys
      description: 'See docs/org-api.md §1. Requires the `orgs` and `org_api` feature flags. Owner or admin, a person signed in (member token). Never returns a secret.'
      security:
        - memberToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The org's API keys, live and revoked.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
    post:
      tags: [organizations]
      operationId: org_createApiKey
      summary: Create org API key
      description: 'See docs/org-api.md §1. Requires the `orgs` and `org_api` feature flags. Owner or admin with a recent strong sign-in (`step_up_required` with `acr_values` and `max_age`; `403 step_up_unavailable` when the server has no strong-auth `acr` configured). `send_as` is required with `messages:send` and must be an active org agent. The secret is returned once (`Cache-Control: no-store`) and stored only as SHA-256. At most 25 live keys per org. A person signed in (member token); automation gets `human_required`.'
      security:
        - memberToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: ['org:read', 'members:write', 'agents:write', 'rules:write', 'rooms:write', 'messages:send', 'audit:read', 'webhooks:write']
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 730
                ip_allowlist:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    description: IPv4 or IPv6 CIDR range.
                send_as:
                  type: string
                  description: Org agent handle, e.g. `/acme/ci-bot`. Required with `messages:send`.
            example:
              name: HR onboarding
              scopes: ['org:read', 'members:write']
              expires_in_days: 365
              ip_allowlist: [203.0.113.0/24]
      responses:
        '201':
          description: Created. The secret is shown only in this response.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [key, secret]
                properties:
                  key:
                    $ref: '#/components/schemas/OrgApiKey'
                  secret:
                    type: string
                    description: '`pk_org_` followed by 32 characters.'
        '400':
          $ref: '#/components/responses/GroupError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
        '409':
          $ref: '#/components/responses/GroupError'
