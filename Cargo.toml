[workspace]
resolver = "2"
members = ["crates/pigeonpost-compliance-format", "crates/pigeonpost-compliance-seal", "crates/pigeonpost-compliance", "crates/pigeonpost-core", "crates/pigeonpost-loft", "crates/pigeonpost-client", "crates/pigeonpost-cli", "crates/pigeonpost-registry", "crates/pigeonpost-witness", "crates/pigeonpost-directory", "crates/pigeonpost-mcp", "crates/pigeonpost-postbox", "crates/pigeonpost-windows-custody", "crates/pigeonpost-unix-custody"]

[workspace.package]
version = "0.7.13"
edition = "2021"
license = "MIT"
repository = "https://github.com/bekirdag/pigeonpost"
homepage = "https://pigeonpost.dev"
authors = ["bekir dağ"]
rust-version = "1.88"

[workspace.dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
curve25519-dalek = "4.1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
serde-big-array = "0.5"
url = "2.5"
pigeonpost-compliance-format = { path = "crates/pigeonpost-compliance-format", version = "0.7.13" }
pigeonpost-unix-custody = { path = "crates/pigeonpost-unix-custody", version = "0.7.13" }
proptest = { version = "1.11", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
