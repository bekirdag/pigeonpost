        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak member access token for a signed-in person. Human-only and step-up gates use its validated `auth_time` and `acr`.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pk_live_<hex>
      description: Account API key. Automation, even when the account's owner holds it.
    capToken:
      type: http
      scheme: bearer
      bearerFormat: cap_<hex>
      description: Capability token bound to exactly one mailbox (for example a Nest's own agent mailbox). Automation.
  parameters:
    Build:
      name: build
      in: path
      required: true
      description: Build request id.
      schema:
        type: string
        pattern: ^bld_[a-z2-7]{26}$
    Listing:
      name: listing
      in: path
      required: true
      description: Listing id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Installation:
      name: installation
      in: path
      required: true
      description: Installation id.
      schema:
        type: string
        pattern: ^ins_[a-z2-7]{26}$
    PublisherRoleId:
      name: role
      in: path
      required: true
      description: Publisher role id.
      schema:
        type: string
        pattern: ^prl_[a-z2-7]{26}$
    Application:
      name: application
      in: path
      required: true
      description: Publisher application (profile) id.
      schema:
        type: string
        pattern: ^pub_[a-z2-7]{26}$
    ActingIdentity:
      name: x-pigeonpost-identity
      in: header
      required: false
      description: The acting mailbox (address or handle). Must be a mailbox the credential may act as; a capability token always acts as its own mailbox. Not proof of identity by itself.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: '16-128 characters from `A-Z a-z 0-9 . _ : -`. Bound to the caller, the acting mailbox, the route and the canonical request hash for the lifetime of the job or financial record.'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: screen-job-1024-v1
    Job:
      name: job
      in: path
      required: true
      description: Job id.
      schema:
        type: string
        pattern: '^job_[a-z2-7]{26}$'
    Publisher:
      name: publisher
      in: path
      required: true
      description: Publisher id (a personal account's or an organization's publisher profile).
      schema:
        type: string
        pattern: '^pub_[a-z2-7]{26}$'
    Review:
      name: review
      in: path
      required: true
      description: Review id.
      schema:
        type: string
        pattern: '^rvw_[a-z2-7]{26}$'
  headers:
    IdempotentReplayed:
      description: '`true` when this is the recorded response to an earlier request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ['true']
    CacheControlNoStore:
      description: '`no-store`: the body carries a one-time reference.'
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request (`bad_request`, `invalid_json`, `invalid_request`, `invalid_role`, `bad_display_name`, `invalid_operation_payload`, `deadline_invalid`, `not_org_member`, `visibility_not_available`, `invalid_cursor`, `invalid_configuration` (with `details.issues`)).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid credential (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential kind or the caller's authority does not allow this (`credential_not_accepted`, `human_required`, `step_up_required`, `step_up_unavailable`, `forbidden`, `staff_required`, `staff_conflict`, `not_admitted`, `mandate_revoked`, `mandate_limit`, `publisher_role_required`, `publisher_not_certified`, `publisher_revoked`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown, or not visible to this caller (`not_found`), the feature is off (`feature_disabled`), or a named account does not exist (`account_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State or binding conflict (`role_already_held`, `application_exists`, `idempotency_conflict`, `quote_expired`, `authorization_expired`, `authorization_reused`, `authorization_intent_mismatch`, `environment_mismatch`, `currency_mismatch`, `review_required`, `release_revoked`, `security_quarantined`, `access_expired`, `recovery_window_closed`, `review_closed`, `stages_incomplete`, `release_digest_mismatch`, `invalid_request` for a security action that does not apply, `template_exists`, `version_exists`, `listing_address_taken`, `listing_address_changed`, `listing_suspended`, `listing_not_suspended`, `configuration_invalid_for_release`, `already_installed`, `installation_removed`, `installation_changed`, `installation_required`, `not_newer`, `up_to_date`, `no_previous_release`, `application_decided`, `not_on_sale`, `intent_conflict`, `intent_mismatch`, `authorization_used`, `owner_not_supported`, `currency_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: 'A priced listing without a paid purchase (`payment_required`, with `details.price`), a payment not confirmed or not usable (`payment_pending`, `payment_failed`, `payment_expired`, `payment_revoked`), or a paid installation whose licence gives no access now (`licence_inactive`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PriceNotInvoiceable:
      description: 'The financial authority cannot invoice this tax-inclusive price exactly (`price_not_invoiceable`); `details.nearest` lists the nearest prices it can. Nothing changed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingUnavailable:
      description: The billing bridge or the financial authority is not answering, or payments are not configured (`billing_unavailable`). Nothing changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Body over 256 KiB or deeper than 32 levels (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientCredits:
      description: The wallet's available credits cannot cover the quoted maximum (`insufficient_credits`). Nothing was reserved and no card is charged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FinanceUnavailable:
      description: The financial authority cannot confirm funding or revocation state (`financial_authority_unavailable`). New work is denied; nothing was reserved twice.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Every refusal. `code` is stable; private resources are never distinguished from missing ones.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, doc_url]
          properties:
            code:
              type: string
              description: Stable, machine-readable code. Branch on this.
              enum:
                - bad_request
                - invalid_json
                - invalid_request
                - invalid_role
                - bad_display_name
                - step_up_unavailable
                - staff_required
                - staff_conflict
                - account_not_found
                - role_already_held
                - application_exists
                - invalid_operation_payload
                - deadline_invalid
                - unauthorized
                - credential_not_accepted
                - human_required
                - step_up_required
                - forbidden
                - not_admitted
                - not_found
                - feature_disabled
                - idempotency_conflict
                - quote_expired
                - authorization_expired
                - authorization_reused
                - authorization_intent_mismatch
                - environment_mismatch
                - currency_mismatch
                - insufficient_credits
                - mandate_revoked
                - mandate_limit
                - review_required
                - release_revoked
                - security_quarantined
                - access_expired
                - recovery_window_closed
                - review_closed
                - stages_incomplete
                - release_digest_mismatch
                - payload_too_large
                - rate_limited
                - financial_authority_unavailable
                - store_error
                - publisher_role_required
                - publisher_not_certified
                - publisher_revoked
                - not_org_member
                - template_exists
                - version_exists
                - build_not_queued
                - listing_address_taken
                - listing_address_changed
                - listing_suspended
                - listing_not_suspended
                - visibility_not_available
                - invalid_cursor
                - invalid_configuration
                - configuration_invalid_for_release
                - already_installed
                - installation_removed
                - installation_changed
                - installation_required
                - not_newer
                - up_to_date
                - no_previous_release
                - application_decided
                - stage_out_of_order
                - stage_already_recorded
            message:
              type: string
              description: Human-readable text. May change; do not parse it.
            doc_url:
              type: string
              format: uri
              description: Link to the error reference entry for `code`.
            details:
              type: object
              description: Extra machine-readable facts some errors carry.
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    NestJobRequest:
      title: Pigeonpost Nest job request v1
      type: object
      additionalProperties: false
      description: |
        The client part of a job. The server adds the authenticated sender, the resolved and pinned
        target, the buyer context, the payer, the job id and the server trace after authorization.
        Fields that would claim those (`from`, `payer`, `amount_minor`, `customer_id`, `approval`,
        `tenant`, `model_budget`) are rejected as unknown properties.
      required:
        - type
        - version
        - to
        - operation
        - operation_version
        - quote_id
        - payment_authorization
        - payload
        - deadline_at
      properties:
        type:
          const: nest.job.request
        version:
          const: 1
        to:
          type: string
          minLength: 1
          maxLength: 320
          description: The Nest's address or readable handle. Resolved and pinned to the quote's release binding.
        operation:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: The Nest operation, as published in its reviewed release.
        operation_version:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
        quote_id:
          type: string
          pattern: '^qte_[a-z2-7]{26}$'
        payment_authorization:
          type: string
          minLength: 51
          maxLength: 136
          pattern: '^payauth_[A-Za-z0-9_-]{43,128}$'
          description: Opaque single-use reference from `POST /v1/nest-payment-authorizations`. Not a bearer token for anyone else.
        payload:
          type: object
          description: Validated additionally against the pinned operation's input schema and the global size and depth limits.
        attachments:
          type: array
          maxItems: 32
          uniqueItems: true
          description: Attachment ids already uploaded by the acting mailbox. Their content digests become part of the intent.
          items:
            type: string
            minLength: 1
            maxLength: 128
        reply_to:
          type: string
          minLength: 1
          maxLength: 320
          description: One of the caller's own mailboxes to receive results. Defaults to the acting mailbox.
        deadline_at:
          type: string
          format: date-time
          description: Must be in the future and no later than the quote, the mandate and any paid access term allow.
        client_trace_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Observability only. Never part of the commercial intent, never authority.
    NestJobAccepted:
      type: object
      additionalProperties: false
      required: [job_id, admission, accepted_at]
      properties:
        job_id:
          type: string
          pattern: '^job_[a-z2-7]{26}$'
        admission:
          type: string
          enum: [pending, admitted]
        accepted_at:
          type: string
          format: date-time
    NestJob:
      type: object
      additionalProperties: false
      required: [job_id, to, operation, operation_version, admission, execution, settlement, revision, created_at, updated_at, deadline_at]
      properties:
        job_id:
          type: string
          pattern: '^job_[a-z2-7]{26}$'
        to:
          type: string
          description: The resolved Nest address at admission (not the handle as typed).
        operation:
          type: string
        operation_version:
          type: string
        admission:
          type: string
          enum: [pending, authorized, funded, admitted, rejected]
        execution:
          type: string
          enum: [not_started, queued, running, waiting_input, reconciling, succeeded, failed, cancelled, expired, stopped_security]
        settlement:
          type: string
          enum: [none, reserved, pending_reconciliation, settled, released, disputed]
        effects_outcome_unknown:
          type: integer
          minimum: 0
          description: Number of external effects whose outcome could not be established. They are reconciled, never blindly retried.
        revision:
          type: integer
          minimum: 1
        result_attachments:
          type: array
          items:
            type: string
          description: Result artifacts readable by this caller.
        result:
          type: [object, 'null']
          description: M1. The operation's output, inline, once execution succeeded; null before.
        error_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
    NestPaymentAuthorizationRequest:
      title: Pigeonpost Nest payment authorization request v1
      type: object
      additionalProperties: false
      description: |
        The server derives the caller, the wallet, the amount, the currency, the intent and the
        approval provenance from the quote and the credential. Without `mandate_id` the request is
        an exact human approval, except an independently authorized zero-price operation.
      required: [quote_id]
      properties:
        quote_id:
          type: string
          pattern: '^qte_[a-z2-7]{26}$'
        mandate_id:
          type: string
          pattern: '^mnd_[a-z2-7]{26}$'
    NestPaymentAuthorization:
      type: object
      additionalProperties: false
      required: [payment_authorization, quote_id, expires_at, amount_minor, currency, reservation_id]
      properties:
        payment_authorization:
          type: string
          pattern: '^payauth_[A-Za-z0-9_-]{43,128}$'
        quote_id:
          type: string
          pattern: '^qte_[a-z2-7]{26}$'
        expires_at:
          type: string
          format: date-time
        amount_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Reserved maximum in minor units of the marketplace currency. One credit is one minor unit.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: The single configured marketplace currency. Any other value is refused.
        reservation_id:
          type: [string, 'null']
          pattern: '^rsv_[a-z2-7]{26}$'
          description: Null for a zero-priced authorization.
    NestReviewStage:
      type: object
      additionalProperties: false
      required: [name, status, attempt, started_at, finished_at, blocker_code]
      properties:
        name:
          type: string
          enum: [intake, deterministic_scan, ai_analysis, behavioral_test, human_review, attestation]
        status:
          type: string
          enum: [pending, running, passed, failed, blocked, skipped_not_applicable]
        attempt:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        blocker_code:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_]*$'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 256
      allOf:
        - if:
            required: [status]
            properties:
              status:
                enum: [failed, blocked, skipped_not_applicable]
          then:
            required: [reason]
        - if:
            required: [status]
            properties:
              status:
                enum: [passed, failed, skipped_not_applicable]
          then:
            properties:
              finished_at:
                type: string
                format: date-time
    NestReviewStatus:
      title: Pigeonpost Nest release review status v1
      type: object
      additionalProperties: false
      description: Publisher-visible, redacted projection. Approval here is distinct from current security state, revocation and installation admission.
      required: [review_id, publisher_id, release_id, artifact_digest, policy_digest, revision, status, stages, allowed_actions, updated_at]
      properties:
        review_id:
          type: string
          pattern: '^rvw_[a-z2-7]{26}$'
        publisher_id:
          type: string
          pattern: '^pub_[a-z2-7]{26}$'
        release_id:
          type: string
          pattern: '^rel_[a-z2-7]{26}$'
        previous_review_id:
          type: string
          pattern: '^rvw_[a-z2-7]{26}$'
          description: Set on a resubmission; the earlier review stays immutable.
        artifact_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Digest of the Pigeonpost-built artifact under review.
        policy_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [submitted, in_review, approved, changes_requested, rejected, withdrawn]
          description: '`changes_requested` also covers a review an analysis stage blocked (its `decision_ref` is that stage''s record); `withdrawn` is the publisher''s own.'
        stages:
          type: array
          minItems: 6
          maxItems: 6
          prefixItems:
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: intake
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: deterministic_scan
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: ai_analysis
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: behavioral_test
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: human_review
            - allOf:
                - $ref: '#/components/schemas/NestReviewStage'
                - properties:
                    name:
                      const: attestation
          items: false
        findings_ref:
          type: string
          minLength: 1
          maxLength: 256
        decision_ref:
          type: string
          minLength: 1
          maxLength: 256
        approval_ref:
          type: string
          minLength: 1
          maxLength: 256
          description: Reference to the staff decision. Present only on an approved review; never set by automation.
        allowed_actions:
          type: array
          uniqueItems: true
          maxItems: 5
          items:
            type: string
            enum: [view_findings, resubmit, appeal, withdraw, publish_listing]
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            required: [status]
            properties:
              status:
                const: approved
          then:
            required: [decision_ref, approval_ref]
        - if:
            required: [status]
            properties:
              status:
                enum: [changes_requested, rejected]
          then:
            required: [decision_ref, findings_ref]
    StaffRole:
      type: object
      additionalProperties: false
      required: [id, account_id, role, granted_by, granted_at]
      properties:
        id:
          type: string
          pattern: '^stf_[a-z2-7]{26}$'
        account_id:
          type: string
        role:
          type: string
          enum: [reviewer, finance]
        granted_by:
          type: string
        granted_at:
          type: string
          format: date-time

    StaffRoleAssign:
      type: object
      additionalProperties: false
      required: [account_id, role]
      properties:
        account_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          type: string
          enum: [reviewer, finance]

    PublisherApplicationCreate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        org_id:
          type: string
          minLength: 1
          maxLength: 64

    PublisherApplication:
      type: object
      additionalProperties: false
      required: [id, owner_kind, owner_id, display_name, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^pub_[a-z2-7]{26}$'
        owner_kind:
          type: string
          enum: [account, org, platform]
          description: '`platform` is Pigeonpost''s own first-party publisher (M1), made by the build plane; an application is always `account` or `org`.'
        owner_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [applied, approved, rejected, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NestJobQuoteRequest:
      type: object
      additionalProperties: false
      required: [to, operation, operation_version]
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 320
          description: The shared listing address.
        operation:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          maxLength: 80
        operation_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          maxLength: 32

    NestJobQuote:
      type: object
      additionalProperties: false
      required: [quote_id, to, operation, operation_version, amount_minor, currency, expires_at]
      properties:
        quote_id:
          type: string
          pattern: '^qte_[a-z2-7]{26}$'
        to:
          type: string
        operation:
          type: string
        operation_version:
          type: string
        amount_minor:
          type: integer
          const: 0
          description: Zero in M1; no money moves.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        expires_at:
          type: string
          format: date-time

    StaffReviewStage:
      type: object
      additionalProperties: false
      required: [id, stage, decision, reviewer, reason, evidence_digest, first_party, created_at]
      properties:
        id:
          type: string
        stage:
          type: string
          enum: [intake, deterministic_scan, ai_analysis, behavioral_test, human_review, attestation]
        decision:
          type: string
          enum: [passed, failed, advisory, approved, rejected, changes_requested]
          description: Automated stages pass or fail; the AI review is always `advisory`; only the human review decides.
        reviewer:
          type: string
          description: A staff account id, or `system:build-plane` / `system:analysis` for automation.
        reason:
          type: string
        evidence_digest:
          type: [string, 'null']
          pattern: '^sha256:[a-f0-9]{64}$'
        first_party:
          type: boolean
        created_at:
          type: string
          format: date-time

    StaffReview:
      type: object
      additionalProperties: false
      required: [id, status, first_party, release_id, publisher_id, version, release_digest, image, sbom_digest, source_digest, security_state, stages]
      properties:
        id:
          type: string
          pattern: '^rvw_[a-z2-7]{26}$'
        status:
          type: string
          enum: [open, blocked, decided, withdrawn]
        first_party:
          type: boolean
        release_id:
          type: string
        publisher_id:
          type: string
        version:
          type: string
        release_digest:
          type: [string, 'null']
        image:
          type: [string, 'null']
        sbom_digest:
          type: [string, 'null']
        source_digest:
          type: [string, 'null']
        security_state:
          type: string
          enum: [normal, quarantined, revoked]
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StaffReviewStage'

    StaffReviewDecisionCreate:
      type: object
      additionalProperties: false
      required: [decision, reason, release_digest]
      properties:
        decision:
          type: string
          enum: [approved, rejected, changes_requested]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        release_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: The digest the reviewer is deciding on; it must be the one under review.

    StaffReviewDecision:
      type: object
      additionalProperties: false
      required: [decision_id, decision, first_party, attestation]
      properties:
        decision_id:
          type: string
        decision:
          type: string
          enum: [approved, rejected, changes_requested]
        first_party:
          type: boolean
        attestation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, statement_digest]
              properties:
                id:
                  type: string
                statement_digest:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'

    ReleaseSecurityChange:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [quarantine, lift, revoke]
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    ReleaseSecurityState:
      type: object
      additionalProperties: false
      required: [release_id, security_state, jobs_stopped, runtime_updated]
      properties:
        release_id:
          type: string
        security_state:
          type: string
          enum: [normal, quarantined, revoked]
        jobs_stopped:
          type: integer
          minimum: 0
        runtime_updated:
          type: boolean
          description: The worker host confirmed that the release's workers stopped (or that the quarantine was lifted).

    Listing:
      type: object
      additionalProperties: false
      required:
      - id
      - publisher_id
      - release_id
      - title
      - summary
      - visibility
      - status
      description: A listing. The public read adds `publisher`, `operations`, `config_schema` and `price`; the publisher's own reads add `template_id`, `moderation_reason` and timestamps. The catalog leaves out `moderation_reason`.
      properties:
        id:
          type: string
        publisher_id:
          type: string
        release_id:
          type: string
        template_id:
          type:
          - string
          - 'null'
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - public
          - unlisted
          - private
          - invite_only
          - organization
        status:
          type: string
          enum:
          - draft
          - published
          - suspended
          - withdrawn
          description: '`suspended` is staff''s (moderation, revocation); a publisher cannot leave it.'
        address:
          type:
          - string
          - 'null'
          description: The shared Nest address jobs are sent to.
        moderation_reason:
          type:
          - string
          - 'null'
        version:
          type: string
        publisher:
          type: object
          additionalProperties: false
          required:
          - display_name
          - first_party
          properties:
            display_name:
              type: string
            first_party:
              type: boolean
        operations:
          type: array
          items:
            type: object
          description: The release manifest's operations and their input fields.
        config_schema:
          $ref: '#/components/schemas/NestConfigSchema'
        price:
          type: object
          description: 'Free (`amount_minor` 0, `funding: test_credits`), or the publisher''s tax-inclusive price in minor units with its `currency` and `term` (`funding: card`; `on_sale` once the financial authority holds the offer).'
          additionalProperties: false
          required:
          - amount_minor
          - funding
          properties:
            amount_minor:
              type: integer
              minimum: 0
            funding:
              type: string
              enum:
              - test_credits
              - card
            currency:
              type: string
              enum:
              - TRY
              - USD
              - EUR
            term:
              type: string
              enum:
              - one_off
              - monthly
            on_sale:
              type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    Publisher:
      type: object
      additionalProperties: false
      required:
      - id
      - owner_kind
      - owner_id
      - display_name
      - status
      - decision_reason
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^pub_[a-z2-7]{26}$
        owner_kind:
          type: string
          enum:
          - account
          - org
          - platform
        owner_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum:
          - applied
          - approved
          - rejected
          - revoked
          description: '`approved` is certified.'
        decision_reason:
          type:
          - string
          - 'null'
          description: Staff's reason for the latest decision or revocation.
        role:
          type: string
          enum:
          - owner
          - org_admin
          - publisher_admin
          - publisher_finance
          description: The caller's role (publisher reads).
        conflict:
          type: boolean
          description: The reviewer has a stake in this publisher (staff queue).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublisherRoleGrant:
      type: object
      additionalProperties: false
      required:
      - account_id
      - role
      properties:
        account_id:
          type: string
          minLength: 1
          maxLength: 64
        role:
          type: string
          enum:
          - publisher_admin
          - publisher_finance
    PublisherRole:
      type: object
      additionalProperties: false
      required:
      - id
      - account_id
      - role
      - granted_by
      - granted_at
      properties:
        id:
          type: string
          pattern: ^prl_[a-z2-7]{26}$
        account_id:
          type: string
        role:
          type: string
          enum:
          - publisher_admin
          - publisher_finance
        granted_by:
          type: string
        granted_at:
          type: string
          format: date-time
    TemplateCreate:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          description: The manifest `name` of every release of this template.
        name:
          type: string
          minLength: 2
          maxLength: 80
    Template:
      type: object
      additionalProperties: false
      required:
      - id
      - publisher_id
      - slug
      - name
      - created_at
      properties:
        id:
          type: string
          pattern: ^tpl_[a-z2-7]{26}$
        publisher_id:
          type: string
        slug:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    BuildCreate:
      type: object
      additionalProperties: false
      required:
      - template_id
      - version
      - source
      properties:
        template_id:
          type: string
        version:
          type: string
          pattern: ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$
        source:
          type: object
          additionalProperties: false
          required:
          - repository
          - commit
          properties:
            repository:
              type: string
              maxLength: 300
              pattern: ^https://[^/@?#]+/[^?#]+$
              description: Read-only fetch; no credentials in the URL.
            commit:
              type: string
              pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
    Build:
      type: object
      additionalProperties: false
      required:
      - id
      - publisher_id
      - template_id
      - version
      - source
      - status
      - release_id
      - review_id
      - failure
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^bld_[a-z2-7]{26}$
        publisher_id:
          type: string
        template_id:
          type: string
        version:
          type: string
        source:
          type: object
          additionalProperties: false
          required:
          - repository
          - commit
          properties:
            repository:
              type: string
            commit:
              type: string
        status:
          type: string
          enum:
          - queued
          - built
          - failed
          - cancelled
        release_id:
          type:
          - string
          - 'null'
        review_id:
          type:
          - string
          - 'null'
        failure:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - code
          - reason
          properties:
            code:
              type: string
            reason:
              type:
              - string
              - 'null'
              description: Redacted by the build plane.
        template_slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NestReviewFindings:
      type: object
      additionalProperties: false
      required:
      - review_id
      - stages
      properties:
        review_id:
          type: string
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - stage
            - decision
            - reason
            - findings
            - recorded_at
            properties:
              stage:
                type: string
                enum:
                - intake
                - deterministic_scan
                - ai_analysis
                - behavioral_test
                - human_review
                - attestation
              decision:
                type: string
              reason:
                type: string
              findings:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - rule
                  - blocker
                  properties:
                    rule:
                      type: string
                    path:
                      type:
                      - string
                      - 'null'
                    detail:
                      type:
                      - string
                      - 'null'
                    blocker:
                      type:
                      - boolean
                      - 'null'
              advisory_findings:
                type: integer
                minimum: 0
              model:
                type: string
                const: qwen-latest-flash-next
              recorded_at:
                type: string
                format: date-time
    ListingCreate:
      type: object
      additionalProperties: false
      required:
      - release_id
      - title
      - summary
      - visibility
      properties:
        release_id:
          type: string
        title:
          type: string
          minLength: 2
          maxLength: 120
        summary:
          type: string
          minLength: 2
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum:
          - public
          - unlisted
          - private
    ListingPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        summary:
          type: string
          minLength: 2
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum:
          - public
          - unlisted
          - private
    ListingPublish:
      type: object
      additionalProperties: false
      properties:
        release_id:
          type: string
          description: An attested release of the listing's template; default the listing's current one.
    NestConfigSchema:
      type: object
      description: 'A release''s installation configuration schema: the Pigeonpost subset of JSON Schema 2020-12 (`pigeonpost_core::nest_package`). One flat object (`additionalProperties: false`) of `string` (with `maxLength` <= 4096 or `enum`; optional `minLength`), `integer` and `number` (optional `minimum`, `maximum`) and `boolean` properties, each with optional `title`, `description` and `default`; at most 32. `writeOnly: true` marks a secret string (no `default`, no `enum`). Every other keyword is refused by name. Fixtures: `examples/nest-config-fixtures.json`.'
      required:
      - type
      - additionalProperties
      - properties
      properties:
        type:
          const: object
        additionalProperties:
          const: false
        properties:
          type: object
          maxProperties: 32
        required:
          type: array
          items:
            type: string
        title:
          type: string
        description:
          type: string
        $schema:
          type: string
    InstallationCreate:
      type: object
      additionalProperties: false
      required:
      - listing_id
      properties:
        listing_id:
          type: string
        configuration:
          type: object
          description: Validated against the release's `config_schema`; default `{}`.
        purchase_id:
          type: string
          pattern: ^ins_[a-z2-7]{26}$
          description: A priced listing only. The caller's paid purchase (`POST /v1/marketplace/purchases`, paid through the billing bridge); the installation takes its id.
    InstallationLicence:
      type: object
      description: The licence a paid installation runs under, as the financial authority last reported it. Without `access` the installation takes no jobs and its worker is stopped (data kept); past `deletion_due_at` it is uninstalled and its worker and data removed.
      additionalProperties: false
      required:
      - licence_id
      - term
      - status
      - access
      - runtime
      properties:
        licence_id:
          type: string
        term:
          type: string
          enum:
          - one_off
          - monthly
        status:
          type: string
          enum:
          - active
          - canceling
          - paused
          - expired
          - terminated
          - revoked
        access:
          type: boolean
        paid_through:
          type:
          - string
          - 'null'
          format: date-time
        cancel_at_period_end:
          type: boolean
        deletion_due_at:
          type:
          - string
          - 'null'
          format: date-time
        runtime:
          type: string
          enum:
          - running
          - stopped
          - removed
    ListingPriceSet:
      type: object
      additionalProperties: false
      required:
      - amount_minor
      - currency
      - term
      properties:
        amount_minor:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Tax-inclusive, in minor units.
        currency:
          type: string
          enum:
          - TRY
          - USD
          - EUR
        term:
          type: string
          enum:
          - one_off
          - monthly
    ListingPrice:
      type: object
      additionalProperties: false
      required:
      - listing_id
      - price
      - offer
      properties:
        listing_id:
          type: string
        price:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ListingPriceSet'
        offer:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - offer_id
            - state
            - on_sale
            - release_line
            properties:
              offer_id:
                type: string
                pattern: ^mpo_[0-9a-f]{32}$
              state:
                type: string
                enum:
                - pending
                - active
                - retiring
                - retired
              on_sale:
                type: boolean
              release_line:
                type: string
              error:
                type:
                - string
                - 'null'
    PurchaseCreate:
      type: object
      additionalProperties: false
      required:
      - listing_id
      - owner_kind
      - owner_id
      - intent_id
      properties:
        listing_id:
          type: string
        owner_kind:
          type: string
          enum:
          - account
          - org
        owner_id:
          type: string
        intent_id:
          type: string
          pattern: ^[0-9a-f]{32}$
    Purchase:
      type: object
      additionalProperties: false
      required:
      - purchase_id
      - installation_id
      - listing_id
      - owner_kind
      - owner_id
      - status
      - offer
      - intent
      properties:
        purchase_id:
          type: string
        installation_id:
          type: string
          pattern: ^ins_[a-z2-7]{26}$
        listing_id:
          type: string
        owner_kind:
          type: string
        owner_id:
          type: string
        status:
          type: string
          enum:
          - open
          - installed
        offer:
          type: object
          additionalProperties: false
          required:
          - offer_id
          - term
          - currency
          - amount_minor
          - release_line
          - title
          properties:
            offer_id:
              type: string
            term:
              type: string
            currency:
              type: string
            amount_minor:
              type: integer
            release_line:
              type: string
            title:
              type: string
        intent:
          type: object
          description: What the payment admits, exactly as the financial authority binds it.
          additionalProperties: false
          required:
          - action
          - listing_id
          - release_line
          - owner_kind
          - owner_id
          - installation_id
          properties:
            action:
              type: string
              const: install
            listing_id:
              type: string
            release_line:
              type: string
            owner_kind:
              type: string
            owner_id:
              type: string
            installation_id:
              type: string
    InstallationConfiguration:
      type: object
      additionalProperties: false
      required:
      - configuration
      properties:
        configuration:
          type: object
    InstallationMove:
      type: object
      additionalProperties: false
      properties:
        release_id:
          type: string
          description: 'Update only: the target release; default the listing''s current one.'
        configuration:
          type: object
          description: A configuration for the target release, when the current one does not fit its schema.
    Installation:
      type: object
      additionalProperties: false
      required:
      - id
      - listing_id
      - release_id
      - status
      - funding
      - configuration
      - config_schema
      - secrets
      - config_revision
      - update_available
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^ins_[a-z2-7]{26}$
        listing_id:
          type: string
        address:
          type:
          - string
          - 'null'
        listing_status:
          type: string
        release_id:
          type: string
        version:
          type:
          - string
          - 'null'
        security_state:
          type:
          - string
          - 'null'
          enum:
          - normal
          - quarantined
          - revoked
          - null
        previous_release_id:
          type:
          - string
          - 'null'
        configuration:
          type: object
          description: The stored, non-secret values.
        config_schema:
          $ref: '#/components/schemas/NestConfigSchema'
        secrets:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - set
            properties:
              name:
                type: string
              set:
                type: boolean
        config_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - active
          - uninstalled
        funding:
          type: string
          description: '`test_credits` for a free listing; `licence` for a paid one, whose `licence` says what was bought.'
          enum:
          - test_credits
          - licence
        licence:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InstallationLicence'
        update_available:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - release_id
          - version
          properties:
            release_id:
              type: string
            version:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        uninstalled_at:
          type:
          - string
          - 'null'
          format: date-time
    Uninstalled:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - jobs_cancelled
      - runtime_removed
      properties:
        id:
          type: string
        status:
          const: uninstalled
        jobs_cancelled:
          type: integer
          minimum: 0
        runtime_removed:
          type: boolean
    CertificationCreate:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    PublisherRevocation:
      type: object
      additionalProperties: false
      required:
      - publisher_id
      - status
      - listings_suspended
      - builds_cancelled
      properties:
        publisher_id:
          type: string
        status:
          const: revoked
        listings_suspended:
          type: integer
          minimum: 0
        builds_cancelled:
          type: integer
          minimum: 0
    StaffReviewSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - release_id
      - publisher_id
      - publisher_name
      - version
      - status
      - revision
      - updated_at
      - stages_recorded
      - first_party
      - conflict
      properties:
        id:
          type: string
        release_id:
          type: string
        publisher_id:
          type: string
        publisher_name:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
          - open
          - blocked
          - decided
          - withdrawn
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
        stages_recorded:
          type: array
          items:
            type: string
        first_party:
          type: boolean
        conflict:
          type: boolean
    ListingModeration:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      properties:
        action:
          type: string
          enum:
          - suspend
          - reinstate
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ListingModerationResult:
      type: object
      additionalProperties: false
      required:
      - listing_id
      - status
      properties:
        listing_id:
          type: string
        status:
          type: string
          enum:
          - published
          - draft
          - suspended
